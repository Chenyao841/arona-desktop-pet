spring:
  application:
    name: zhuochong
  main:
    headless: false   # 桌面视觉需要 java.awt.Robot 截屏，必须关闭 headless（Spring Boot 默认 true 会致截屏失败）
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 100MB

server:
  port: 8080

mybatis:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: false

tts:
  # 本机路径全部支持环境变量覆盖（统一在项目根「环境变量配置.bat」里改）：ZC_PYTHON / ZC_TTS_DIR / ZC_TTS_AUTOSTART
  python: ${ZC_PYTHON:}
  api-dir: ${ZC_TTS_DIR:}
  auto-start: ${ZC_TTS_AUTOSTART:true}

netease:
  node: ${ZC_NODE:}
  app: ${ZC_NETEASE_APP:}
  auto-start: ${ZC_NETEASE_AUTOSTART:true}

# 数据库连接兜底（环境变量 ZC_DB_* 优先；改一处就够：环境变量配置.bat）
zc:
  db:
    host: ${ZC_DB_HOST:127.0.0.1}
    port: ${ZC_DB_PORT:3306}
    name: ${ZC_DB_NAME:db03}
    user: ${ZC_DB_USER:root}
    password: ${ZC_DB_PASSWORD:}

bili:
  room-id: ${ZC_BILI_ROOM_ID:0}

# QQ 机器人（NapCat 正向 WebSocket / OneBot 11）
# enabled 默认 false：不开启就完全不连、不启线程，桌宠主链路零影响
# 敏感值（token）只走环境变量，见「环境变量配置.bat」或云端启动脚本
qq:
  enabled: ${ZC_QQ_ENABLED:false}
  ws-url: ${ZC_QQ_WS_URL:ws://127.0.0.1:3001}
  ws-token: ${ZC_QQ_WS_TOKEN:}
  self-id: ${ZC_QQ_SELF_ID:0}          # 0 = 连上后 get_login_info 自动识别
  # 机器人在 QQ 里的显示名（放版本号用，例如 阿罗娜（v0.0.7测试））。
  # 连上 NapCat 后和当前昵称比一次：不一样才调 set_qq_profile 改一次；一样什么都不做；留空 = 完全不动
  nickname: ${ZC_QQ_NICKNAME:}
  # 公网入口闸门：非本机请求只放行下面这些前缀（小游戏页面+健康检查），其余一律 401。
  # 桌宠那套接口（/talk、/ai/**、*.html）历史上无鉴权，靠这条守住；true 可整体关掉（只在排障时用）
  public-open: ${ZC_QQ_PUBLIC_OPEN:false}
  public-paths: ${ZC_QQ_PUBLIC_PATHS:/qq_pic,/qq/status}
  trigger-mode: ${ZC_QQ_TRIGGER_MODE:at}   # at（只理 @）/ all（全量，风控风险高）
  per-user-cooldown-sec: ${ZC_QQ_USER_COOLDOWN:60}
  group-whitelist: ${ZC_QQ_GROUP_WHITELIST:}  # 逗号分隔，空=不限
  # 分段发言：每条 ≤300 字，条间隔 400~800ms 随机
  max-chunk-chars: 300
  chunk-delay-min-ms: 400
  chunk-delay-max-ms: 800
  max-chunks: 6
  heartbeat-sec: 30
  connect-timeout-sec: 10
  reconnect-max-sec: 60
  # P1/P4：表情包（素材 = static/qq_emoji/ 下的官方头部特写差分，标注见 emoji_map.json）
  emoji-enabled: ${ZC_QQ_EMOJI:true}
  emoji-probability: 100          # 通过前两道闸门后再随机抑制一次，100 = 不抑制
  emoji-min-gap: ${ZC_QQ_EMOJI_GAP:5}          # 中间至少隔几条回复才允许再发一张
  emoji-strong-emotions: ${ZC_QQ_EMOJI_STRONG:激动,害羞,生气,慌张,难过,开心,震惊,俏皮}
  # P1：群里发图 → 下载 → 缩到长边 ≤800px → 视觉模型理解，再进对话
  vision-enabled: ${ZC_QQ_VISION:true}
  vision-max-edge: 800
  vision-max-images: 2
  vision-max-tokens: ${ZC_QQ_VISION_MAX_TOKENS:4000}   # 推理模型会先花掉一部分在思考上，给小了 content 会是空的
  # 被追问图片细节时，重读留底的原图（拿"当前问题"当提示词）；false = 只用第一次的 90 字描述
  image-reread: ${ZC_QQ_IMAGE_REREAD:true}
  image-reread-max: 2
  # 图片留底（落盘）：重启后编号仍可重读；内存里只放轻量索引
  image-store-dir: ${ZC_QQ_IMAGE_DIR:qq_images}
  image-max-per-group: ${ZC_QQ_IMAGE_MAX_GROUP:500}   # 单个群最多留几张（超出删最早）
  image-max-per-user: ${ZC_QQ_IMAGE_MAX_USER:500}     # 私聊（管理员 QQ）每人最多留几张
  image-max-total: ${ZC_QQ_IMAGE_MAX_TOTAL:3000}      # 全局兜底，防群多时吃满磁盘
  image-ttl-hours: ${ZC_QQ_IMAGE_TTL_HOURS:24}        # 留底有效期
  # 跟风复读机（主动接话·纯代码不花 token）：同一句话被不同人重复到门槛后，按概率复读一次
  parrot-enabled: ${ZC_QQ_PARROT:true}
  parrot-probability: ${ZC_QQ_PARROT_PROB:33}      # 每次触发机会的复读概率（%）
  parrot-min-users: ${ZC_QQ_PARROT_MIN_USERS:3}    # 需要几个不同用户重复同一句话
  parrot-window-sec: ${ZC_QQ_PARROT_WINDOW:180}    # 重复统计窗口（秒）
  parrot-cooldown-triggers: ${ZC_QQ_PARROT_COOLDOWN:1}  # 复读成功后还要跳过几次触发
  parrot-max-per-hour: ${ZC_QQ_PARROT_MAX_HOUR:3}  # 每组每小时最多复读几次（0=不限）
  parrot-max-chars: 60                             # 超过这个字数的句子不参与复读
  # 护短（主动接话·调 AI）：群友 @管理员 或提管理员昵称 + 调侃语气 → 站出来反驳
  defend-enabled: ${ZC_QQ_DEFEND:true}
  defend-cooldown-triggers: ${ZC_QQ_DEFEND_COOLDOWN:3}   # 护短一次后跳过几次触发机会
  defend-max-per-hour: ${ZC_QQ_DEFEND_MAX_HOUR:5}        # 每组每小时最多护短几次（0=不限）
  # 调侃性关键词（逗号分隔；也认"就这/不会吧/啧啧/笑死/离谱"这类语气标记）
  defend-keywords: ${ZC_QQ_DEFEND_KEYWORDS:菜,菜鸡,菜鸟,笨蛋,傻瓜,憨,鸽,又鸽,摸鱼,划水,偷懒,摆烂,躺平,辣鸡,垃圾,废物,不行,拉胯}
  # 管理员的叫法（名字类，逗号分隔）：群里怎么叫管理员就算"提到他"。
  # 群名片机器人会自己记（管理员在该群说一句话就登记，比如「小羊羔」），这里配的是额外叫法。
  defend-admin-alias: ${ZC_QQ_DEFEND_ALIAS:小羊羔,小羊}
  # 引申调侃词（逗号分隔）：这些词单独出现不算，但管理员刚发过言（下面那个窗口内）就算在说他，
  # 典型场景：管理员叫「小羊羔」，群友说「今晚想吃烤羊」
  defend-mock-words: ${ZC_QQ_DEFEND_MOCK:羊肉,烤羊,涮羊肉,羊肉串,羊排,全羊,羊蝎子}
  # 上下文窗口（秒）：管理员最近一次发言在这个时间内，引申调侃词才算"在说他"（0 = 关掉这条路）
  defend-context-sec: ${ZC_QQ_DEFEND_CONTEXT_SEC:180}
  # ---------- 小游戏：你画我猜 ----------
  # 总闸（紧急刹车）。注意"默认关闭"不是靠这里：而是靠【群白名单为空】——管理员用 /游戏 开 <群号> 一个个开放
  pic-enabled: ${ZC_QQ_PIC:true}
  pic-max-rounds: ${ZC_QQ_PIC_MAX_ROUNDS:20}          # 每局最多提交几轮（0 = 不限）
  pic-timeout-min: ${ZC_QQ_PIC_TIMEOUT_MIN:10}        # 每局最长几分钟，到点自动揭晓答案
  pic-next-cooldown-sec: ${ZC_QQ_PIC_NEXT_CD:60}      # 「更换题目」冷却（按人；管理员不限）
  pic-daily-token-limit: ${ZC_QQ_PIC_DAILY_TOKENS:500000}   # 游戏额度，独立于日常对话额度（0 = 不限）
  pic-base-url: ${ZC_QQ_PIC_BASE_URL:http://47.93.180.198:8080}   # 绘图页对外地址（拼群里链接用）
  pic-quota-reply: ${ZC_QQ_PIC_QUOTA_REPLY:今天的画画额度用完啦，明天再来玩吧～}
  pic-image-max-width: 768                            # 画稿缩到最长边多少像素（省流量+省视觉 token）  send-retry: 1                   # 发送失败重试几次（NapCat 偶发超时）
  # P3 管理员体系：只有这些 QQ 能私聊机器人、能用管理指令（逗号分隔，留空=没有管理员）
  admin-qq: ${ZC_QQ_ADMIN_QQ:}
  admin-only-private: ${ZC_QQ_ADMIN_ONLY_PRIVATE:true}
  # P3 记忆隔离：group（每群一份）/ user（每群每人一份）/ off（与桌宠共用，不建议）
  memory-scope: ${ZC_QQ_MEMORY_SCOPE:group}
  memory-consolidate-every: ${ZC_QQ_MEMORY_EVERY:20}   # 每 N 条群消息后台提炼一次记忆（0=不自动）
  # P3 每日 token 上限（0=不限；只统计 QQ 群，不含桌宠端）
  daily-token-limit: ${ZC_QQ_DAILY_TOKENS:0}   # 0 = 不限
  quota-alert-percent: ${ZC_QQ_QUOTA_ALERT:80}  # 用到这里百分比就私聊提醒管理员（0=不提醒；用满 100% 必提醒一次）
  # P4 回复节奏：收到 @ 后至少等这么久才回（想得快也不提前说），0 = 立刻回
  reply-delay-sec: ${ZC_QQ_REPLY_DELAY:3}
  # P4 恶意 @：延迟窗口内同一个人连续 @ 到这个次数就拉黑（仅管理员能解）
  blacklist-burst: ${ZC_QQ_BLACKLIST_BURST:4}
  # P4 引用回复（回复带"回复 XX：…"的引用框）
  quote-reply: ${ZC_QQ_QUOTE:true}
  # P4 额度用尽时对被 @ 的固定说明
  quota-reply: ${ZC_QQ_QUOTA_REPLY:今天我说话太多啦，额度用完了……管理员充值后我就回来～}
  # P4 同时允许几条消息在"思考"（调模型）
  ai-threads: ${ZC_QQ_AI_THREADS:4}

# 登录账号（本地默认账号：不读数据库，无需 adminlist）
# identity 只要不等于「员工」就有写权限（管理页 isAdmin / 后端 Interceptor 按此判断）
login:
  username: 老师
  password: 123456
  name: 老师
  identity: 管理员
# AI 视觉（多模态）模型名：必须指向真正支持 image_url 输入的模型
# 官方 api.deepseek.com 的 deepseek-chat 是纯文本，没有视觉能力；换网关就改这里，不用重新打包
ai:
  vision-model: ${ZC_AI_VISION_MODEL:deepseek-v4-flash-vision-exp}
  # 推理强度（留空=服务端默认）。推理模型把 token 花在思考上导致"看不到图"时，设 low 最有效
  vision-effort: ${ZC_AI_VISION_EFFORT:}
  # QQ 群聊是否也注入「风格语料」（和桌宠同一套参考语境）；false = 不注入
  style-for-qq: ${ZC_AI_STYLE_FOR_QQ:true}
  # QQ 渠道是否复用桌宠的「功能清单」(ai_prompt.function)：默认 false（那份清单是点歌/麻将/抽卡/看屏幕，群里做不到）
  # QQ 专用能力清单请建 prompt_type=qq_function（管理员在 QQ 里：/prompt set qq_function 内容）
  function-for-qq: ${ZC_AI_FUNCTION_FOR_QQ:false}
