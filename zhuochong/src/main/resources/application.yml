spring:
  application:
    name: zhuochong
  main:
    headless: false   # 桌面视觉需要 java.awt.Robot 截屏，必须关闭 headless（Spring Boot 默认 true 会致截屏失败）
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 100MB

server:
  port: 8080

mybatis:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: false

tts:
  # 本机路径全部支持环境变量覆盖（统一在项目根「环境变量配置.bat」里改）：ZC_PYTHON / ZC_TTS_DIR / ZC_TTS_AUTOSTART
  python: ${ZC_PYTHON:}
  api-dir: ${ZC_TTS_DIR:}
  auto-start: ${ZC_TTS_AUTOSTART:true}

netease:
  node: ${ZC_NODE:}
  app: ${ZC_NETEASE_APP:}
  auto-start: ${ZC_NETEASE_AUTOSTART:true}

# 数据库连接兜底（环境变量 ZC_DB_* 优先；改一处就够：环境变量配置.bat）
zc:
  db:
    host: ${ZC_DB_HOST:127.0.0.1}
    port: ${ZC_DB_PORT:3306}
    name: ${ZC_DB_NAME:db03}
    user: ${ZC_DB_USER:root}
    password: ${ZC_DB_PASSWORD:}

bili:
  room-id: ${ZC_BILI_ROOM_ID:0}

# QQ 机器人（NapCat 正向 WebSocket / OneBot 11）
# enabled 默认 false：不开启就完全不连、不启线程，桌宠主链路零影响
# 敏感值（token）只走环境变量，见「环境变量配置.bat」或云端启动脚本
qq:
  enabled: ${ZC_QQ_ENABLED:false}
  ws-url: ${ZC_QQ_WS_URL:ws://127.0.0.1:3001}
  ws-token: ${ZC_QQ_WS_TOKEN:}
  self-id: ${ZC_QQ_SELF_ID:0}          # 0 = 连上后 get_login_info 自动识别
  trigger-mode: ${ZC_QQ_TRIGGER_MODE:at}   # at（只理 @）/ all（全量，风控风险高）
  per-user-cooldown-sec: ${ZC_QQ_USER_COOLDOWN:60}
  group-whitelist: ${ZC_QQ_GROUP_WHITELIST:}  # 逗号分隔，空=不限
  # 分段发言：每条 ≤300 字，条间隔 400~800ms 随机
  max-chunk-chars: 300
  chunk-delay-min-ms: 400
  chunk-delay-max-ms: 800
  max-chunks: 6
  heartbeat-sec: 30
  connect-timeout-sec: 10
  reconnect-max-sec: 60
  # P1/P4：表情包（素材 = static/qq_emoji/ 下的官方头部特写差分，标注见 emoji_map.json）
  emoji-enabled: ${ZC_QQ_EMOJI:true}
  emoji-probability: 100          # 通过前两道闸门后再随机抑制一次，100 = 不抑制
  emoji-min-gap: ${ZC_QQ_EMOJI_GAP:5}          # 中间至少隔几条回复才允许再发一张
  emoji-strong-emotions: ${ZC_QQ_EMOJI_STRONG:激动,害羞,生气,慌张,难过,开心,震惊,俏皮}
  # P1：群里发图 → 下载 → 缩到长边 ≤800px → 视觉模型理解，再进对话
  vision-enabled: ${ZC_QQ_VISION:true}
  vision-max-edge: 800
  vision-max-images: 2
  send-retry: 1                   # 发送失败重试几次（NapCat 偶发超时）
  # P3 管理员体系：只有这些 QQ 能私聊机器人、能用管理指令（逗号分隔，留空=没有管理员）
  admin-qq: ${ZC_QQ_ADMIN_QQ:}
  admin-only-private: ${ZC_QQ_ADMIN_ONLY_PRIVATE:true}
  # P3 记忆隔离：group（每群一份）/ user（每群每人一份）/ off（与桌宠共用，不建议）
  memory-scope: ${ZC_QQ_MEMORY_SCOPE:group}
  memory-consolidate-every: ${ZC_QQ_MEMORY_EVERY:20}   # 每 N 条群消息后台提炼一次记忆（0=不自动）
  # P3 每日 token 上限（0=不限；只统计 QQ 群，不含桌宠端）
  daily-token-limit: ${ZC_QQ_DAILY_TOKENS:0}
  # P4 回复节奏：收到 @ 后至少等这么久才回（想得快也不提前说），0 = 立刻回
  reply-delay-sec: ${ZC_QQ_REPLY_DELAY:3}
  # P4 恶意 @：延迟窗口内同一个人连续 @ 到这个次数就拉黑（仅管理员能解）
  blacklist-burst: ${ZC_QQ_BLACKLIST_BURST:4}
  # P4 引用回复（回复带"回复 XX：…"的引用框）
  quote-reply: ${ZC_QQ_QUOTE:true}
  # P4 额度用尽时对被 @ 的固定说明
  quota-reply: ${ZC_QQ_QUOTA_REPLY:今天我说话太多啦，额度用完了……管理员充值后我就回来～}
  # P4 同时允许几条消息在"思考"（调模型）
  ai-threads: ${ZC_QQ_AI_THREADS:4}

# 登录账号（本地默认账号：不读数据库，无需 adminlist）
# identity 只要不等于「员工」就有写权限（管理页 isAdmin / 后端 Interceptor 按此判断）
login:
  username: 老师
  password: 123456
  name: 老师
  identity: 管理员
