<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>桌宠</title>
    <link rel="stylesheet" href="CSS/桌宠管理.css">
    <style>
        html, body { height: 100vh; margin: 0; overflow: hidden; background: rgba(1,1,1,0.004); }
        .drag-bar { position: fixed; top: 0; left: 0; right: 0; height: 20px; z-index: 999; -webkit-app-region: drag; }
        .lock-btn { position: absolute; top: 4px; right: 4px; width: 24px; height: 24px; z-index: 10;
            background: rgba(255,255,255,0.3); border: 1px solid #888; border-radius: 4px; cursor: pointer;
            font-size: 14px; line-height: 24px; text-align: center; color: #555; pointer-events: auto !important; }
        .lock-btn.locked { background: rgba(255,100,100,0.4); color: #c00; }
        :root { --choice-buffer: 1s; } /* 选项选中缓冲时长（JS 运行时按设置覆盖） */
        .resize-handle { position: absolute; width: 16px; height: 16px; z-index: 10; }
        .resize-se { bottom: 0; right: 0; cursor: nwse-resize; }
        /* 桌面版选项区：左侧竖向小按钮；宽度用 --btn-w 可调，左右两字符内边距，超长换行且各行居中 */
        #choicesWrapper { display: flex; flex-direction: column; align-items: flex-start; --btn-w: 200px; }
        #choicesWrapper .choices-container { margin: 0; width: auto; align-items: flex-start; gap: 8px; }
        #choicesWrapper .choice-btn { width: var(--btn-w); font-size: 15px; padding: 12px 2em; text-align: center; background-size: 100% 125%; white-space: normal; word-break: break-word; line-height: 1.5; box-sizing: border-box; }
        #choicesWrapper .choice-btn:hover { transform: scale(1.2); }
        #choicesWrapper .choice-btn.selected { animation: choiceSelect var(--choice-buffer, 1s) ease-in-out forwards; }
        @keyframes choiceSelect { 15% { transform: scale(1.2); } 100% { transform: scale(1.0); } }
        #choicesWrapper.editing { outline: 2px dashed #7ACBF6; outline-offset: 4px; }
        #choicesWrapper .choices-resize { position: absolute; right: -8px; bottom: -8px; width: 18px; height: 18px; cursor: nwse-resize; z-index: 10; background: #7ACBF6; border-radius: 50%; display: none; }
        #choicesWrapper.editing .choices-resize { display: block; }
        #choicesEditBtn { position: fixed; right: 12px; bottom: 12px; z-index: 100; width: 34px; height: 34px; line-height: 34px; text-align: center; font-size: 18px; background: rgba(0,0,0,0.35); color: #fff; border-radius: 50%; cursor: pointer; user-select: none; }
        #choicesEditBtn.on { background: rgba(122,203,246,0.9); color: #000; }
        #visionBtn { position: fixed; right: 12px; bottom: 54px; z-index: 100; width: 34px; height: 34px; line-height: 34px; text-align: center; font-size: 18px; background: rgba(0,0,0,0.35); color: #fff; border-radius: 50%; cursor: pointer; user-select: none; }
        #visionBtn.on { background: rgba(122,203,246,0.9); color: #000; }
        #mouseBtn { position: fixed; right: 12px; bottom: 96px; z-index: 100; width: 34px; height: 34px; line-height: 34px; text-align: center; font-size: 18px; background: rgba(0,0,0,0.35); color: #fff; border-radius: 50%; cursor: pointer; user-select: none; }
        #mouseBtn.on { background: rgba(122,203,246,0.9); color: #000; }
        #adjustBtn { position: fixed; right: 12px; bottom: 138px; z-index: 100; width: 34px; height: 34px; line-height: 34px; text-align: center; font-size: 18px; background: rgba(0,0,0,0.35); color: #fff; border-radius: 50%; cursor: pointer; user-select: none; }
        #adjustBtn.on { background: rgba(122,203,246,0.9); color: #000; }
        #milkBtn { position: fixed; right: 12px; bottom: 180px; z-index: 100; width: 34px; height: 34px; line-height: 34px; text-align: center; font-size: 18px; background: rgba(0,0,0,0.35); color: #fff; border-radius: 50%; cursor: pointer; user-select: none; }
        #milkBtn.on { background: rgba(122,203,246,0.9); color: #000; }
        #webSearchBtn { position: fixed; right: 12px; bottom: 222px; z-index: 100; width: 34px; height: 34px; line-height: 34px; text-align: center; font-size: 18px; background: rgba(0,0,0,0.35); color: #fff; border-radius: 50%; cursor: pointer; user-select: none; }
        #webSearchBtn.on { background: rgba(122,203,246,0.9); color: #000; }
        #commentaryBtn { position: fixed; right: 12px; bottom: 264px; z-index: 100; width: 34px; height: 34px; line-height: 34px; text-align: center; font-size: 18px; background: rgba(0,0,0,0.35); color: #fff; border-radius: 50%; cursor: pointer; user-select: none; }
        #commentaryBtn.on { background: rgba(255,180,120,0.95); color: #000; }
        /* 牛奶喂食：草莓牛奶图片跟随鼠标；移入模型放大 */
        #milkImg { position: fixed; z-index: 70; pointer-events: none; user-select: none; will-change: transform; transition: transform .12s ease; }
        #milkImg.milk-hot { transform: scale(1.18); }
        #adjustPanel { position: fixed; z-index: 120; display: none; background: transparent; padding: 0; border: 0; }
        #adjustPanel input[type=range] { writing-mode: vertical-lr; direction: rtl; width: 16px; height: 150px; cursor: ns-resize; background: transparent; }
        #adjustPanel .adj-eff-row { display: flex; align-items: center; gap: 2px; margin-top: 3px; }
        #adjustPanel .adj-eff-row button { width: 20px; height: 20px; line-height: 18px; padding: 0; border: 0; border-radius: 4px; background: rgba(0,0,0,0.35); color: #fff; font-size: 12px; cursor: pointer; user-select: none; }
        #adjustPanel .adj-eff-row button:hover { background: rgba(122,203,246,0.9); color: #000; }
        #adjustPanel .adj-eff-name { max-width: 90px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #fff; font-size: 10px; opacity: 0.8; writing-mode: vertical-rl; text-orientation: mixed; }
        .adj-effect-video { position: fixed; z-index: 62; display: none; cursor: move; pointer-events: auto; }
        .adjusting-effect .adj-effect-video { display: block; }
        /* 桌面版对话框：固定宽度、左右内边距、顶部锚定（内容多时向下增高） */
        #dialogBox { padding: 14px 22px 42px 22px; }
        #dialogBox .dialog-arrow { right: 24px; }
        #dialogBox .resize-e { position: absolute; top: 0; right: 0; width: 8px; height: 100%; cursor: ew-resize; z-index: 10; }
        #dialogBox .resize-w { position: absolute; top: 0; left: 0; width: 8px; height: 100%; cursor: ew-resize; z-index: 10; }
        /* 换行治理：文本自然折行，不因 \n 硬换行；长英文/数字折行 */
        #dialogText { white-space: normal; word-break: break-word; overflow-wrap: break-word; min-height: 4.8em; }
        /* 歌单分页 */
        #dialogPager { display: none; margin-top: 10px; text-align: center; user-select: none; }
        #dialogPager button { background: rgba(255,255,255,0.15); color: #fff; border: 1px solid #888; border-radius: 4px; width: 34px; height: 28px; cursor: pointer; font-size: 15px; line-height: 28px; padding: 0; }
        #dialogPager button:disabled { opacity: 0.3; cursor: default; }
        #dialogPager span { color: #fff; margin: 0 10px; font-size: 15px; }
    </style>
</head>
<body>

<!-- 桌宠图片窗口 -->
<div class="pet-container" id="petContainer" style="position:fixed;top:0;left:0;height:100%;z-index:4;user-select:none;-webkit-user-select:none;display:inline-block;">
  <img id="petImg" src="aluona/aluona_kaixin.png" alt="桌宠" style="height:100%;width:auto;pointer-events:none;" onload="this.parentElement.style.width=(this.naturalWidth*(this.parentElement.offsetHeight/this.naturalHeight))+'px'">
  <canvas id="petCanvas" style="display:none;height:100%;width:auto;pointer-events:none;"></canvas>
  <div class="resize-handle resize-se" title="拖拽调整大小"></div>
</div>

<!-- 对话框窗口 -->
<div class="dialog-box dialog-clickable" id="dialogBox" style="position:fixed;left:16px;top:120px;width:440px;min-height:110px;">
  <div class="resize-w" title="拖动调整内边距"></div>
  <div class="lock-btn" title="锁定后鼠标穿透" onclick="toggleLock(this)">🔓</div>
  <div class="dialog-info">
    <span class="dialog-name" id="dialogName">阿罗娜</span>
    <span class="dialog-role" id="dialogRole">什亭之匣</span>
  </div>
  <hr class="dialog-divider">
  <div class="dialog-text" id="dialogText">早上好，老师！</div>
  <div id="dialogPager">
    <button type="button" id="pagerPrev" onclick="songPagePrev()">◀</button>
    <span id="pagerInfo">1/1</span>
    <button type="button" id="pagerNext" onclick="songPageNext()">▶</button>
  </div>
  <div class="dialog-arrow" id="dialogArrow"></div>
  <div class="resize-e" title="拖动调整宽度"></div>
</div>、。

<!-- 选项区域（独立于对话框） -->
<div class="choices-wrapper no-drag" id="choicesWrapper" style="position:fixed;z-index:5;">
  <div class="choices-container" id="choicesContainer"></div>
  <div class="choices-resize" title="拖动调整按钮大小"></div>
</div>
<div id="mouseBtn" title="鼠标操控">🖱️</div>
<div id="milkBtn" title="喂牛奶：拿起草莓牛奶跟随鼠标，移近桌宠喂她（点击桌宠 = milk 操作）">🥛</div>
<div id="webSearchBtn" title="联网查询：点一次 → 下一条消息自动联网检索后回答（发完自动关闭；需在「桌宠设置 → 联网查询」里开启并填 API Key）">🔍</div>
<div id="commentaryBtn" title="陪玩点评：进入后每隔十几秒看一眼你的屏幕，冒一句弹幕式短评（像旁边坐着个观众）；再点一次或说「别看了」退出">🎬</div>
<div id="adjustBtn" title="调整桌宠位置大小（🎯调整中：拖桌宠=移动、滑块=大小；◀▶切到特效可拖位置/滑块调大小，切换自动保存）">🎯</div>
<div id="adjustPanel">
    <input id="adjScale" type="range" min="0.5" max="1.6" step="0.01" value="1">
    <div class="adj-eff-row"><button id="adjPrev" title="上一个（桌宠/特效）">◀</button><span class="adj-eff-name" id="adjEffName"></span><button id="adjNext" title="下一个（桌宠/特效）">▶</button></div>
</div>
<div id="visionBtn" title="截屏给 AI 看">👁</div>
<div id="choicesEditBtn" title="编辑选项按钮位置与大小">⚙</div>

<script src="JS/axios.js"></script>
<script src="live2d/live2dcubismcore-v4.min.js"></script>
<script src="live2d/node_modules/pixi.js/dist/browser/pixi.min.js"></script>
<script src="live2d/node_modules/pixi-live2d-display/dist/cubism4.min.js"></script>
<script src="live2d/live2d-fix-bridge.js?v=11"></script>
<script>

// axios 拦截器 — 自动附加 JWT token
axios.interceptors.request.use(config => {
    const token = localStorage.getItem('token');
    if (token) {
        config.headers['Authorization'] = 'Bearer ' + token;
    }
    return config;
});

// 元素安全访问
const $ = (id) => document.getElementById(id);

/* ====== 容器拖动 & 大小调整 ====== */
(function() {
    const targets = ['petContainer', 'dialogBox', 'choicesWrapper']; // 可拖拽的容器
    let dragTarget = null, dragMode = null; // null|'move'|'resize'|'pat'(摸头)|'modelmove'(调整模式移动)
    let adjStart = null;   // 调整模式：拖动起始偏移 {ox,oy}
    let patMoved = false; // 摸头：是否已超过拖动阈值
    let patLeft = false;  // 摸头：是否已因移出范围而结束
    let sx, sy, sl, st, sw, sh, sp;
    const THRESH = 2;
    // 「在桌宠区域外单击」的判定：按下时记候选，拖动超过阈值就取消，松手时才算一次单击
    let outsideClickCandidate = false, dragMoved = false;

    document.addEventListener('mousedown', function(e) {
        if (window.__setPassBusy) window.__setPassBusy(true); // 按下即捕获（防止中途切穿透丢事件）
        // 这次按下算不算「点桌面」？—— 只看**桌宠 UI 元素**（对话框/选项栏/面板/按钮/输入框），
        // 不把 Live2D 模型外框算进来：模型外框比可见身体大得多，用它判断会把大片桌面
        // 误判成桌宠区域，于是「点桌面 → 放开捕获 → 轮询又抢回捕获 → 下一次点击又被吞」循环，
        // 表现就是要连点好几下才能点到桌面。
        // 松手时若没拖动（见 mouseup）就放开捕获。
        outsideClickCandidate = !isPetUiZone(e.clientX, e.clientY)
            && !e.target.closest('button, input, textarea, select, .lock-btn, #adjustPanel');
        dragMoved = false;
        // 牛奶模式：按下瞬间若点在桌宠上 → 结束牛奶并视为一次 milk 操作（不进入摸头/click）
        if (milkActive && !e.target.closest('#milkBtn, #adjustBtn, #mouseBtn, #visionBtn, #choicesEditBtn, #adjustPanel')) {
            e.preventDefault(); e.stopPropagation();
            if (isPetModelHit(e.clientX, e.clientY)) {
                milkFeed();
            } else {
                // 点击别处（含对话框/选项区）→ 退出牛奶模式；本次点击不穿透到桌面
                endMilk();
                window.__milkExitedClick = true; // 吞掉随后的 click，避免误触发对话框/选项
            }
            return;
        }
        const resizer = e.target.closest('.resize-se, .resize-e, .resize-w, .choices-resize');
        if (resizer) {
            const box = resizer.closest('.pet-container, .dialog-box, .choices-wrapper');
            if (!box) return;
            dragTarget = box;
            if (resizer.classList.contains('choices-resize')) dragMode = 'resize-choices';
            else if (resizer.classList.contains('resize-e')) dragMode = 'resize-w';
            else if (resizer.classList.contains('resize-w')) dragMode = 'resize-p';
            else dragMode = 'resize';
            sx = e.screenX; sy = e.screenY;
            sw = box.offsetWidth; sh = box.offsetHeight;
            sp = parseInt(getComputedStyle(box).paddingLeft) || 0;
            e.preventDefault(); e.stopPropagation();
            return;
        }
        // 调整模式·特效拖动：点在特效预览视频上 → 移动特效位置（相对模型中心偏移）
        if (adjustMode && adjObjIsEff && adjVideo && adjVideo.style.display !== 'none'
                && e.target === adjVideo) {
            dragMode = 'effmove';
            effStart = getEffCurrent(); // {dx,dy,wCur}
            sx = e.screenX; sy = e.screenY;
            e.preventDefault(); e.stopPropagation();
            return;
        }
        // 调整模式：拖模型=移动位置（不再摸头/交互）
        if (adjustMode && useLive2D && !e.ctrlKey
                && typeof l2dBridge !== 'undefined' && l2dBridge.ready
                && l2dBridge.hitTest(e.clientX, e.clientY)
                && !e.target.closest('#dialogBox, #choicesWrapper, #talkInput, input, textarea, button, .lock-btn, #adjustPanel')) {
            dragMode = 'modelmove';
            adjStart = l2dBridge.getOffsets();
            sx = e.screenX; sy = e.screenY;
            return;
        }
        // 摸头：Live2D 模式、非 Ctrl、按下点必须落在「头部区域」内（比例见 HEAD_ZONE_DEFAULT / 标注换算）
        // 注意：🎯 调整 / ⚙ 编辑选项 / 🥛 牛奶 模式下不摸头
        if (!isUiAdjusting() && useLive2D && !e.ctrlKey
                && typeof l2dBridge !== 'undefined' && l2dBridge.ready
                && l2dBridge.hitTest(e.clientX, e.clientY)
                && !e.target.closest('#dialogBox, #choicesWrapper, #talkInput, input, textarea, button, .lock-btn')) {
            if (!isInHeadZone(e.clientX, e.clientY)) {
                // 摸到的是身体/其他部位 → 不算摸头，也不触发窗口拖动
                e.preventDefault();
                return;
            }
            dragMode = 'pat'; patMoved = false;
            sx = e.screenX; sy = e.screenY;
            console.log('[PAT] mousedown 命中头部区域 → pat 待拖', e.clientX, e.clientY);
            return;
        }
        // ⚙ 编辑选项模式：命中桌宠模型区域时不做任何拖动（避免误拖整个窗口/触发交互）
        if (!adjustMode && choicesEditMode && useLive2D
                && typeof l2dBridge !== 'undefined' && l2dBridge.ready
                && l2dBridge.hitTest(e.clientX, e.clientY)) {
            e.preventDefault(); e.stopPropagation();
            return;
        }
        for (const id of targets) {
            const el = document.getElementById(id);
            if (el && e.target.closest('#' + id)) {
                if (id === 'choicesWrapper' && !choicesEditMode) return; // 仅编辑模式可拖动
                dragTarget = el; dragMode = null;
                sx = e.screenX; sy = e.screenY;
                sl = el.offsetLeft; st = el.offsetTop;
                return;
            }
        }
        // 空白区域 → 窗口拖动
        dragTarget = null; dragMode = 'win';
        sx = e.screenX; sy = e.screenY;
    });

    document.addEventListener('mousemove', function(e) {
        if (!dragTarget && dragMode !== 'pat' && dragMode !== 'modelmove' && dragMode !== 'effmove') return;
        if (dragMode === 'effmove') {
            // 拖特效 = 改相对模型中心的偏移（模型不跟着动）
            const dx = e.screenX - sx, dy = e.screenY - sy;
            effStart.dx += dx; effStart.dy += dy;
            sx = e.screenX; sy = e.screenY;
            setEffFromCurrent(effStart); // 实时重定位视频 + 记录待存
            return;
        }
        if (dragMode === 'modelmove') {
            // 拖模型 = 移动位置（增量作用于 Live2D 偏移）
            const dx = e.screenX - sx, dy = e.screenY - sy;
            if (adjStart && typeof l2dBridge !== 'undefined' && l2dBridge.ready) {
                l2dBridge.setBaseOffset(adjStart.ox + dx, adjStart.oy + dy);
                updateAdjustPanel();
            }
            return;
        }
        if (dragMode === 'pat') {
            const dx = e.screenX - sx, dy = e.screenY - sy;
            if (!patMoved && (Math.abs(dx) > 4 || Math.abs(dy) > 4)) {
                patMoved = true;
                isPatching = true;
                console.log('[PAT] 拖动阈值触发 startPat @', e.clientX, e.clientY);
                if (typeof l2dBridge !== 'undefined' && l2dBridge.ready) l2dBridge.startPat();
            }
            if (patMoved && typeof l2dBridge !== 'undefined' && l2dBridge.ready) {
                if (isInPetBox(e.clientX, e.clientY)) {
                    // 触发摸头要命中头部区域，但摸头过程中只要还在桌宠框内就继续（可摸到脸/肩膀）
                    l2dBridge.patMove(e.clientX, e.clientY);
                } else if (!patLeft) {
                    // 拖出桌宠框（蓝虚线）→ 摸头结束（进入 20s 跟随），也算一次完整摸头 → rub
                    patLeft = true;
                    isPatching = false;
                    l2dBridge.endPat();
                    rubReaction();
                    console.log('[PAT] 拖出桌宠框，摸头结束 → 20s 跟随');
                }
            }
            return; // 摸头不移动容器
        }
        const dx = e.screenX - sx, dy = e.screenY - sy;
        if (Math.abs(dx) > THRESH || Math.abs(dy) > THRESH) {
            if (!dragMode) dragMode = 'move'; // 首次超过阈值才确定是拖拽
        }
        if (dragMode === 'move') {
            dragTarget.style.left = (sl + dx) + 'px';
            dragTarget.style.top = (st + dy) + 'px';
        } else if (dragMode === 'win' && window.electronAPI) {
            if (Math.abs(dx) > THRESH || Math.abs(dy) > THRESH) dragMoved = true; // 拖过 → 不算单击
            window.electronAPI.moveWindow(dx, dy);
            sx = e.screenX; sy = e.screenY;
        }
        if (dragMode === 'resize') {
            dragTarget.style.width = Math.max(50, sw + dx) + 'px';
            dragTarget.style.height = Math.max(30, sh + dy) + 'px';
        } else if (dragMode === 'resize-w') {
            const w = Math.max(240, Math.min(window.innerWidth - 20, sw + dx));
            dragTarget.style.width = w + 'px';
        } else if (dragMode === 'resize-p') {
            const maxP = Math.max(8, (sw - 120) / 2); // 两侧对称，留出内容区
            const p = Math.max(8, Math.min(maxP, sp - dx));
            dragTarget.style.paddingLeft = p + 'px';
            dragTarget.style.paddingRight = p + 'px';
        } else if (dragMode === 'resize-choices') {
            const w = Math.max(120, Math.min(400, sw + dx));
            dragTarget.style.setProperty('--btn-w', w + 'px');
        }
    });

    document.addEventListener('mouseup', function(e) {
        if (window.__setPassBusy) window.__setPassBusy(false);
        if (dragMode === 'effmove') {
            // 结束特效拖动 → 保存该特效参数
            dragMode = null; dragTarget = null;
            saveEffNow();
            return;
        }
        if (dragMode === 'modelmove') {
            // 结束调整拖动 → 保存位置
            saveAdjust();
            dragMode = null; dragTarget = null;
            return;
        }
        if (dragMode === 'pat') {
            // 摸头结束：拖动过=完成摸头→20s跟随；没拖=单击短暂眯眼（移出已结束则不再重复）
            if (!adjustMode && typeof l2dBridge !== 'undefined' && l2dBridge.ready) {
                if (patMoved && !patLeft) {
                    l2dBridge.endPat();
                    // 完整摸头（按住拖动→松手）→ 触发 rub 交互（管理页 user_operation=rub 配固定文本）
                    window.__suppressNextPetClick = true; // 松手产生的 click 不再走 click 响应
                    rubReaction();
                } else if (!patMoved) {
                    l2dBridge.quickSquint(450);
                }

// ===== Web Audio 唇形同步 =====
let lipAudioCtx = null, lipAnalyser = null, lipSource = null, lipRaf = null, lipMouth = 0;

function initLipSync() {
    if (lipAudioCtx) return;
    try {
        lipAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
        lipAnalyser = lipAudioCtx.createAnalyser();
        lipAnalyser.fftSize = 256;
        lipAnalyser.smoothingTimeConstant = 0.4;
        if (!ttsAudio) { ttsAudio = new Audio(); document.body.appendChild(ttsAudio); }
        ttsAudio.volume = commentaryVolumeScale();   // 陪玩点评模式：本状态音量按比例调小
        lipSource = lipAudioCtx.createMediaElementSource(ttsAudio);
        lipSource.connect(lipAnalyser);
        lipAnalyser.connect(lipAudioCtx.destination);
    } catch(e) { console.log('[LIP] init err:', e); }
}

function lipTick() {
    if (!lipAnalyser) return;
    const data = new Uint8Array(lipAnalyser.frequencyBinCount);
    lipAnalyser.getByteTimeDomainData(data);
    let sum = 0;
    for (let i = 0; i < data.length; i++) { const v = (data[i] - 128) / 128; sum += v * v; }
    const rms = Math.sqrt(sum / data.length);
    const target = rms > 0.01 ? Math.min(1, 0.15 + rms * 4) : 0;
    lipMouth += (target - lipMouth) * 0.35;
    if (useLive2D && l2dBridge.ready) l2dBridge.setParam('ParamMouthOpenY', lipMouth);
    lipRaf = requestAnimationFrame(lipTick);
}

function startLipSync() { if (!lipAudioCtx) initLipSync(); if (lipAudioCtx && lipAudioCtx.state === 'suspended') lipAudioCtx.resume(); lipTick(); }
function stopLipSync() { if (lipRaf) { cancelAnimationFrame(lipRaf); lipRaf = null; } if (useLive2D) l2dBridge.setParam('ParamMouthOpenY', 0); }

// 去掉文本里的换行符（换行治理：单句不硬换行，交给 CSS 自然折行）
function stripNewlines(s) { return (s || '').replace(/\r\n?/g, ''); }

// 当前对话框每行可容纳的全角字符数（实时跟随宽度）
function charsPerLineOf() {
    const el = document.getElementById('dialogText');
    if (!el) return 15;
    const cs = getComputedStyle(el);
    const fontPx = parseFloat(cs.fontSize) || 26;
    const w = el.clientWidth;
    return w > 0 ? Math.max(1, Math.floor(w / fontPx)) : 15;
}

// 当前行已累计的字符数（用于预排版，避免打字到一半跳行）
let lineCharCount = 0;

// 计算某段文本在当前对话框宽度下自然折成几行（按 CJK 全角字符宽度估算，实时跟随对话框宽度）
function measureLines(text) {
    const clean = stripNewlines(text);
    if (!clean) return 1;
    return Math.max(1, Math.ceil(clean.length / charsPerLineOf()));
}

// 按"短句整句换行（nowrap）+ 长句强制另起一行内部折行 + 【】另起一行"规则，模拟一组句子实际占几行（与 typewriterAppendSentence 一致）
function countPackedLines(list) {
    const cpl = charsPerLineOf();
    let lines = 0, cur = 0;
    for (const s of list) {
        let text = stripNewlines(s.text);
        let part1 = text, part2 = null;
        const idx = text.indexOf('【');
        if (idx >= 0) { part1 = text.substring(0, idx); part2 = text.substring(idx); }
        const len1 = part1.length;
        if (len1 > 0) {
            if (len1 <= cpl) {
                if (cur > 0 && cur + len1 > cpl) { lines++; cur = 0; }
                cur += len1;
                if (cur >= cpl) { lines++; cur = 0; }
            } else {
                // 长句：另起一行 + 内部折行
                if (cur > 0) { lines++; cur = 0; }
                lines += Math.floor(len1 / cpl);
                cur = len1 % cpl;
            }
        }
        if (part2) {
            // 【】心理活动：强制另起一行 + 内部折行
            if (cur > 0) { lines++; cur = 0; }
            const len2 = part2.length;
            lines += Math.floor(len2 / cpl);
            cur = len2 % cpl;
        }
    }
    if (cur > 0) lines++;
    return Math.max(1, lines);
}

// 全局打字机追加（不清空前面已打的文本，供 playSpeech 与句级播放复用）
function typewriterAppend(seg) {
    seg = stripNewlines(seg);
    const el = document.getElementById('dialogText');
    if (!el) return;
    if (typewriterTimer) { clearTimeout(typewriterTimer); typewriterTimer = null; }
    const base = (el.textContent === '...') ? '' : (el.textContent || '');
    let i = 0;
    const speed = 110; // 每字 ms，配合语速
    let inParen = false;
    function step() {
        if (i >= seg.length) { typewriterTimer = null; return; }
        const ch = seg[i]; i++;
        let delay;
        if (ch === '（' || ch === '(') { inParen = true; delay = 8; }
        else if (ch === '）' || ch === ')') { inParen = false; delay = 8; }
        else if (inParen) { delay = 8; }
        else { delay = speed; }
        el.textContent = base + seg.substring(0, i);
        typewriterTimer = setTimeout(step, delay);
    }
    step();
}

// 逐句打字（句子作为独立 span）：短句(≤1行)用 nowrap 整句换行；长句用 normal 内部折行并强制另起一行；【】心理活动强制另起一行
function typeChars(span, text) {
    let i = 0;
    const speed = 110;
    let inParen = false;
    function step() {
        if (i >= text.length) { typewriterTimer = null; return; }
        const ch = text[i]; i++;
        let delay;
        if (ch === '（' || ch === '(') { inParen = true; delay = 8; }
        else if (ch === '）' || ch === ')') { inParen = false; delay = 8; }
        else if (inParen) { delay = 8; }
        else { delay = speed; }
        span.textContent = text.substring(0, i);
        typewriterTimer = setTimeout(step, delay);
    }
    step();
}

function typewriterAppendSentence(seg) {
    seg = stripNewlines(seg);
    const el = document.getElementById('dialogText');
    if (!el) return;
    if (typewriterTimer) { clearTimeout(typewriterTimer); typewriterTimer = null; }
    if (el.textContent === '...' && el.children.length === 0) el.textContent = ''; // 清掉 '...' 占位
    const cpl = charsPerLineOf();
    // 拆心理活动【...】：前面部分正常排，【】强制另起一行
    let part1 = seg, part2 = null;
    const idx = seg.indexOf('【');
    if (idx >= 0) { part1 = seg.substring(0, idx); part2 = seg.substring(idx); }
    const len1 = part1.length;
    // 当前行有内容时：长句强制另起一行；短句按剩余容量
    if (lineCharCount > 0 && part1.trim()) {
        if (len1 > cpl || lineCharCount + len1 > cpl) {
            el.appendChild(document.createElement('br'));
            lineCharCount = 0;
        }
    }
    if (part1.trim()) {
        const span1 = document.createElement('span');
        span1.style.whiteSpace = (len1 <= cpl) ? 'nowrap' : 'normal';
        el.appendChild(span1);
        if (len1 <= cpl) {
            lineCharCount += len1;
            if (lineCharCount >= cpl) lineCharCount = 0;
        } else {
            lineCharCount = len1 % cpl;
        }
        typeChars(span1, part1);
    }
    if (part2) {
        // 【】心理活动强制另起一行（当前行有内容时）
        if (lineCharCount > 0) el.appendChild(document.createElement('br'));
        lineCharCount = 0;
        const span2 = document.createElement('span');
        span2.style.whiteSpace = 'normal';
        el.appendChild(span2);
        lineCharCount = part2.length % cpl;
        typeChars(span2, part2);
    }
}

// 统一响应：文本 + 表情 + 动作 + 音效 在首段语音合成成功后一起触发；分段流式边合成边播放
// ===== 长回复分段显示：段落自动翻页（跟着语音走）=====
// ★ 关键：翻页要挂在「这句开始**播放**」上，不能挂在 SSE 消息**到达**上 ——
//   语音有缓存时 7 句几乎同时到齐，挂到达会导致显示瞬间跳到后面几段（第一段几乎看不到）。
let speechPageFallback = false;   // true=同时用定时器兜底（TTS 关闭/流失败时用）

function speechPageArmFallback() {
    if (!speechParts.length) return;
    speechPageFallback = true;
    if (speechPageTimer) { clearTimeout(speechPageTimer); speechPageTimer = null; }
    if (speechPage < speechParts.length - 1) {
        const ms = Math.min(20000, Math.max(3000, speechParts[speechPage].length * 300 + 1500));
        speechPageTimer = setTimeout(function () { speechPageTimer = null; speechPageAdvance(); }, ms);
    }
}
function speechPageShow(i) {
    const box = document.getElementById('dialogBox');
    if (!speechParts.length || !box) return;
    speechPage = Math.max(0, Math.min(i, speechParts.length - 1));
    textSegments = speechParts.slice(speechPage + 1);   // 同步旧字段：点对话框 / 分页按键仍可用
    typewriterText(document.getElementById('dialogText'), speechParts[speechPage], 40);
    const more = textSegments.length > 0;
    box.classList.toggle('dialog-clickable', more || !!(currentChoices && currentChoices.length));
    if (speechPageTimer) { clearTimeout(speechPageTimer); speechPageTimer = null; }
    if (more && speechPageFallback) {
        // 兜底：TTS 关着 / 流失败时按阅读时长翻页（正常路径由播放进度翻，定时器不会挂）
        const ms = Math.min(20000, Math.max(3000, speechParts[speechPage].length * 300 + 1500));
        speechPageTimer = setTimeout(function () { speechPageTimer = null; speechPageAdvance(); }, ms);
    }
}
function speechPageAdvance() {
    if (!speechParts.length || speechPage >= speechParts.length - 1) return false;
    speechPageShow(speechPage + 1);
    return true;
}
function speechPageReset(parts, armFallback) {
    if (speechPageTimer) { clearTimeout(speechPageTimer); speechPageTimer = null; }
    speechParts = (parts && parts.length > 1) ? parts.slice() : [];
    speechPage = 0;
    speechPageFallback = !!armFallback;
    textSegments = speechParts.length ? speechParts.slice(1) : [];
}
function speechPageCancelTimer() {
    if (speechPageTimer) { clearTimeout(speechPageTimer); speechPageTimer = null; }
}
/** 某一句**开始播放**时，把显示切到那句话所在的段落 → 显示与朗读同步，不用手点 */
function speechPageFollow(sentence) {
    if (!speechParts.length || !sentence) return;
    const norm = function (s) { return String(s).replace(/\s+/g, ''); };
    const seg = norm(sentence);
    if (seg.length < 4) return;   // 太短（只剩标点之类）容易误判，忽略
    for (let i = speechPage + 1; i < speechParts.length; i++) {
        if (norm(speechParts[i]).indexOf(seg) >= 0) { speechPageShow(i); return; }
    }
}

function playSpeech(text, motion, soundEffect, specialEffect, onComplete) {
    const showText = (armFallback) => {
        if (!text) return;
        const normalized = text.replace(/\r\n/g, '\n');
        const parts = normalized.split('\n\n').filter(p => p.trim());
        if (parts.length > 1) {
            speechPageReset(parts, armFallback);
            speechPageShow(0);   // 第一段立刻显示，后续段落跟着语音播放自动翻
        } else {
            speechPageReset([], false);
            typewriterText(document.getElementById('dialogText'), text, 40);
        }
    };
    const applyEffects = () => {
        if (motion) {
            const src = motion.startsWith('http') ? motion : 'aluona/' + motion;
            document.getElementById('petImg').src = src;
            if (useLive2D) l2dBridge.setExpression(motion);
        }
        // 无条件调用：即使无音效/特效，也关闭上一次残留的音效视频（如 loading 的循环音效）
        playEffects(soundEffect, specialEffect);
    };

    const hasSpeech = ttsEnabled && text && /[一-龥a-zA-Z0-9]/.test(text);

    // 出响应 → 看着老师（暂停空闲逛视），直到这段文字/语音结束
    gazeOnUser(gazeMsFor(text));

    if (!hasSpeech) {
        // 无语音：立即显示文本 + 触发效果
        showText(true);
        applyEffects();
        return;
    }

    // ★ 首句立即显示（提速）：文本 + 表情/音效在响应到达时就出来，语音随后跟上。
    //   之前是"等首段语音合成完才显示"，感知延迟 = LLM + 首段 TTS（1~3 秒）；现在 ≈ LLM。
    showText(false);   // 有语音：分页跟着播放进度翻，不挂定时器
    applyEffects();

    const audioQueue = [];
    let playing = false, esDone = false;

    function playNext() {
        if (audioQueue.length === 0) { playing = false; stopLipSync(); if (esDone && onComplete) onComplete(); return; }
        playing = true;
        const item = audioQueue.shift();
        // 文本已在响应到达时整段打出，这里只播语音，不再逐段追加（否则会重复显示）
        if (!ttsAudio) { ttsAudio = new Audio(); document.body.appendChild(ttsAudio); }
        ttsAudio.volume = commentaryVolumeScale();   // 陪玩点评模式：本状态音量按比例调小
        ttsAudio.src = 'data:audio/wav;base64,' + item.audio;
        speechPageFollow(item.text);   // ★ 这句开始播放 → 显示切到它所在段落
        ttsAudio.onended = () => playNext();
        ttsAudio.onplay = () => { startLipSync(); gazeOnUser(4000); };
        ttsAudio.play().catch(() => playNext());
    }

    const es = new EventSource('/ai/tts/stream?text=' + encodeURIComponent(text) + '&variant=' + ttsVariant);
    es.onmessage = function(e) {
        let d;
        try { d = JSON.parse(e.data); } catch (err) { return; }
        if (!d.audio) return;
        // 翻页不在这里做：消息到达≠开始播放（缓存命中时整批到齐会瞬间跳段）
        audioQueue.push(d);
        if (!playing) playNext();
    };
    es.onerror = function() {
        es.close();
        // 一段都没收到才降级整段合成；已收到部分段则继续播队列（后续段丢失可接受）
        esDone = true;
        if (speechParts.length > 1) speechPageArmFallback();   // 流断了 → 分页改用定时器兜底
        if (audioQueue.length === 0) fallbackFull();
        else if (!playing && onComplete) onComplete();
    };

    function fallbackFull() {
        // 文本/表情已在上面显示过，这里只需补语音
        if (speechParts.length > 1) speechPageArmFallback();   // 整段降级没有逐句进度 → 定时器兜底
        axios.post('/ai/tts', { text: text, variant: String(ttsVariant) }).then(r => {
            if (r.data.code === 1 && r.data.data) {
                if (!ttsAudio) { ttsAudio = new Audio(); document.body.appendChild(ttsAudio); }
                ttsAudio.volume = commentaryVolumeScale();   // 陪玩点评模式：本状态音量按比例调小
                ttsAudio.src = 'data:audio/wav;base64,' + r.data.data;
                ttsAudio.onplay = () => { startLipSync(); gazeOnUser(4000); };
                ttsAudio.onended = () => { stopLipSync(); if (onComplete) onComplete(); };
                ttsAudio.play().catch(() => {});
            } else if (onComplete) {

            }
        }).catch(() => { if (onComplete) onComplete(); });
    }
}

// 句级播放：先按"句"打包成 ≤3 行气泡（DOM 实测行数），气泡内逐句切表情 + TTS，气泡间清空并自动连续输出
// Live2D 情境部件数据（{区域: {部件名: [{Id,Value}]}}），懒加载
let l2dPartsByRegion = null;
function loadL2dParts() {
    if (l2dPartsByRegion) return Promise.resolve(l2dPartsByRegion);
    return axios.get('/ai/live2d/parts').then(r => {
        const grouped = r.data.data || {};
        const out = {};
        for (const region in grouped) {
            out[region] = {};
            (grouped[region] || []).forEach(p => {
                try { out[region][p.part_name] = JSON.parse(p.params); } catch (e) {}
            });
        }
        l2dPartsByRegion = out;
        return out;
    }).catch(() => ({}));
}

// 接收管理页的 Live2D 预览消息（BroadcastChannel 同源通信）
try {
    const l2dPreviewCh = new BroadcastChannel('l2d-preview');
    l2dPreviewCh.onmessage = function(e) {

function playSentenceFlow(flow) {
    if (!flow || !flow.length) return;
    const dt = document.getElementById('dialogText');
    if (dt) dt.textContent = '...';
    lineCharCount = 0; // 新响应，重置预排版行字数
    playEffects(null, null); // 关闭上一次残留的音效视频
    // Live2D 情境流程：整条新响应先整体复位参数（跨句仅保留脸部/手部）
    const isL2dFlow = flow[0] && flow[0].expression !== undefined;
    if (isL2dFlow) {
        if (useLive2D && typeof l2dBridge !== 'undefined' && l2dBridge.ready) l2dBridge.stopMotion();
        loadL2dParts();
    }

    // 1) 打包：按句累积，模拟"短句整句换行 + 长句强制另起一行 + 【】另起一行"的实际行数；≤3 行才放当前气泡，否则整句移下一气泡
    //    心理活动【】较长（≥2行）时单独一个气泡
    const bubbles = [];
    let cur = [];
    let prevPsy = false;
    for (const s of flow) {
        const sidx = (s.text || '').indexOf('【');
        const psyLong = sidx >= 0 && measureLines((s.text || '').substring(sidx)) >= 2;
        if (cur.length && (psyLong || prevPsy || countPackedLines(cur.concat([s])) > 3)) {
            bubbles.push(cur);
            cur = [];
        }
        cur.push(s);
        prevPsy = psyLong;
    }
    if (cur.length) bubbles.push(cur);

    function applyExpr(s) {
        if (isL2dFlow) {
            // 情境合并：只覆盖该情境涉及的参数；脸部/手部未指定则保留
            if (useLive2D && typeof l2dBridge !== 'undefined' && l2dBridge.ready && l2dPartsByRegion) {
                let expr = {};
                try { expr = s.expression ? JSON.parse(s.expression) : {}; } catch (e) {}
                l2dBridge.applySituation(expr, l2dPartsByRegion);
            }
            if (s.action && typeof l2dBridge !== 'undefined' && l2dBridge.ready) { try { l2dBridge.playAction(s.action); } catch (e) {} }
            playEffects(s.sound_effect || null, null);
        } else {
            const motion = s.motion;
            if (!motion) return;
            document.getElementById('petImg').src = motion.startsWith('http') ? motion : 'aluona/' + motion;
            if (useLive2D) l2dBridge.setExpression(motion);
        }
    }

    // 无语音：气泡内逐句打字 + 切表情，气泡间清空，自动推进下一气泡
    if (!ttsEnabled) {
        let bi = 0;
        function playBubble() {
            if (bi >= bubbles.length) return;
            const bubble = bubbles[bi]; bi++;
            if (dt) dt.textContent = '';
            lineCharCount = 0;
            let i = 0;
            function showNext() {
                if (i >= bubble.length) { setTimeout(playBubble, 300); return; }
                const s = bubble[i]; i++;
                applyExpr(s);
                typewriterAppendSentence(s.text);
                setTimeout(showNext, s.text.length * 110 + 120);
            }
            showNext();
        }
        playBubble();
        return;
    }

    // 有语音：气泡内句间 pipeline 预合成；气泡之间清空并自动连续
    let bi = 0;
    function playBubbleTts() {
        if (bi >= bubbles.length) return;
        const curBi = bi;
        const bubble = bubbles[bi]; bi++;
        if (curBi > 0 && dt) dt.textContent = ''; // 后续气泡：清空上一气泡
        lineCharCount = 0;
        let idx = 0, pending = null, next = null;

        function synth(text) {
            const doSynth = () => axios.post('/ai/tts', { text: text, variant: String(ttsVariant) }).then(r =>
                (r.data && r.data.code === 1 && r.data.data) ? r.data.data : null
            ).catch(() => null);
            // 失败重试一次（GPT-SoVITS 并发偶发返回空，避免漏读某句）
            return doSynth().then(audio => audio ? audio : doSynth());
        }
        function playAudio(audio, text, onEnd, skipText) {
            if (!skipText) typewriterAppendSentence(text);
            if (!ttsAudio) { ttsAudio = new Audio(); document.body.appendChild(ttsAudio); }
            ttsAudio.volume = commentaryVolumeScale();   // 陪玩点评模式：本状态音量按比例调小
            ttsAudio.src = 'data:audio/wav;base64,' + audio;
            ttsAudio.onended = () => { stopLipSync(); onEnd(); };
            ttsAudio.onplay = () => { startLipSync(); gazeOnUser(Math.max(2500, (text || '').length * 260)); };
            ttsAudio.play().catch(() => { stopLipSync(); onEnd(); });
        }
        function step() {
            if (idx >= bubble.length) { setTimeout(playBubbleTts, 300); return; }
            // 预合成下一句（与当前句播放重叠）
            if (idx + 1 < bubble.length && !next) {
                next = synth(bubble[idx + 1].text);
            }
            pending.then(audio => {
                const cur = bubble[idx];
                pending = next;
                next = null;
                idx++;
                applyExpr(cur); // 播放前切表情（Live2D 情境合并 / PNG 表情）
                if (audio) {
                    // 第一句的文本已在气泡开始时立即显示，这里只补后续句
                    playAudio(audio, cur.text, step, idx === 1);
                } else {
                    step(); // 合成失败，跳过该句
                }
            });
        }

        // ★ 首句立即显示（提速）：气泡第一句的文字与表情先出来，语音随后跟上
        if (bubble.length) {
            applyExpr(bubble[0]);
            typewriterAppendSentence(bubble[0].text);
        }
        // 预合成前两句，串行播放
        pending = synth(bubble[0].text);
        if (bubble.length > 1) next = synth(bubble[1].text);
        step();
    }
    playBubbleTts();
}

// 音效/特效
function playEffects(soundEffect, specialEffect) {
    // tilt(歪头)动作时音效视频不会跟随模型倾斜，跳过音效
    if (specialEffect && specialEffect.split(/[:;]/)[0].trim() === 'tilt') {
        soundEffect = null;
    }
    if (soundVideo) {
        soundVideo.pause();
        soundVideo.src = '';
        soundVideo.style.display = 'none';
        soundVideo.style.cssText = '';
    }
    if (soundEffect) {
        if (!soundVideo) {
            soundVideo = document.createElement('video');
            soundVideo.className = 'effect-video';
            soundVideo.muted = true;
            soundVideo.playsInline = true;
            document.getElementById('petImg').parentElement.appendChild(soundVideo);
        }
        // Live2D模式：音效视频提到body级，position:fixed + 高z-index；位置锚定在模型头部上方
        if (useLive2D) {
            if (soundVideo.parentElement !== document.body) document.body.appendChild(soundVideo);
            soundVideo.style.position = 'fixed';
            soundVideo.style.zIndex = '60';
        } else {
            soundVideo.style.position = 'absolute';
        }
        // PNG 模式套数据库位置；Live2D 用模型锚定（忽略数据库百分比位置）
        if (!useLive2D && window.effectList) {
            const eff = window.effectList.find(e => e.soundeffect === soundEffect);
            const locStr = eff && eff.location;
            if (locStr) {
                locStr.split(';').forEach(pair => {
                    const [k, v] = pair.split(':');
                    if (k && v) soundVideo.style.setProperty(k.trim(), v.trim());
                });
            }
        }
        const src = soundEffect.startsWith('soundeffects/') || soundEffect.startsWith('http')
            ? soundEffect : 'soundeffects/' + soundEffect;
        soundVideo.src = src;
        soundVideo.currentTime = 0;
        soundVideo.style.display = '';
        if (soundUnlocked) soundVideo.muted = false;
        const isLoop = specialEffect && specialEffect.includes('loop');
        soundVideo.loop = isLoop;
        if (!isLoop) soundVideo.onended = () => { soundVideo.style.display = 'none'; };
        // Live2D：按特效自身配置定位（含加载完成后精确再定位）；无配置→头顶上方兜底
        if (useLive2D) {
            soundEffectRel = null;
            soundEffCfg = null;
            if (window.effectList) {
                const eff = window.effectList.find(e => e.soundeffect === soundEffect);
                if (eff) soundEffCfg = parseEffLoc(eff.live2d_location);
            }
            positionSoundEffect(soundEffCfg);
            try { soundVideo.addEventListener('loadedmetadata', () => positionSoundEffect(soundEffCfg), { once: true }); } catch(e) {}
        }
        soundVideo.play().catch(() => {});
    }
    if (specialEffect) {
        if (useLive2D) {
            // Live2D 模式：动作交给模型，不再操作隐藏的 PNG
            const actName = specialEffect.split(/[:;]/)[0].trim();
            if (actName && l2dBridge.ready) l2dBridge.playAction(actName);
        } else if (specialEffect.startsWith('bounce')) {
            const petImg = document.getElementById('petImg');
            petImg.classList.add('pet-bounce');
            setTimeout(() => petImg.classList.remove('pet-bounce'), 400);
        } else if (specialEffect.startsWith('swing')) {
            const petImg = document.getElementById('petImg');
            petImg.classList.add('pet-swing');
            setTimeout(() => petImg.classList.remove('pet-swing'), 500);
        } else if (specialEffect.startsWith('drop')) {
            const petImg = document.getElementById('petImg');
            petImg.classList.add('pet-drop');
            setTimeout(() => petImg.classList.remove('pet-drop'), 450);
        } else if (specialEffect.startsWith('spin2')) {
            petImg.classList.add('pet-spin2');
            setTimeout(() => petImg.classList.remove('pet-spin2'), 1050);
        } else if (specialEffect.startsWith('spin3')) {
            petImg.classList.add('pet-spin3');
            setTimeout(() => petImg.classList.remove('pet-spin3'), 1450);
        } else if (specialEffect.startsWith('spin')) {
            const petImg = document.getElementById('petImg');
            petImg.classList.add('pet-spin');
            setTimeout(() => petImg.classList.remove('pet-spin'), 650);
        } else if (specialEffect.startsWith('tilt')) {
            const petImg = document.getElementById('petImg');
            petImg.classList.add('pet-tilt');
            petImg.addEventListener('animationend', function handler() {
                petImg.classList.remove('pet-tilt');
                petImg.removeEventListener('animationend', handler);
            });
        } else if (specialEffect.startsWith('escape')) {
            document.querySelectorAll('#petImg, .effect-video').forEach(el => {
                el.classList.add('pet-escape');
                setTimeout(() => el.classList.remove('pet-escape'), 4600);
            });
        }
        if (soundVideo && specialEffect.includes(':')) {
            specialEffect.split(';').forEach(pair => {
                const [k, v] = pair.split(':');
                if (!k || !v) return;
                if (k.trim() === 'volume') soundVideo.volume = parseFloat(v) || 1;
                else if (!useLive2D) soundVideo.style.setProperty(k.trim(), v.trim()); // Live2D模式不覆盖位置，用live2d_location
            });
        }
    }
}

// 打字机
function typewriterText(el, fullText, speed, callback) {
    fullText = stripNewlines(fullText);
    if (typewriterTimer) clearInterval(typewriterTimer);
    let i = 0;
    const baseSpeed = speed || 40;
    const punct = '，。！？…、：；""（）—,.!?;:';
    el.textContent = '';
    let inParen = false;
    function nextChar() {
        if (i >= fullText.length) { typewriterTimer = null; if (callback) callback(); return; }
        el.textContent = fullText.substring(0, i + 1);
        const ch = fullText[i]; i++;
        let delay;
        if (ch === '（' || ch === '(') { inParen = true; delay = 8; }
        else if (ch === '）' || ch === ')') { inParen = false; delay = 8; }
        else if (inParen) { delay = 8; }
        else { delay = punct.includes(ch) ? baseSpeed * 3 : baseSpeed; }
        typewriterTimer = setTimeout(nextChar, delay);
    }
    nextChar();
}

// 处理后端响应
function showResult(data) {
    if (!useLive2D && document.getElementById('petImg').style.display === 'none') document.getElementById('petImg').style.display = '';
    // 新响应到来：收起上一轮可能残留的歌单分页
    document.getElementById('dialogPager').style.display = 'none';
    // AI 休眠：设置下一次闲置间隔 + 播放睡觉 motion
    if (data.sleepSeconds && data.sleepSeconds > 0) {
        lastIdleSlept = true;
        aiIdleInterval = Math.max(120, Math.min(1800, data.sleepSeconds));
        if (useLive2D) { l2dBridge.playMotion('Sleep', 0); isSleeping = true; }
    } else if (isSleeping) {
        // 从睡觉中醒来（下一条非睡觉响应）：停止循环睡眠动作并复位参数，避免眯眼等残留
        isSleeping = false;
        if (useLive2D) l2dBridge.stopMotion();
    }
    // 播放：优先句级表情流（逐句 TTS + 切表情），否则退回原来的段级播放
    if (data.sentences && Array.isArray(data.sentences) && data.sentences.length > 0 && (data.sentences.length > 1 || data.sentences[0].expression !== undefined)) {
        playSentenceFlow(data.sentences);
    } else {
        // 逐段播放：第一段 + segments 后续段（前段播完自动切下一段）
        const segList = [];
        segList.push({ text: data.message, motion: data.motion, soundEffect: data.soundEffect, specialEffect: data.specialEffect });
        if (data.segments && Array.isArray(data.segments)) {
            data.segments.forEach(s => segList.push({ text: s.text, motion: s.motion, soundEffect: null, specialEffect: null }));
        }
        let segIdx = 0;
        function playNextSeg() {
            if (segIdx >= segList.length) return;
            const seg = segList[segIdx]; segIdx++;
            playSpeech(seg.text, seg.motion, seg.soundEffect, seg.specialEffect, playNextSeg);
        }
        playNextSeg();
    }
    reactiveMap = {};
    if (data.data && Array.isArray(data.data) && data.data.length) {
        const visible = [];
        data.data.forEach(c => {
            const uop = c.userOperation || 'chat';
            // 管理页专用入口在桌宠端不显示（「打开桌宠语言模块管理 / 历史对话数据库 / 本地规则数据库 / 模型表情规则数据库」）
            if (DESKTOP_HIDDEN_CHOICE_ACTIONS.indexOf(c.choiceAction) >= 0) return;
            if (uop !== 'chat') {
                reactiveMap[uop] = c;
                const cm = uop.match(/^continue(\d+)$/);
                if (cm && !continueLocked) startContinueChain(parseInt(cm[1]), c);
            } else if (c.choiceText && c.choiceText.trim()) {
                visible.push(c);
            }
        });
        if (visible.length) {
            if (choiceTextMode) {
                const texts = visible.map((c, i) => (i + 1) + '. ' + c.choiceText).join('\n');
                const dt = document.getElementById('dialogText');
                if (dt) dt.textContent += '\n\n' + texts;
                currentChoices = null;
                document.getElementById('dialogBox').classList.remove('dialog-clickable');
            } else {
                currentChoices = visible;
                document.getElementById('dialogBox').classList.add('dialog-clickable');
            }
        } else {
            currentChoices = null;
            document.getElementById('dialogBox').classList.remove('dialog-clickable');
        }
    } else {
        currentChoices = null;
        document.getElementById('dialogBox').classList.remove('dialog-clickable');
        document.getElementById('choicesWrapper').style.display = 'none';
    }
}

// 解析特效位置：新格式 dx:..;dy:..;w:..（相对模型中心）；兼容旧 CSS 百分比 top/left/width（相对视口）
function parseEffLoc(loc, base) {
    if (!loc) return null;
    loc = String(loc).trim();
    let o = null;
    if (/dx\s*:/.test(loc) && /dy\s*:/.test(loc)) {
        o = {};
        loc.split(';').forEach(pair => {
            const m = pair.split(':');
            if (!m[1]) return;
            const k = m[0].trim();
            const v = parseFloat(m[1].trim());
            if (k === 'dx' || k === 'dy' || k === 'w') o[k] = v;
        });
        if (isFinite(o.dx) && isFinite(o.dy)) { if (!isFinite(o.w) || o.w <= 0) o.w = 300; return o; }
        o = null;
    }
    // 旧 CSS：top/left 百分比（相对视口/窗口）
    const g = (k) => { const m = loc.match(new RegExp(k + '\\s*:\\s*([^;]+)')); return m ? m[1].trim() : null; };
    const top = g('top'), left = g('left'), width = g('width');
    const W = window.innerWidth, H = window.innerHeight;
    const b = base || ((typeof l2dBridge !== 'undefined' && l2dBridge.ready && l2dBridge.getBasePosition) ? l2dBridge.getBasePosition() : null);
    const cx = b ? b.cx : W * 0.8, cy = b ? b.cy : H * 0.3;
    if (left !== null && top !== null) {
        const lx = left.endsWith('%') ? parseFloat(left) / 100 * W : parseFloat(left);
        const ty = top.endsWith('%') ? parseFloat(top) / 100 * H : parseFloat(top);
        const w = width ? parseFloat(width) : 300;

}

    try {
        if (typeof l2dBridge === 'undefined' || !l2dBridge.ready) return;
        const off = l2dBridge.getOffsets();
        const sets = JSON.parse(localStorage.getItem('pet_settings') || '{}');
        sets.live2dX = off.ox;
        sets.live2dY = off.oy;
        sets.live2dScale = l2dBridge.getScale();
        localStorage.setItem('pet_settings', JSON.stringify(sets));
    } catch(e) {}
}
// ===== 模型移动联动：选项按钮/正在播放的音效视频 跟随模型 =====
let soundEffectRel = null; // 音效视频中心相对模型基准的偏移
let soundEffCfg = null;    // 正在播放特效的 {dx,dy,w}（基准宽，模型缩放同步大小用）
// Live2D：按特效自身配置定位音效视频（新格式相对模型中心偏移；无配置则头顶上方兜底）
function positionSoundEffect(cfg) {
    if (!useLive2D || !soundVideo || typeof l2dBridge === 'undefined' || !l2dBridge.ready || !l2dBridge.getBasePosition) { return; }
    try {
        const b = l2dBridge.getBasePosition();
        const mul = l2dBridge.getScale() || 1;
        const r = soundVideo.getBoundingClientRect();
        let w = r.width || 100, h = r.height || 120;
        if (cfg && cfg.w) {
            w = cfg.w * mul;
            soundVideo.style.width = w + 'px';
            soundVideo.style.height = 'auto';
            const r2 = soundVideo.getBoundingClientRect();
            h = r2.height || w * 0.75;
            soundVideo.style.left = (b.cx + cfg.dx - w / 2) + 'px';
            soundVideo.style.top = (b.cy + cfg.dy - h / 2) + 'px';
            soundEffectRel = { dx: cfg.dx, dy: cfg.dy };
            return;
        }
        const targetCx = b.cx;
        const targetCy = b.top - h / 2 - 6; // 模型头顶上方（兜底）
        soundVideo.style.left = (targetCx - w / 2) + 'px';
        soundVideo.style.top = (targetCy - h / 2) + 'px';
        soundEffectRel = { dx: targetCx - b.cx, dy: targetCy - b.cy };
    } catch(e) { soundEffectRel = null; }
}
function syncEffectToModel() {
    if (!useLive2D || !soundVideo || soundVideo.style.display === 'none') return;
    if (!soundEffectRel || typeof l2dBridge === 'undefined' || !l2dBridge.ready) return;
    try {
        const b = l2dBridge.getBasePosition();
        const mul = l2dBridge.getScale() || 1;
        if (soundEffCfg && soundEffCfg.w) {
            soundVideo.style.width = (soundEffCfg.w * mul) + 'px';
            soundVideo.style.height = 'auto';
        }
        const r = soundVideo.getBoundingClientRect();
        soundVideo.style.top = (b.cy + soundEffectRel.dy - r.height / 2) + 'px';
        soundVideo.style.left = (b.cx + soundEffectRel.dx - r.width / 2) + 'px';
    } catch(e) {}
}
function onL2dMoved() {
    try { positionChoices(); } catch(e) {}
    try { updateAdjustPanel(); } catch(e) {}
    syncEffectToModel();
    try { if (adjEffCur && adjVideo && adjVideo.style.display !== 'none') positionAdjEff(); } catch(e) {}
}
document.addEventListener('l2d-moved', onL2dMoved);
// 桌宠动作中：正在播放/预览的音效视频跟随模型实时位移（旋转动作 tilt/spin 因 DOM 视频无法旋转，仅平移跟随）
document.addEventListener('l2d-action-frame', function(e) {
    const d = (e && e.detail) || {};
    if (typeof d.x !== 'number' || typeof d.y !== 'number') return;
    // 播放中的音效视频跟随

            soundVideo.style.top = (d.y + soundEffectRel.dy - r.height / 2) + 'px';
        } catch(err) {}
    }
    // 🎯 中的特效预览也跟随
    if (useLive2D && adjEffCur && adjVideo && adjVideo.style.display !== 'none') {
        try {
            const mul = (typeof l2dBridge !== 'undefined' && l2dBridge.ready) ? (l2dBridge.getScale() || 1) : 1;
            const w = (adjEffCur.w || 300) * mul;
            adjVideo.style.width = w + 'px';
            adjVideo.style.height = 'auto';
            const r = adjVideo.getBoundingClientRect();
            const h = r.height || w * 0.75;
            adjVideo.style.left = (d.x + adjEffCur.dx - w / 2) + 'px';
            adjVideo.style.top = (d.y + adjEffCur.dy - h / 2) + 'px';
        } catch(err) {}
    }
});
// 动作结束 → 音效回到模型基准位置
document.addEventListener('l2d-action-end', function() {

});
document.getElementById('adjustBtn').addEventListener('mousedown', function(e) { e.stopPropagation(); });

document.getElementById('adjPrev').addEventListener('mousedown', function(e) { e.stopPropagation(); });

document.getElementById('adjNext').addEventListener('mousedown', function(e) { e.stopPropagation(); });

document.getElementById('adjScale').addEventListener('input', function(e) {

    if (adjEffCur && adjEffCur.id) {

        const mul = (typeof l2dBridge !== 'undefined' && l2dBridge.ready) ? (l2dBridge.getScale() || 1) : 1;
        adjEffCur.w = v / mul;

    } else if (typeof l2dBridge !== 'undefined' && l2dBridge.ready) {

// ===== 区域级点击穿透：默认点桌面不挡；模型/对话框/选项/按钮 热区自动捕获 =====
let passThru = false;      // true=整窗点击穿透(ignoreMouse)
let passBusy = false;      // 拖动/输入等期间保持捕获
let releasedAt = 0;        // 最近一次「点桌面放开捕获」的时刻（宽限期内不再抢回捕获）
const RELEASE_GRACE_MS = 1200;
/** 只看「桌宠 UI 元素」的热区（对话框 / 选项栏 / 各按钮 / 调整面板 / 输入框），不含模型外框 */
function isPetUiZone(x, y) {
    const ids = ['dialogBox', 'choicesWrapper', 'adjustPanel', 'mouseBtn', 'visionBtn', 'choicesEditBtn', 'adjustBtn', 'milkBtn', 'commentaryBtn', 'basicinfoBtn'];
    for (let i = 0; i < ids.length; i++) {
        const el = document.getElementById(ids[i]);
        if (!el) continue;
        if (el.style.display === 'none') continue;
        const r = el.getBoundingClientRect();
        if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) return true;
    }
    if (document.querySelector('.lock-btn')) {
        const r = document.querySelector('.lock-btn').getBoundingClientRect();
        if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) return true;
    }
    const ae = document.activeElement;
    if (ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA' || ae.isContentEditable)) return true;
    return false;
}
/** 桌宠热区 = UI 元素 + Live2D 模型外框（用于「桌面宠的交互/悬停」，不用于判断点桌面） */
function isPetZone(x, y) {
    if (useLive2D && typeof l2dBridge !== 'undefined' && l2dBridge.ready && l2dBridge.hitTest(x, y)) return true;
    return isPetUiZone(x, y);
}
/** 更紧的桌宠热区：刚点过桌面时用它决定要不要抢回捕获（见 updatePass / RELEASE_GRACE_MS） */
function isPetZoneTight(x, y) {
    if (isPetUiZone(x, y)) return true;
    if (useLive2D && typeof l2dBridge !== 'undefined' && l2dBridge.ready) {
        if (l2dBridge.hitTestTight) return l2dBridge.hitTestTight(x, y);
        return l2dBridge.hitTest(x, y);
    }
    return false;
}
// 切穿透状态（唯一出口，避免两处写法不一致）
function setPass(want) {
    if (want === passThru) return;
    passThru = want;
    // 优先走 setPassThrough：主进程靠它区分「区域穿透」和「用户主动锁定」，
    // 并在穿透期间开兜底轮询（见下面 pet:cursor）。旧接口保留做兼容。
    if (window.electronAPI && window.electronAPI.setPassThrough) window.electronAPI.setPassThrough(want);
    else if (window.electronAPI && window.electronAPI.setIgnoreMouse) window.electronAPI.setIgnoreMouse(want);
}
// 区域点击穿透（规则：收得住，才放得开）
//   旧行为是「鼠标一离开桌宠区域就放开捕获」—— 结果是视线跟随断掉、状态看着像丢了。
//   现在改成：鼠标移出桌宠区域 **不放开**，整块桌面继续由桌宠窗口接收；
//   只有老师在桌宠区域外**单击一下**（mouseup 且没拖动）才放开捕获，
//   放开后鼠标再回到桌宠区域会自动收回捕获。
//   代价（老师已确认接受）：放开那一次点击被桌宠窗口吃掉，第二次点击才真正点到桌面。
function releasePassThrough() {
    if (passThru) return;
    releasedAt = Date.now();   // 记下时刻：宽限期内不把捕获抢回来，避免连点桌面被吞好几次
    console.log('[PASS] 桌宠区域外单击 → 放开捕获（这次点击被桌宠吃掉，下一次才点到桌面）');
    setPass(true);
}
function updatePass(x, y) {
    if (passBusy || adjustMode || milkActive) return; // 拖动/输入/调整/牛奶期间保持捕获
    if (document.querySelector('.lock-btn.locked')) return; // 用户主动锁定 → 穿透状态由锁定逻辑统一管
    if (!passThru) return;
    if (isPetUiZone(x, y)) { setPass(false); return; }        // 光标在桌宠 UI 上 → 立刻收回捕获
    // 刚点过桌面（宽限期内）→ 用更紧的模型判定：
    // 免得「点桌面 → 放开 → 轮询又把旁边那片桌面当桌宠抢回捕获 → 下一次点击又被吞」。
    // 宽限期过后恢复完整判定，正常回到桌宠身上就能重新捕获。
    const inGrace = (Date.now() - releasedAt) < RELEASE_GRACE_MS;
    const overPet = inGrace ? isPetZoneTight(x, y) : isPetZone(x, y);
    if (overPet) setPass(false);
}
document.addEventListener('mousemove', function(e) { milkPointer.x = e.clientX; milkPointer.y = e.clientY; updatePass(e.clientX, e.clientY); }, true);

// ===== 兜底：穿透期间由主进程推真实光标位置 =====
// ① 恢复捕获：不依赖 Electron 的 mousemove 转发（那条转发实测会失效，见 main.js 注释），
//    否则窗口会永久停在整窗穿透上，桌宠“僵住”，只能靠 Ctrl+Shift+Z 救回。
// ② 保持鼠标跟踪：穿透状态下页面收不到 mousemove，视线跟随会「冻住」；
//    这里把真实坐标喂给 Live2D 桥 —— 只要还没去点桌面（窗口仍有焦点）就继续保持跟踪，
//    不会因为鼠标移出桌宠区域就突然丢跟踪。
// ③ 一旦点了桌面（窗口失焦）→ 标记「跟踪被打断」，之后恢复跟踪时走平滑过渡，不跳变。
if (window.electronAPI && window.electronAPI.onCursor) {
    window.electronAPI.onCursor(function(p) {
        if (!p) return;
        if (useLive2D && typeof l2dBridge !== 'undefined' && l2dBridge.ready) {
            if (l2dBridge.setCursorFocus) l2dBridge.setCursorFocus(p.focused);   // 失焦后不再跟随
            if (p.focused && l2dBridge.setCursor) l2dBridge.setCursor(p.x, p.y);
        }
        if (!passThru) return;                                         // 只在穿透状态下重新判定捕获
        if (document.querySelector('.lock-btn.locked')) return;        // 用户主动锁定 → 不动
        if (isPetZone(p.x, p.y)) console.log('[PASS] 兜底恢复捕获 @', p.x, p.y);
        updatePass(p.x, p.y);
    });
}
// 牛奶跟随：任何 mousemove 都更新图位置（含穿透状态下的 move 也能通过 capture 收到）
document.addEventListener('mousemove', function(e) {
    if (milkActive) moveMilkTo(e.clientX, e.clientY);
}, true);
window.__setPassBusy = function(b) {
    passBusy = b;
    if (b) {
        passThru = false;
        // 走 setPassThrough（而不是 setIgnoreMouse），主进程才会停掉兜底轮询、恢复捕获
        if (window.electronAPI && window.electronAPI.setPassThrough) window.electronAPI.setPassThrough(false);
        else if (window.electronAPI) window.electronAPI.setIgnoreMouse(false);
    }
};

// （原来只在「退出编辑模式」那一刻保存，拖动后直接重启就丢了 → 每次重启都回到默认位置）
function saveChoicesLayout() {
    const wrapper = document.getElementById('choicesWrapper');
    if (!wrapper) return;
    const r = wrapper.getBoundingClientRect();
    choicesManualPos = { x: Math.round(r.left), y: Math.round(r.top) };
    const w = parseInt(getComputedStyle(wrapper).getPropertyValue('--btn-w'));
    if (w) choicesBtnW = w;
    try {
        const sets = JSON.parse(localStorage.getItem('pet_settings') || '{}');
        sets.choicesX = choicesManualPos.x;
        sets.choicesY = choicesManualPos.y;
        sets.choicesBtnW = choicesBtnW;
        localStorage.setItem('pet_settings', JSON.stringify(sets));

    } catch (e) { }

// 选项按钮布局编辑：点击齿轮键切换，进入后可拖动位置、拉动大小
document.getElementById('choicesEditBtn').addEventListener('mousedown', function(e) { e.stopPropagation(); });
document.getElementById('choicesEditBtn').addEventListener('click', function(e) { e.stopPropagation();
    choicesEditMode = !choicesEditMode;

    if (choicesEditMode) {
        // 用**保存的位置**（或当前可见位置）来锚定，别读隐藏元素的 rect ——

        if (!choicesManualPos) {
