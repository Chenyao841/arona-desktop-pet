// ===== 陪玩点评模式（🎬）=====
// 设计：独立计时器（不被鼠标活动清零）+ 画面变化检测（后端）+ 一步法视觉点评 + 短句
// 本模式下：不跟随鼠标、点评时不看回老师、音量按比例调小、概率延长间隔；麻将/抽卡等自动化期间完全暂停
function commentaryVolumeScale() {
    if (!commentaryMode) return 1;
    const p = parseInt(commentaryCfg.volume_percent);
    return Math.max(0.05, Math.min(1, (isNaN(p) ? 45 : p) / 100));
}
/** 语境中文/英文 → code */
function commentaryContextCode(word) {
    const s = (word || '').trim().toLowerCase();
    if (!s) return '';
    if (/b站|bilibili|视频|直播|番剧|看视频|看直播|bilibili/.test(s)) return 'bilibili';
    if (/麻将|雀魂|mahjong/.test(s)) return 'mahjong';
    if (/蔚蓝|档案|抽卡|ba\b|bluearchive/.test(s)) return 'bluearchive';
    if (/办公|代码|写代码|文档|工作|work/.test(s)) return 'work';
    if (/随便|其它|其他|other/.test(s)) return 'other';
    return '';
}
const COMMENTARY_LABEL = { bilibili: '看B站', mahjong: '打麻将', bluearchive: '蔚蓝档案', work: '办公', other: '随便看看' };

function setCommentaryBtn(on) {
    const btn = document.getElementById('commentaryBtn');
    if (btn) btn.classList.toggle('on', on);
}
function commentaryPaused() {
    if (isPatching) return true;                                  // 摸头中
    if (milkActive || adjustMode || choicesEditMode) return true;  // 牛奶/调整/选项编辑
    if (mahjongPollTimer) return true;                            // 麻将自动打牌中
    if (gachaRunning) return true;                                // 抽卡中
    if (continueLocked) return true;
    if (ttsAudio && !ttsAudio.paused) return true;                 // 正在说话
    if (commentaryBusy) return true;
    return false;
}
let commentaryUsable = false;   // 后端陪玩点评模块是否已开启（commentary_config.enabled）
function checkCommentaryStatus() {
    axios.get('/ai/commentary/config').then(r => {
        const c = (r.data && r.data.data && r.data.data.config) || {};
        commentaryUsable = (c.enabled === 1);
        if (c.interval_sec) {
            commentaryCfg = c;
            commentaryTickMs = Math.max(4000, (parseInt(c.interval_sec) || 12) * 1000);
        }
        const btn = document.getElementById('commentaryBtn');
        if (btn) btn.title = commentaryUsable
            ? '陪玩点评：进入后每隔十几秒看一眼你的屏幕，冒一句弹幕式短评；再点一次或说「别看了」退出'
            : '陪玩点评未开启：请到「桌宠设置 → 陪玩点评」打开模块开关';
    }).catch(() => {});
}
function enterCommentary(hint) {
    if (commentaryMode) { if (hint) setCommentaryContext(hint, true); return; }
    if (!commentaryUsable) {
        quickSay('老师还没开启「陪玩点评」哦，去桌宠设置里打开模块开关就能用了～', 'aluona_kunhuo.png');
        checkCommentaryStatus();
        return;
    }
    commentaryMode = true;
    commentaryStreak = 0; commentarySilenceUntil = 0; commentaryCount = 0;
    setCommentaryBtn(true);
    if (hint) commentaryContext = commentaryContextCode(hint);
    // 拉配置 + 重置后端画面基准
    axios.get('/ai/commentary/config').then(r => {
        const d = (r.data && r.data.data) || {};
        if (d.config) {
            commentaryCfg = d.config;
            const iv = parseInt(commentaryCfg.interval_sec);
            commentaryTickMs = Math.max(4000, (isNaN(iv) ? 12 : iv) * 1000);
            restartCommentaryTimer();
        }
    }).catch(() => {});
    axios.post('/ai/commentary/reset').catch(() => {});
    recordEvent('commentary', '老师让你进入「陪玩点评」模式，你坐在旁边看着他的屏幕，时不时冒一句短评。');
    const label = commentaryContext ? '（' + COMMENTARY_LABEL[commentaryContext] + '）' : '（我自己看着判断）';
    quickSay('好～我坐旁边看着，有话我就说一句' + label, 'aluona_qidai.png');
    restartCommentaryTimer();
    setTimeout(commentaryTick, 3000);   // 进入后 3 秒先来一次
}
function exitCommentary() {
    if (!commentaryMode) return;
    commentaryMode = false;
    setCommentaryBtn(false);
    if (commentaryTimer) { clearInterval(commentaryTimer); commentaryTimer = null; }
    quickSay('那我先不看了～' + (commentaryCount ? '（这次一共念叨了 ' + commentaryCount + ' 句）' : ''), 'aluona_zhengchang.png');
    recordEvent('commentary', '老师让你退出了「陪玩点评」模式。');
}
function restartCommentaryTimer() {
    if (commentaryTimer) clearInterval(commentaryTimer);
    commentaryTimer = setInterval(commentaryTick, commentaryTickMs);
}
function setCommentaryContext(word, manual) {
    const code = commentaryContextCode(word);
    if (!code) { quickSay('没听懂是哪个场景哦，可以说「我在看B站 / 在打麻将 / 玩蔚蓝档案 / 在办公 / 随便看看」', 'aluona_kunhuo.png'); return; }
    commentaryContext = code;
    quickSay('好，那我按「' + COMMENTARY_LABEL[code] + '」的方式陪你～', 'aluona_kaixin.png');
}
/** 一次点评：到点由计时器调用（manual=true 时忽略间隔/概率，供「点评一下」使用） */
function commentaryTick(manual) {
    if (!commentaryMode) return;
    const now = Date.now();
    const afterTalk = (parseInt(commentaryCfg.after_talk_sec) || 20) * 1000;
    if (!manual) {
        if (commentaryPaused()) return;
        if (now < commentarySilenceUntil) return;
        if (now - lastAiTime < afterTalk) return;   // 刚聊完，先安静一会
        const skip = parseInt(commentaryCfg.skip_percent);
        if (Math.random() * 100 < (isNaN(skip) ? 35 : skip)) return;  // 概率延长间隔，减少"烦人"
    }
    commentaryBusy = true;
    axios.post('/ai/commentary/once', { context: commentaryContext || '' }).then(r => {
        commentaryBusy = false;
        const d = (r.data && r.data.data) || {};
        if (d.skipped) { console.log('[陪玩点评] 跳过：' + (d.reason || '')); return; }
        if (!d.text) return;
        const motion = d.motion || 'aluona_zhengchang.png';
        if (d.context && d.contextSource === 'auto' && !commentaryContext) commentaryContext = d.context;
        commentaryStreak++;
        commentaryCount++;
        commentaryLastAtGlobal = Date.now();
        showResult({ code: 1, message: d.text, motion: motion });   // 复用现有播放链路（文字+表情+短句TTS）
        recordEvent('commentary', '你在一旁看老师玩，冒了一句点评：「' + d.text + '」');
        console.log('[陪玩点评] ' + d.text + (d.changeScore != null ? '（画面差异 ' + d.changeScore + '）' : ''));
        // 连续点评达上限 → 静默一段
        const maxStreak = parseInt(commentaryCfg.max_streak) || 3;
        if (commentaryStreak >= maxStreak) {
            commentaryStreak = 0;
            commentarySilenceUntil = Date.now() + (parseInt(commentaryCfg.silence_sec) || 45) * 1000;
            console.log('[陪玩点评] 连续 ' + maxStreak + ' 句，静默 ' + ((parseInt(commentaryCfg.silence_sec) || 45)) + ' 秒');
        }
    }).catch(e => { commentaryBusy = false; console.warn('[陪玩点评] 请求失败', e); });
}

function onTalkKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        let text = e.target.value.trim();
        if (!text) { exitInputMode(true); return; }
        if (game.active && handleGameInput(text)) {
            exitInputMode(false);
            if (pendingQuickSay) { quickSay(pendingQuickSay.msg, pendingQuickSay.motion); pendingQuickSay = null; }
        } else if (reactiveMap['talk'] && !pcIsCommandText(text)) {
            const c = reactiveMap['talk'];
            delete reactiveMap['talk'];
            exitInputMode(false);
            executeHiddenChoice(c);
        } else if (tryHandleLocal(text)) {
            exitInputMode(false);
            if (pendingQuickSay) { quickSay(pendingQuickSay.msg, pendingQuickSay.motion); pendingQuickSay = null; }
        } else {
            // 普通聊天：优先 🖱️ 鼠标操控，其次 👁 截屏/【desktop】标记（标记剥离后 AI 看不到）
            const hasMarker = /【\s*desktop\s*】/i.test(text);
            if (hasMarker) text = text.replace(/【\s*desktop\s*】/gi, '').trim();
            if (mousePending) {
                sendMouse(text);
                return;
            }
            if (webSearchPending) {
                sendWebSearch(text);
                return;
            }
            if (visionPending || hasMarker) {
                sendVision(text);
                return;
            }
            exitInputMode(false);
            const dt = document.getElementById('dialogText');
            if (dt) dt.textContent = '...';
            callReaction('loading');
            lastAiTime = Date.now();
            clearCurrentActivity();
            console.log('[发送] user_operation=chat live2d=' + useLive2D + ' text=' + text);
            axios.post('/talk', { user_text: text, user_operation: 'chat', session_id: talkSessionId, live2d: useLive2D }).then(r => {
                if (typewriterTimer) { clearTimeout(typewriterTimer); typewriterTimer = null; }
                if (r.data.code === 1) showResult(r.data);
                else if (dt) dt.textContent = '响应出错，请重试';
            }).catch(e => {
                console.error(e);
                const dt2 = document.getElementById('dialogText');
                if (dt2) dt2.textContent = '网络错误，请检查后端服务';
            });
        }
    }
    if (e.key === 'Escape') exitInputMode(true);
}

// ===== 事件监听 =====
document.addEventListener('click', e => {
    // 点在任何 UI 控件上都不算「点桌宠」：按钮 / 输入框 / 锁定键 / 调整面板 / **对话选项按键**
    // （否则点 ⚙ 编辑选项、🎯 调整位置这类状态按钮会顺带触发一次「点击桌宠」的响应；
    //  选项按键是 div.choice-btn 不是 button，Live2D 模式下 hitTest 又按模型区域命中，
    //  按钮压在模型上时会被当成"点桌宠"→ 先把选项清掉、再放 click 反应，
    //  结果就是"点了选项没反应，只看到 click 回应"——踩过这个坑）
    if (e.target.closest('button, input, textarea, select, .lock-btn, #adjustPanel, #choicesWrapper')) return;
    // 牛奶模式点别处退出：吞掉随后这次 click，避免误触发对话框/选项逻辑
    if (window.__milkExitedClick) {
        window.__milkExitedClick = false;
        return;
    }
    // 点击对话框外部 → 关闭输入模式
    if (inputMode && !e.target.closest('#dialogBox') && !e.target.closest('#talkInput')) {
        exitInputMode(true);
    }

    // 桌宠图片点击（Live2D 模式按模型坐标命中检测）
    const petHit = useLive2D ? l2dBridge.hitTest(e.clientX, e.clientY) : e.target.closest('#petContainer');
    if (petHit && !isInteractionLocked()) {
        // 🎯 调整 / ⚙ 编辑选项模式：点击桌宠仅用于拖动定位，不触发 click 交互响应
        if (isUiAdjusting()) return;
        // 摸头松手产生的 click：交给 rub 交互，不再重复触发 click 响应
        if (window.__suppressNextPetClick) {
            window.__suppressNextPetClick = false;
            return;
        }
        choicesBox_display_none();
        recordEvent('click', '老师轻轻点了点你，想引起你的注意。');
        if (reactiveMap['click']) {
            const c = reactiveMap['click'];
            delete reactiveMap['click'];
            executeHiddenChoice(c);
        } else {
            callReaction('click');
        }
        return;
    }

    // 对话框点击（分页按键除外）
    if (e.target.closest('#dialogBox') && !e.target.closest('#dialogPager')) {
        if (speechPageAdvance()) return;   // 手动翻段（会重排兜底定时器；不点也会自动翻）
        if (textSegments.length > 0) {
            typewriterText(document.getElementById('dialogText'), textSegments.shift(), 40);
            if (textSegments.length === 0) {
                document.getElementById('dialogBox').classList.remove('dialog-clickable');
                if (currentChoices && currentChoices.length) {
                    document.getElementById('dialogBox').classList.add('dialog-clickable');
                }
            }
            return;
        }
        const wrapper = document.getElementById('choicesWrapper');
        if (currentChoices && currentChoices.length) {
            if (wrapper.style.display === 'flex') { wrapper.style.display = 'none'; }
            else { renderChoices(); }
        }
    }
});

function choicesBox_display_none() {

// 宠物鼠标移入/移出（测试期临时关闭 hover/移入响应：HOVER_ENABLED=false）
const HOVER_ENABLED = false;
const pImg = document.getElementById('petImg');
if (pImg) pImg.addEventListener('mouseenter', () => {
    if (!HOVER_ENABLED) return;
    if (isUiAdjusting()) return; // 调整/编辑选项模式屏蔽 hover
    if (milkActive) return; // 牛奶模式屏蔽 hover（图移过模型不算 hover）
    if (isInteractionLocked()) return;
    if (isPatching) return; // 摸头中屏蔽
    if (game && game.active) return; // 游戏进行中屏蔽 hover 响应（避免清掉游戏选项）
    if (reactiveMap['hover']) {
        const c = reactiveMap['hover'];
        delete reactiveMap['hover'];
        executeHiddenChoice(c);
    } else { callReaction('hover'); }
});
document.getElementById('petImg').addEventListener('mouseleave', () => {
    if (!HOVER_ENABLED) return;
    if (isUiAdjusting()) return;
    if (milkActive) return;
    if (isInteractionLocked()) return;
    if (isPatching) return; // 摸头中屏蔽
    if (reactiveMap['mouseout']) {
        const c = reactiveMap['mouseout'];
        delete reactiveMap['mouseout'];
        executeHiddenChoice(c);
    }
});

// Live2D 模式 hover 检测（petImg 隐藏，mouseenter 不触发，改用坐标判断）
let l2dHovering = false;
document.addEventListener('mousemove', e => {
    if (!useLive2D || !l2dBridge.ready) return;
    if (!HOVER_ENABLED) return; // 测试期临时关闭
    if (isUiAdjusting()) {
        // 调整/编辑/牛奶模式屏蔽 hover/移出；同步悬停状态，避免退出后误触发
        try { l2dHovering = l2dBridge.hitTest(e.clientX, e.clientY); } catch (err) {}
        return;
    }
    if (milkActive) return; // 牛奶模式屏蔽 hover/移出
    if (isPatching) return; // 摸头中屏蔽 hover/移出
    const hit = l2dBridge.hitTest(e.clientX, e.clientY);
    if (hit && !l2dHovering) {
        l2dHovering = true;
        if (isInteractionLocked()) return;
        if (game && game.active) return; // 游戏进行中屏蔽 hover 响应
        if (reactiveMap['hover']) {
            const c = reactiveMap['hover'];
            delete reactiveMap['hover'];
            executeHiddenChoice(c);
        } else { callReaction('hover'); }
    } else if (!hit && l2dHovering) {
        l2dHovering = false;
        if (isInteractionLocked()) return;
        if (reactiveMap['mouseout']) {
            const c = reactiveMap['mouseout'];
            delete reactiveMap['mouseout'];
            executeHiddenChoice(c);
        }
    }
});

    (function() {
        const db = document.getElementById('dialogBox');
        if (db) db.style.top = Math.max(60, window.innerHeight - db.offsetHeight - 40) + 'px';
    })();
    callReaction('login');
    // 指令库（设置窗口可编辑的指令别名）
    loadCommandLib();
    // 联网查询模块状态（🔍 按钮可用性）
    checkWebSearchStatus();
    // 陪玩点评模块状态（🎬 按钮可用性）
    checkCommentaryStatus();
    // 摸头有效区域：按「区域标注工具」的标注换算比例（重新标注后刷新即生效）
    loadHeadZoneFromRegions();
    // 启动时清理遗留的游戏会话历史（防止上次中途退出残留，避免旧游戏内容干扰后续对话）
    axios.post('/ai/game-history/clean').catch(() => {});
    axios.get('/effects').then(r => { window.effectList = r.data.data || []; });
    // 读取直播模式状态，用于闲置提示词贴合场合
    axios.get('/ai/config').then(r => { if (r.data && r.data.data) isLiveMode = !!(r.data.data.live_mode); }).catch(() => {});
    // 加载持久化设置
    try {
        const sets = JSON.parse(localStorage.getItem('pet_settings') || '{}');
        if (sets.petWidth) { document.getElementById('petContainer').style.width = sets.petWidth + 'px'; }
        if (sets.petX != null) { document.getElementById('petContainer').style.left = sets.petX + 'px'; }
        if (sets.petY != null) { document.getElementById('petContainer').style.top = sets.petY + 'px'; }
        if (sets.defVolume != null) { musicPlayer.setVolume(sets.defVolume / 100); }
        if (sets.tts != null) ttsEnabled = !!sets.tts;
        if (sets.ttsVariant != null) ttsVariant = parseInt(sets.ttsVariant) || 0;
        if (sets.idleGaze != null) idleGaze = !!sets.idleGaze;
        if (sets.idle != null) idleEnabled = !!sets.idle;
        if (sets.choiceText != null) choiceTextMode = !!sets.choiceText;
        if (sets.live2D) { useLive2D = true; l2dBridge.show(); }
        // 桌宠显示开关（设置窗口「基础外观」首行）
        if (sets.petVisible === 0 || sets.petVisible === false) {
            const pc = document.getElementById('petContainer');
            if (pc) pc.style.display = 'none';
            if (l2dBridge && l2dBridge.hide) l2dBridge.hide();
        }
        if (sets.gameQuick != null) gameQuickReply = !!sets.gameQuick;
        if (sets.desktopVision != null) desktopVision = !!sets.desktopVision;
        if (sets.neteaseLevel) neteaseLevel = sets.neteaseLevel;
        if (sets.neteaseEnabled != null) neteaseEnabled = !!sets.neteaseEnabled;
        if (sets.gameEnabled != null) gameEnabled = !!sets.gameEnabled;
        if (sets.mahjongEnabled != null) mahjongEnabled = !!sets.mahjongEnabled;
        if (sets.gameModel) gameModel = sets.gameModel;
        if (sets.live2dX != null || sets.live2dY != null) {
            l2dBridge.setBaseOffset(parseInt(sets.live2dX) || 0, parseInt(sets.live2dY) || 0);
        }
        if (sets.live2dScale != null) {
            l2dBridge.setScale(parseFloat(sets.live2dScale) || 1);
        }
        if (sets.dialogWidth) {
            document.getElementById('dialogBox').style.width = sets.dialogWidth + 'px';
        }
        if (sets.dialogPadding != null) {
            document.getElementById('dialogBox').style.paddingLeft = sets.dialogPadding + 'px';
            document.getElementById('dialogBox').style.paddingRight = sets.dialogPadding + 'px';
        }
        if (sets.choicesX != null && sets.choicesY != null) {
            choicesManualPos = { x: sets.choicesX, y: sets.choicesY };
        }
        if (sets.choicesBtnW) choicesBtnW = sets.choicesBtnW;
        document.getElementById('choicesWrapper').style.setProperty('--btn-w', choicesBtnW + 'px');
        // 对话框位置（拖动结束即保存；这里开机还原）
        const dlg = document.getElementById('dialogBox');
        if (sets.dialogX != null && sets.dialogY != null) {
            dlg.style.left = sets.dialogX + 'px';
            dlg.style.top = sets.dialogY + 'px';
            dlg.style.right = 'auto';
            dlg.style.bottom = 'auto';
        }
        // 选项栏位置也立刻套用一次（避免要等第一次出选项才生效）
        if (choicesManualPos) {
            const cw = document.getElementById('choicesWrapper');
            cw.style.left = choicesManualPos.x + 'px';
            cw.style.top = choicesManualPos.y + 'px';
            cw.style.right = 'auto';
        }
    } catch(e) {}
    initIdle();
    loadCurrentActivity();
    loadIdleActivities();
    // 解锁音效
    document.addEventListener('click', () => { soundUnlocked = true; }, { once: true });

    // ===== 弹幕接入（SSE + 10s 冷却） =====
    let danmakuCooldown = false;
    let enterRecent = {}; // 进入直播间去重 { username: timestamp }
    function handleEnter(username) {
        if (!username) return;
        const now = Date.now();
        if (enterRecent[username] && now - enterRecent[username] < 30000) return; // 30秒内同一用户只欢迎一次
        enterRecent[username] = now;
        Object.keys(enterRecent).forEach(k => { if (now - enterRecent[k] > 30000) delete enterRecent[k]; });
        playSpeech('欢迎 ' + username + ' 来到直播间～', 'aluona_kaixin.png', null, 'bounce');
    }
    const danmakuEs = new EventSource('/ai/danmaku/stream');
    danmakuEs.onmessage = function(e) {
        try {
            const d = JSON.parse(e.data);
            if (d.type === 'enter') { handleEnter(d.username); return; }
            if (danmakuCooldown || continueLocked) return;
            danmakuCooldown = true;
            // 排队指令（需要用户名）
            if (d.message === '排队') {
                if (addToQueue(d.username)) quickSay(d.username + ' 已排队成功！当前' + danmakuQueue.length + '人', 'aluona_kaixin.png');
                else quickSay(d.username + ' 已经在排队中啦～', 'aluona_huaiyi.png');
                setTimeout(() => { danmakuCooldown = false; }, 10000); return;
            }
            if (d.message === '取消排队') {
                if (removeFromQueue(d.username)) quickSay(d.username + ' 已取消排队', 'aluona_zhengchang.png');
                else quickSay(d.username + ' 不在排队列表中哦', 'aluona_kunhuo.png');
                setTimeout(() => { danmakuCooldown = false; }, 10000); return;
            }
            if (d.message === '下一个' || d.message === 'next') {
                const next = popQueue();
                if (next) quickSay('轮到 ' + next + ' 了！', 'aluona_jidong.png');
                else quickSay('排队列表是空的哦～', 'aluona_kunhuo.png');
                setTimeout(() => { danmakuCooldown = false; }, 10000); return;
            }
            if (d.message === '排队列表') {
                quickSay(showQueue(), 'aluona_zhengchang.png');
                setTimeout(() => { danmakuCooldown = false; }, 10000); return;
            }
            // 先走本地命令匹配（如"歌单"等）
            if (tryHandleLocal(d.message)) {
                if (pendingQuickSay) { quickSay(pendingQuickSay.msg, pendingQuickSay.motion); pendingQuickSay = null; }
                setTimeout(() => { danmakuCooldown = false; }, 10000);
                return;
            }
            const text = '[弹幕] ' + d.username + '说: ' + d.message;
            quickSay('弹幕: ' + d.username + '说: ' + d.message, 'aluona_qidai.png');
            lastAiTime = Date.now();
            clearCurrentActivity();
            axios.post('/talk', { user_text: text, user_operation: 'chat_fan', session_id: talkSessionId }).then(r => {
                if (r.data.code === 1) showResult(r.data);
            }).catch(() => {});
            setTimeout(() => { danmakuCooldown = false; }, 10000);
        } catch (ex) {}
    };
    danmakuEs.onerror = function(e) { console.log('[DM] SSE连接错误'); };
});

// ===== 启动时拉取"眼睛高度"标注（后端文件，标注页写入）并写入本地 pet_settings =====
(function() {
    axios.get('/ai/pet-eye-ratio').then(r => {
        const d = (r.data && r.data.data) || {};
        if (d && typeof d.ratio === 'number') {
            try {
                const sets = JSON.parse(localStorage.getItem('pet_settings') || '{}');
                if (sets.lookEyeRatio !== d.ratio) {
                    sets.lookEyeRatio = d.ratio;
                    localStorage.setItem('pet_settings', JSON.stringify(sets));
                    console.log('[L2D] 已从后端同步眼睛高度 ' + (d.ratio * 100).toFixed(1) + '%');
                }
            } catch(e) {}
        }
    }).catch(() => {});
})();
</script>
</body>
</html>
