// ===== 歌单分页（搜歌/曲库：去文本化，仅按钮 + ←→ 翻页，翻页不朗读） =====
let songPage = 0;
const SONG_PAGE_SIZE = 5;

function renderSongChoices() {
    const songs = window._songChoices || [];
    const total = Math.ceil(songs.length / SONG_PAGE_SIZE);
    if (songPage >= total) songPage = total - 1;
    if (songPage < 0) songPage = 0;
    const start = songPage * SONG_PAGE_SIZE;
    const pageSongs = songs.slice(start, start + SONG_PAGE_SIZE);
    currentChoices = pageSongs.map(s => ({ choiceText: s.name + ' - ' + s.artist, choiceAction: 'netease_play', boatText: '', song: s }));
    document.getElementById('dialogBox').classList.add('dialog-clickable');
    renderChoices();
    const pager = document.getElementById('dialogPager');
    if (total > 1) {
        pager.style.display = 'block';
        document.getElementById('pagerInfo').textContent = (songPage + 1) + '/' + total;
        document.getElementById('pagerPrev').disabled = (songPage <= 0);
        document.getElementById('pagerNext').disabled = (songPage >= total - 1);
    } else {
        pager.style.display = 'none';
    }
}
function songPagePrev() { if (songPage > 0) { songPage--; renderSongChoices(); } }
function songPageNext() { const total = Math.ceil((window._songChoices || []).length / SONG_PAGE_SIZE); if (songPage < total - 1) { songPage++; renderSongChoices(); } }

// 选项点击
const CHOICE_BUFFER_MS = 1000; // 选项选中缓冲时长（毫秒），全局唯一配置
document.documentElement.style.setProperty('--choice-buffer', CHOICE_BUFFER_MS + 'ms');
let choiceBufferIdx = null; // 选项缓冲中（选中的索引），避免重复触发

function onChoiceClick(idx) {
    if (choicesEditMode) return; // ⚙ 编辑选项模式：点击仅用于拖动/调整大小，不触发选项对话
    const choice = currentChoices[idx];
    if (!choice) return;
    if (choiceBufferIdx !== null) return; // 缓冲期间忽略其它选择

    // 选中动画：按钮从放大状态渐回原样（1s 缓冲）
    const wrapper = document.getElementById('choicesWrapper');
    const btn = wrapper ? wrapper.querySelectorAll('.choice-btn')[idx] : null;
    if (btn) btn.classList.add('selected');

    choiceBufferIdx = idx;
    setTimeout(function() {
        choiceBufferIdx = null;
        doChoice(idx);
    }, CHOICE_BUFFER_MS);
}

function doChoice(idx) {
    const choice = currentChoices[idx];
    if (!choice) return;
    // 游戏快捷选项：点击后等同手动输入该回答
    if (choice.choiceAction && choice.choiceAction.indexOf('game_reply_') === 0) {
        const reply = choice.choiceAction.substring('game_reply_'.length);
        choicesBox_display_none();
        currentChoices = null;
        renderChoices();
        handleGameInput(reply);
        return;
    }
    // 你画我猜的选项按键（继续画 / 公布答案 / 再来一局 / 先不玩了）
    if (choice.choiceAction && choice.choiceAction.indexOf('pictionary_') === 0) {
        const act = choice.choiceAction.substring('pictionary_'.length);
        choicesBox_display_none();
        currentChoices = null;
        renderChoices();
        pcHandleChoice(act);
        return;
    }
    // 本地指令快捷选项（麻将「下一局/先暂停/跳过」等）：点击等同语音输入该指令
    if (choice.choiceAction && choice.choiceAction.indexOf('local_cmd_') === 0) {
        const cmd = choice.choiceAction.substring('local_cmd_'.length);
        mahjongDialogShown = false;
        choicesBox_display_none();
        currentChoices = null;
        renderChoices();
        handleLocalCommand(cmd);
        return;
    }
    // 桌宠基础设置：打开桌宠「基础设置」窗口的「AI 设定」页（原「打开基本信息表」，管理页已不再显示该入口）
    if (choice.choiceAction === 'basicinfo') {
        choicesBox_display_none();
        currentChoices = null;
        renderChoices();
        window.open('桌宠设置.html?t=' + Date.now(), '_blank', 'width=1257,height=748');
        quickSay('桌宠基础设置帮你打开啦～', 'aluona_kaixin.png');
        return;
    }
    // 网易云点歌：只加入队列，由 add() 给出正确文案（"已加入队列/正在播放"），不再额外播报"正在播放"
    if (choice.choiceAction === 'netease_play') {
        const song = choice.song || ((window._songChoices && window._songChoices[idx]) || null);
        if (song) { showMusicPanel(); neteaseQueue.add(song, { user: true }); }
        currentChoices = null;
        renderChoices();
        document.getElementById('dialogBox').classList.remove('dialog-clickable');
        return;
    }
    playSpeech(choice.boatText, choice.motion, choice.soundEffect, choice.specialEffect);
    if (choice.nextChoiceId && choice.nextChoiceId > 0) {
        axios.get('/choice/sub', { params: { choice_id: choice.id } }).then(r2 => {
            if (r2.data.motion) return;
            if (r2.data.data) {
                const vis = [];
                r2.data.data.forEach(c => {
                    const uop = c.userOperation || 'chat';
                    if (DESKTOP_HIDDEN_CHOICE_ACTIONS.indexOf(c.choiceAction) >= 0) return;
                    if (uop !== 'chat') { reactiveMap[uop] = c; }
                    else if (c.choiceText && c.choiceText.trim()) { vis.push(c); }
                });
                if (vis.length) {
                    currentChoices = vis;
                    document.getElementById('dialogBox').classList.add('dialog-clickable');
                }
            }
        });
    }
    if (!isDesktopAllowed(choice.choiceAction)) {
        quickSay('桌面版不支持此操作，请在管理页面中进行。', 'aluona_kunhuo.png');
    } else if (handleMusicAction(choice.choiceAction)) {
        // 音乐操作已处理
    }
    currentChoices = null;
    renderChoices();
    document.getElementById('dialogBox').classList.remove('dialog-clickable');
}

// 隐藏选项
function executeHiddenChoice(choice) {
    const action = choice.choiceAction;
    delete reactiveMap[action];
    if (!isDesktopAllowed(action)) return;
    if (handleMusicAction(action)) return;
    playSpeech(choice.boatText, choice.motion, choice.soundEffect, choice.specialEffect);
    if (choice.nextChoiceId && choice.nextChoiceId > 0) {
        axios.get('/choice/sub', { params: { choice_id: choice.id } }).then(r2 => {
            if (r2.data.motion) return;
            if (r2.data.data) {
                r2.data.data.forEach(c => {
                    const uop = c.userOperation || 'chat';
                    if (uop !== 'chat') {
                        reactiveMap[uop] = c;
                        const cm = uop.match(/^continue(\d+)$/);
                        if (cm && !continueLocked) startContinueChain(parseInt(cm[1]), c);
                    }
                });
            }
        });
    }
    currentChoices = null;
    renderChoices();
}

let continueTimer = null;
function startContinueChain(seconds, choice) {
    if (continueTimer) clearTimeout(continueTimer);
    continueLocked = true;
    idleSeconds = 0; idleIndex = 0;
    continueTimer = setTimeout(() => {
        continueLocked = false;
        if (choice) executeHiddenChoice(choice);
    }, seconds * 1000);
}
function isInteractionLocked() { return continueLocked; }

// ===== 空闲检测 =====
function initIdle() {
    axios.get('/conversation', { params: { user_id: '' } }).then(r => {
        const list = r.data.data || [];
        const triggers = [];
        list.forEach(c => {
            const m = (c.user_operation || '').match(/^idle(\d+)$/);
            if (m) triggers.push({ sec: parseInt(m[1]), record: c });
        });
        idleTriggers = triggers.sort((a, b) => a.sec - b.sec);
    });
    idleTimer = setInterval(() => {
        if (!idleEnabled) { idleSeconds = 0; return; }
        idleSeconds++;
        const aiIdle = Date.now() - lastAiTime > 120000; // 2分钟无AI调用
        // 数据库闲置触发
        if (idleIndex < idleTriggers.length) {
            const next = idleTriggers[idleIndex];
            if (idleSeconds >= next.sec) {
                idleIndex++;
                if (!continueLocked) callReaction(next.record.user_operation, () => {
                    reactiveMap = {};
                    if (continueTimer) { clearTimeout(continueTimer); continueLocked = false; }
                    scheduleIdleFollow(2500); // 数据库闲置触发后也跟随鼠标 20s（睡觉除外）
                });
                return;
            }
        }
        // AI 智能闲置：2分钟无AI → 从活动库抽活动（延续进行中的活动，或抽新主题）
        if (commentaryMode) return;   // 陪玩点评模式进行中：普通闲置让路，避免两套"自言自语"打架
        if (aiIdle && idleSeconds >= aiIdleInterval && !continueLocked) {
            idleSeconds = 0;
            aiIdleInterval = 180; // 触发后恢复默认间隔，AI 若返回 sleep 会在 showResult 里重新覆盖
            lastAiTime = Date.now();
            // 桌面视觉闲置：开启时按概率截屏 + 视觉理解，评论老师在做什么（不延续普通活动）
            if (desktopVision && Math.random() < 0.3) {
                axios.post('/talk', { user_text: '（看了一眼屏幕）', user_operation: 'desktop_vision', session_id: talkSessionId }).then(r => {
                    if (r.data.code === 1) {
                        clearCurrentActivity(); showResult(r.data);
                        scheduleIdleFollow(idleFollowDelay((r.data && (r.data.boat_text || r.data.message)) || ''));
                    }
                }).catch(() => {});
                return;
            }
            // 决定本次活动：延续进行中的活动（未到上限），或抽新主题
            let act;
            if (currentActivity && currentActivity.round < 4) {
                act = { theme: currentActivity.theme, category: currentActivity.category, round: currentActivity.round + 1, lastText: currentActivity.lastText, continued: true };
            } else {
                const picked = pickIdleTheme();
                act = { theme: picked.theme, category: picked.category, round: 1, lastText: null, continued: false };
            }
            // 听歌时：音乐提示与活动提示随机二选一，避免同一次响应既哼歌又做活动
            const musicHint = buildMusicIdlePrompt();
            const useMusic = !!musicHint && Math.random() < 0.5;
            let idlePrompt = useMusic ? musicHint : buildActivityPrompt(act);
            if (isLiveMode) idlePrompt += '（你现在正在B站直播中，空闲时优先和直播间观众互动、聊聊直播间趣事或正在播的内容，保持主播的活跃氛围）';
            lastIdleSlept = false;
            axios.post('/talk', { user_text: idlePrompt, user_operation: 'idle_ai', session_id: talkSessionId, live2d: useLive2D }).then(r => {
                if (r.data.code === 1) {
                    if (useMusic) {
                        // 音乐回应：不推进活动延续状态
                        showResult(r.data);
                    } else {
                        // 睡觉活动或 AI 返回 sleep 则结束当前活动；否则记录为进行中，供下次延续
                        if (act.category === 'sleep' || (r.data.sleepSeconds && r.data.sleepSeconds > 0)) {
                            currentActivity = null;
                        } else {
                            currentActivity = { theme: act.theme, category: act.category, round: act.round, lastText: r.data.message };
                        }
                        saveCurrentActivity();
                        showResult(r.data);
                    }
                    // AI 闲置说话结束后 → 视线跟随鼠标 20s（睡觉中由 helper 内 guard 跳过）
                    scheduleIdleFollow(idleFollowDelay((r.data && (r.data.boat_text || r.data.message)) || ''));
                }
            }).catch(() => {});
        }
    }, 1000);
    const resetIdle = () => { idleSeconds = 0; idleIndex = 0; };
    ['mousemove', 'keydown', 'click', 'scroll'].forEach(evt => {
        document.addEventListener(evt, resetIdle);
    });
}

// ===== 闲置响应后的鼠标跟随（睡觉除外）=====
function idleFollowDelay(text) {
    if (!text) return 1800;
    return Math.min(22000, 700 + String(text).length * 170);
}
function scheduleIdleFollow(delayMs) {
    setTimeout(function() {
        if (useLive2D && typeof l2dBridge !== 'undefined' && l2dBridge.ready && !isSleeping) {
            l2dBridge.followCursor(20000);
        }
    }, delayMs || 1800);
}

// ===== 闲置活动库 =====
function loadIdleActivities() {
    axios.get('/ai/idle-activities/enabled').then(r => { idleActivities = r.data.data || []; }).catch(() => {});
}
function loadCurrentActivity() {
    try { currentActivity = JSON.parse(localStorage.getItem('idle_current_activity') || 'null'); } catch(e) { currentActivity = null; }
}
function saveCurrentActivity() {
    try { localStorage.setItem('idle_current_activity', JSON.stringify(currentActivity)); } catch(e) {}
}
function clearCurrentActivity() {
    currentActivity = null;
    saveCurrentActivity();
}
// 从活动库抽一个新主题：排除刚结束的主题，睡觉类低概率命中
function pickIdleTheme() {
    const prevTheme = currentActivity ? currentActivity.theme : null;
    const enabled = idleActivities.filter(a => a.enabled === 1 && a.theme !== prevTheme);
    const normal = enabled.filter(a => a.category !== 'sleep');
    const sleeps = enabled.filter(a => a.category === 'sleep');
    const useSleep = sleeps.length > 0 && Math.random() < 0.1; // 睡觉约 10% 概率命中
    let list = useSleep ? sleeps : normal;
    if (!list.length) list = enabled.length ? enabled : idleActivities;
    if (!list.length) return { theme: '自娱自乐一下', category: 'simple' };
    const pick = list[Math.floor(Math.random() * list.length)];
    return { theme: pick.theme, category: pick.category };
}
// 拼活动主题提示词（不叠加音乐/直播，单独使用）
function buildActivityPrompt(act) {
    if (act.category === 'sleep') {
        return '（' + act.theme + '。请说一句类似"我睡会儿"的话，并在JSON里加"sleep":秒数（300到1800之间的整数）表示你要睡多久）';
    } else if (act.continued) {
        const prev = act.lastText ? '，上次你说："' + act.lastText + '"' : '';
        return '（你刚才在做【' + act.theme + '】' + prev + '。请继续这个活动，自然推进到下一阶段；如果已经到自然结局，就收个尾）';
    }
    if (act.category === 'continuable') {
        return '（你现在想【' + act.theme + '】。请演绎这个活动的开头，后续可以分段继续发展）';
    }
    return '（你现在想【' + act.theme + '】。简单演绎一下即可，保持活泼元气）';
}
// 拼音乐相关闲置提示词；未在播放时返回 null
function buildMusicIdlePrompt() {
    if (musicPlayer.playing()) {
        const s = musicCurrentSong();      // 插播中的歌优先
        if (s) return '（你正在播放歌曲《' + s.name + '》' + (s.artist ? ' - ' + s.artist : '') + '，可以跟着哼唱、点评这首歌或聊聊音乐）';
    }
    return null;
}

// 桌面版功能白名单：仅允许交互、音乐、导航类操作
function isDesktopAllowed(action) {
    if (!action) return true;
    // 允许音乐控制
    if (/^music_/.test(action)) return true;
    // 允许的标准交互（含摸头 rub / 牛奶 milk）
    if (/^(click|hover|mouseout|rub|milk|login|loading|talk|idle\d*|continue\d*)$/.test(action)) return true;
    // 允许的操作（对话选项内的行为）
    const ALLOWED = ['act', 'chat', 'rule_info'];
    if (ALLOWED.includes(action)) return true;
    // 其他一律禁止（增删改查、管理面板、跳转登录等）
    return false;
}

// ===== 已播历史（去重，跨会话持久化）=====
const playedHistory = {
    key: 'netease_played_history',
    max: 200,
    items: [],
    load() { try { this.items = JSON.parse(localStorage.getItem(this.key) || '[]'); } catch(e) { this.items = []; } },
    save() { try { localStorage.setItem(this.key, JSON.stringify(this.items.slice(0, this.max))); } catch(e) {} },
    hasId(id) { return this.items.some(x => x.id === id); },
    mark(song) {
        if (!song || !song.id) return;
        if (this.hasId(song.id)) return;
        this.items.unshift({ id: song.id, name: song.name });
        if (this.items.length > this.max) this.items.length = this.max;
        this.save();
    },
    names() { return this.items.slice(0, 50).map(x => x.name).join('、'); }
};
playedHistory.load();

// ===== 音乐播放器 =====
const musicPlayer = {
    audio: null,
    mode: 'sequential',
    volume: 0.4,
    init() {
        if (this.audio) return;
        this.audio = new Audio();
        this.audio.volume = this.volume;
        this.audio.onended = () => this.onEnded();
        this.audio.ontimeupdate = () => { if (typeof neteaseQueue !== 'undefined') neteaseQueue._onProgress(); };
        this.audio.onwaiting = () => { console.log('[音乐] waiting'); if (typeof neteaseQueue !== 'undefined') neteaseQueue._onBuffering(); };
        this.audio.onstalled = () => { console.log('[音乐] stalled'); if (typeof neteaseQueue !== 'undefined') neteaseQueue._onBuffering(); };
        this.audio.onplaying = () => { console.log('[音乐] playing'); if (typeof neteaseQueue !== 'undefined') neteaseQueue._onRecover(); };
        this.audio.onerror = () => { console.log('[音乐] error'); if (typeof neteaseQueue !== 'undefined') neteaseQueue._onAudioError(); };
        document.body.appendChild(this.audio);
    },
    pause() { if (this.audio) this.audio.pause(); if (typeof neteaseQueue !== 'undefined' && neteaseQueue._cancelStallWatch) neteaseQueue._cancelStallWatch(); },
    resume() { if (this.audio) this.audio.play().catch(() => {}); },
    toggle() {
        if (!this.audio || !this.audio.src) { quickSay('请先点歌哦～', 'aluona_kunhuo.png'); return; }
        this.audio.paused ? this.resume() : this.pause();
    },
    setVolume(v) { this.volume = Math.max(0, Math.min(1, v)); if (this.audio) this.audio.volume = this.volume; },
    setMode(m) { this.mode = m; },
    playing() { return this.audio && !this.audio.paused; }
};
// ===== 网易云流媒体队列 =====
const neteaseQueue = { songs: [], idx: -1, temp: null,   // temp = 正在插播的歌（不改队列顺序）
    // 卡顿重试状态（基于"无进度"判断，避免破坏性重连）
    stallTimer: null, stallRetries: 0, lastProgressPos: 0, lastProgressAt: 0, recovering: false,
    _cancelStallWatch() { if (this.stallTimer) { clearTimeout(this.stallTimer); this.stallTimer = null; } },
    _armStallTimer() { this._cancelStallWatch(); this.stallTimer = setTimeout(() => this._onStallTimeout(), 12000); },
    // timeupdate：记录真实播放进度，并清除卡顿状态
    _onProgress() {
        const a = musicPlayer.audio; if (!a) return;
        this.lastProgressPos = a.currentTime || 0;
        this.lastProgressAt = Date.now();
        this.recovering = false;
        this._cancelStallWatch();
    },
    // waiting/stalled：重连期间忽略，否则启动"无进度"看门狗
    _onBuffering() {
        if (this.recovering) return;
        this._armStallTimer();
    },
    // 连续 12 秒无播放进度才判定为真卡顿
    _onStallTimeout() {
        this.stallTimer = null;
        if (Date.now() - this.lastProgressAt < 12000) return; // 期间有进度，非真卡
        console.log('[音乐] 12秒无进度，重取直链，进度=' + this.lastProgressPos);
        this.recovering = true;
        this.refreshCurrent(this.lastProgressPos);
    },
    _onRecover() { this.recovering = false; this.stallRetries = 0; this._cancelStallWatch(); },
    _onAudioError() { console.log('[音乐] audio error，切下一首'); this.recovering = false; this._cancelStallWatch(); this.next(); },
    async refreshCurrent(pos) {
        if (this.idx < 0 || this.idx >= this.songs.length) { this.recovering = false; return; }
        if (this.stallRetries >= 2) { this.stallRetries = 0; this.recovering = false; console.log('[音乐] 重试耗尽，切下一首'); this.next(); return; }
        this.stallRetries++;
        const s = this.songs[this.idx];
        try {
            const url = await this.getUrl(s.id);
            if (!url) { this.stallRetries = 0; this.recovering = false; this.next(); return; }
            s.url = url;
            const a = musicPlayer.audio;
            const target = (pos != null && pos > 0) ? pos : 0;
            a.src = url;
            a.addEventListener('loadedmetadata', () => { try { a.currentTime = target; } catch(e) {} }, { once: true });
            a.play().catch(() => {});
            this._armStallTimer(); // 兜底：新链接仍长时间无进度则继续超时重试
        } catch(e) { this.stallRetries = 0; this.recovering = false; this.next(); }
    },
    async search(kw) {
        // 空关键词：axios 会把 undefined 参数丢掉 → 后端 @RequestParam 缺参直接 400（浏览器控制台就是那条 400）
        const k = (kw == null) ? '' : String(kw).trim();
        if (!k) return [];
        try { const r = await axios.get('/ai/music/search', { params: { keyword: k } }); return r.data.data || []; } catch(e) { return []; }
    },
    async getUrl(id) {
        // 同样防缺参：id 为空/undefined 时 axios 会丢掉这个参数 → 后端 400
        if (id == null || String(id).trim() === '') { console.log('[音乐] 歌曲缺少 id，无法取直链'); return null; }
        try { const r = await axios.get('/ai/music/url', { params: { id: String(id), level: neteaseLevel } }); return r.data.data; } catch(e) { return null; }
    },
    async playIndex(i) {
        console.log('[音乐] playIndex(' + i + ') 队列长度=' + this.songs.length + ' idx=' + this.idx);
        if (i < 0 || i >= this.songs.length) return;
        // 换歌 → 把"被换掉的那首"（含被跳过的）压进上一首历史栈
        const outgoing = musicCurrentSong();
        if (outgoing && (!this.songs[i] || outgoing.id !== this.songs[i].id)) musicPushHistory(outgoing);
        this.temp = null;                    // 正常播队列 → 清掉插播状态
        this.idx = i; const s = this.songs[i];
        if (s.bad) { console.log('[音乐] 跳过坏歌: ' + s.name); this.next(); return; }
        if (!s.url) {
            s.url = await this.getUrl(s.id);
            if (!s.url) {
                s.bad = true;
                console.log('[音乐] 获取播放链接失败: ' + s.id + ' ' + s.name + '，标记跳过');
                quickSay('这首歌暂时无法播放，已跳过：' + s.name, 'aluona_huaiyi.png');
                this.next();
                return;
            }
        }
        this.stallRetries = 0; this.recovering = false; this.lastProgressAt = 0; this.lastProgressPos = 0; this._cancelStallWatch();
        musicPlayer.init();
        musicPlayer.audio.src = s.url;
        musicPlayer.audio.play().catch(() => {});
        playedHistory.mark(s);
        recordEvent('music', '老师让你播放了《' + s.name + '》' + (s.artist ? ' - ' + s.artist : '') + '，你正跟着旋律轻轻哼唱。');
        quickSay('正在播放：' + s.name + ' - ' + s.artist, 'aluona_kaixin.png');
        pushMusicState();                    // 面板：正在播/队列高亮
        if (this.songs.length - this.idx <= 2) this.fillMore();
    },
    /**
     * 插播一首（面板列表里点任意一首 / 播上一首走这里）：
     * **不动 idx、不改队列顺序**，播完由 musicPlayer.onEnded 回到原队列的下一首。
     * 当前正在播的那首算"播完"（进上一首历史栈）。
     */
    async playTemp(song, reason) {
        if (!song) return;
        const outgoing = musicCurrentSong();
        if (outgoing && outgoing.id !== song.id) musicPushHistory(outgoing);
        let url = song.url;
        if (!url) { url = await this.getUrl(song.id); if (url) song.url = url; }
        if (!url) { quickSay('这首暂时放不了：' + song.name, 'aluona_huaiyi.png'); return; }
        this.stallRetries = 0; this.recovering = false; this.lastProgressAt = 0; this.lastProgressPos = 0; this._cancelStallWatch();
        this.temp = song;
        musicPlayer.init();
        musicPlayer.audio.src = url;
        musicPlayer.audio.play().catch(() => {});
        playedHistory.mark(song);
        recordEvent('music', '老师让你播放了《' + song.name + '》' + (song.artist ? ' - ' + song.artist : '') + '，你正跟着旋律轻轻哼唱。');
        quickSay((reason ? reason + '：' : '插播：') + song.name + ' - ' + song.artist, 'aluona_kaixin.png');
        pushMusicState();
    },
    /** 面板列表点击：按队列下标插播 */
    async playTempIndex(i) {
        if (!(i >= 0 && i < this.songs.length)) return;
        await this.playTemp(this.songs[i], '插播');
    },
    next() {
        console.log('[音乐] next() 队列长度=' + this.songs.length + ' idx=' + this.idx);
        if (!this.songs.length) return;
        this.temp = null;              // 手动切歌 → 结束插播
        // 老师点的歌优先：不管顺序/随机模式，先播待播里最早的一首用户点歌
        const userNext = this._nextUserIndex();
        if (userNext >= 0) { console.log('[音乐] 优先播放老师点的歌 idx=' + userNext); this.playIndex(userNext); return; }
        if (musicPlayer.mode === 'random') {
            let i, guard = 0;
            do { i = Math.floor(Math.random() * this.songs.length); guard++; } while ((i === this.idx || this.songs[i].bad) && guard < 50 && this.songs.length > 1);
            this.playIndex(i);
        } else {

        this.songs.push(song);
        console.log('[音乐] add: ' + song.name + ' 队列长度=' + this.songs.length + ' idx=' + this.idx);

//  · 上一首 = **历史回退栈**：最近播放过的/被跳过的歌最多留 5 首，逐级回退
//    （"当前这首被换掉"时把 outgoing 那首压栈，所以上一首/下一首可以来回切）
//  · 列表里点任意一首 = **插播**：立刻切过去播（当前这首算播完），播完回到原队列的下一首，
//    队列顺序完全不动（neteaseQueue.temp）

// ============================================================
const musicHistoryStack = [];       // 最多 5 首 {id,name,artist}
const MUSIC_HISTORY_MAX = 5;

function musicPushHistory(song) {
    if (!song || !song.id) return;
    if (musicHistoryStack.length && musicHistoryStack[musicHistoryStack.length - 1].id === song.id) return;  // 同一首不重复压栈
    musicHistoryStack.push({ id: song.id, name: song.name, artist: song.artist });
    while (musicHistoryStack.length > MUSIC_HISTORY_MAX) musicHistoryStack.shift();
    pushMusicState();
}

/** 面板/闲置提示用的"当前正在播的歌"：插播优先于队列当前项 */
function musicCurrentSong() {
    if (neteaseQueue.temp) return neteaseQueue.temp;
    if (neteaseQueue.idx >= 0 && neteaseQueue.songs[neteaseQueue.idx]) return neteaseQueue.songs[neteaseQueue.idx];
    return null;
}

/** 上一首：从历史栈回退（栈空则提示） */
function musicPrev() {
    const s = musicHistoryStack.pop();
    if (!s) { quickSay('还没有可以回去的上一首哦～', 'aluona_kunhuo.png'); return; }
    console.log('[音乐] 上一首：' + s.name);

/** 面板状态（每秒推给音乐播放器窗口） */
function musicPanelStatePayload() {
    const a = musicPlayer.audio;
    const cur = musicCurrentSong();
    const q = [];
    for (let i = 0; i < neteaseQueue.songs.length; i++) {
        const s = neteaseQueue.songs[i];
        if (!s) continue;
        q.push({
            i: i, id: s.id, name: s.name, artist: s.artist,
            playing: (!neteaseQueue.temp && i === neteaseQueue.idx),
            next: (!neteaseQueue.temp && neteaseQueue.idx >= 0 && i === neteaseQueue.idx + 1)
        });
    }
    return {
        ok: true,
        hasAudio: !!(a && a.src),
        playing: !!(a && a.src && !a.paused),
        pos: a ? (a.currentTime || 0) : 0,
        dur: (a && isFinite(a.duration)) ? a.duration : 0,
        volume: musicPlayer.volume,
        song: cur ? { id: cur.id, name: cur.name, artist: cur.artist, temp: !!neteaseQueue.temp } : null,
        canPrev: musicHistoryStack.length > 0,

    if (p.cmd === 'toggle') { musicPlayer.toggle(); setTimeout(pushMusicState, 120); return; }
    if (p.cmd === 'next') {

        if (neteaseQueue.songs.length && neteaseQueue.idx >= 0) neteaseQueue.next();
        setTimeout(pushMusicState, 200);
        return;
    }
    if (p.cmd === 'prev') { musicPrev(); setTimeout(pushMusicState, 200); return; }
    if (p.cmd === 'playIndex') { neteaseQueue.playTempIndex(parseInt(arg, 10)); return; }
    if (p.cmd === 'volume') { musicPlayer.setVolume(parseFloat(arg)); setTimeout(pushMusicState, 120); return; }

        const a = musicPlayer.audio;
        if (a && isFinite(a.duration)) { try { a.currentTime = Math.max(0, Math.min(a.duration, parseFloat(arg))); } catch (e) { } }
        return;
    }
    if (p.cmd === 'stop') { musicPlayer.pause(); pushMusicState(); return; }   // 「×关闭音乐播放器」= 停止播放（面板随后关窗）
}

function handleMusicAction(action) {
    if (!action) return false;
    if (action === 'music_play')       { musicPlayer.toggle(); return true; }
    if (action === 'music_pause')      { musicPlayer.pause(); return true; }
    if (action === 'music_next') {
        if (neteaseQueue.songs.length && neteaseQueue.idx >= 0) { neteaseQueue.next(); }
        return true;
    }
    if (action === 'music_prev')       { musicPrev(); return true; }
    if (action === 'music_vol_up')     { musicPlayer.setVolume(musicPlayer.volume + 0.1); return true; }
    if (action === 'music_vol_down')   { musicPlayer.setVolume(musicPlayer.volume - 0.1); return true; }
    if (action === 'music_loop')       { musicPlayer.setMode('loop'); return true; }
    if (action === 'music_random')     { musicPlayer.setMode('random'); return true; }

            say('当前不是 Live2D 模型模式，或模型未就绪～', 'aluona_kunhuo.png');
            return true;
        }
        l2dBridge.stopMotion();        // 先复位所有参数，避免上次表情残留
        l2dBridge.testExpression(t);   // 再触发该表情参数
        say('已触发「' + t + '」表情，观察模型变化（含光环）～'); // 不带 motion，避免覆盖测试表情
        return true;
    }
    if (t === '复位表情') {
        if (!useLive2D || typeof l2dBridge === 'undefined' || !l2dBridge.ready) {
            say('当前不是 Live2D 模型模式，或模型未就绪～', 'aluona_kunhuo.png');
            return true;
        }
        l2dBridge.stopMotion();
        say('表情已复位到默认～'); // 不带 motion
        return true;
    }

    // —— 网络天才猜物品游戏 ——（难度：简单=宽泛物品，困难=具体物品；「我出题 N」的 N=每轮提问次数，默认 20；「你出题」无约束）
    const gameMatch = t.match(/^网络天才\s*(简单|困难)?\s*(我出题|你出题)?\s*(\d+)?$/);
    if (gameMatch) {
        const diff = gameMatch[1] || '困难';
        const who = gameMatch[2] || '我出题';
        const perRound = gameMatch[3] ? Math.max(1, Math.min(50, parseInt(gameMatch[3]))) : 20;
        startGame(who === '我出题' ? 'ai_guess' : 'user_guess', perRound, diff);
        return true;
    }

    // —— 游戏快捷选项开关 ——
    if (/^(开启快捷选项|快捷选项开|打开快捷选项)$/.test(t)) { gameQuickReply = true; quickSay('游戏快捷选项已开启～', 'aluona_zhengchang.png'); return true; }
    if (/^(关闭快捷选项|快捷选项关|关掉快捷选项)$/.test(t)) { gameQuickReply = false; quickSay('游戏快捷选项已关闭', 'aluona_zhengchang.png'); return true; }

    // —— 初始化游戏表情（seed 到 conversation 表） ——
    if (t === '初始化游戏表情') {
        axios.post('/seed-game-expressions').then(r => { quickSay(r.data.message || '已初始化', 'aluona_zhengchang.png'); }).catch(() => quickSay('初始化失败', 'aluona_kunhuo.png'));
        return true;
    }

    // —— 麻将插件：看牌 + 出牌建议（雀魂日麻，手动指令触发；需启用 ai_config.mahjong_enabled）——
    if (/^(?:看看我的牌|看下我的牌|帮我看看牌|看看麻将|麻将看看|看牌|这打出什么|出什么牌|打什么牌|该打什么|雀魂看牌)$/.test(t)) {
        say('让我看看你的牌～', 'aluona_qidai.png');
        axios.post('/ai/mahjong/analyze').then(r => {
            const d = r.data;
            if (d.code !== 1) { quickSay(d.message || '麻将插件未启用（请在设置里开启）', 'aluona_kunhuo.png'); return; }
            const x = d.data || {};
            if (x.ok === false) { quickSay(x.message || '分析失败，请确认雀魂在前台', 'aluona_kunhuo.png'); return; }
            let msg = x.comment || '';
            const sug = x.suggestions || [];
            if (sug.length) {
                msg += '（建议打：' + sug.map(s => (s.tile || '?') + '·进张' + (s.ukeire != null ? s.ukeire : '?')).join('；') + '）';
            }
            if (!msg) {
                msg = '手牌：' + (x.hand || []).join(' ') + (x.drawn ? '，摸牌' + x.drawn : '') + '，向听' + (x.shanten != null ? x.shanten : '?');
            }
            quickSay(msg, 'aluona_zhengchang.png');
        }).catch(() => quickSay('麻将分析失败，请确认后端已重启且插件已开启', 'aluona_huaiyi.png'));
        return true;
    }

    // —— 蔚蓝档案自动抽卡：帮老师抽个卡（需游戏停在 蔚蓝档案抽卡1.png 界面）——
    if (/^(?:帮老师抽个卡|帮我抽个卡|帮我抽卡|抽个卡|蔚蓝抽卡|抽卡吧)$/.test(t)) {
        say('好呀，准备好十连了吗～', 'aluona_qidai.png');
        gachaRunning = true;   // 抽卡期间陪玩点评暂停
        axios.post('/ai/gacha/start').then(r => {
            gachaRunning = false;
            const d = r.data;
            if (d.code !== 1 || !d.data || d.data.ok === false) {
                quickSay((d.data && d.data.message) || d.message || '抽卡失败', 'aluona_kunhuo.png');
                return;
            }
            quickSay(d.data.message || '抽卡完成～', 'aluona_kaixin.png');
        }).catch(() => { gachaRunning = false; quickSay('抽卡请求失败，请确认后端已重启', 'aluona_huaiyi.png'); });
        return true;
    }

    // —— 麻将实操：打把麻将（自动出牌）/ 结束 / 状态 / 摸牌 / 吃回报 ——
    if (/^打把麻将(?:\s+(.+))?$/.test(t)) {
        const tiles = t.replace(/^打把麻将\s*/, '').trim();
        say(tiles ? '好呀，用你给的牌型开局～' : '让我看看牌，准备开局～', 'aluona_qidai.png');
        axios.post('/ai/mahjong/play/start', null, { params: tiles ? { tiles } : {} }).then(r => {
            const d = r.data;
            if (d.code !== 1 || !d.data || d.data.ok === false) { quickSay((d.data && d.data.message) || d.message || '开局失败', 'aluona_kunhuo.png'); return; }
            quickSay(d.data.message, 'aluona_kaixin.png');
            // 手动开局直接开打；自动开局处于"待确认"（playing=false），确认后才启动轮询
            if (d.data.playing) startMahjongPolling();
        }).catch(() => quickSay('开局失败，请确认后端已重启且插件已开启', 'aluona_huaiyi.png'));
        return true;
    }
    if (/^(?:结束麻将|停止麻将|麻将结束|不打麻将)$/.test(t)) {
        axios.post('/ai/mahjong/play/stop').then(() => { stopMahjongPolling(); quickSay('麻将实操已停止', 'aluona_zhengchang.png'); }).catch(() => quickSay('停止失败', 'aluona_huaiyi.png'));
        return true;
    }
    if (/^麻将状态$/.test(t)) {
        axios.get('/ai/mahjong/play/status').then(r => {
            const s = (r.data && r.data.data) || {};
            quickSay(s.playing ? ('进行中：' + (s.lastAction || '等待摸牌') + '｜手牌：' + (s.hand || '')) : '当前未在对局中', 'aluona_zhengchang.png');
        }).catch(() => quickSay('查询失败', 'aluona_huaiyi.png'));
        return true;
    }
    if (/^(?:无误|没错|正确|对的|没问题|确认无误)$/.test(t)) {
        // 开局读牌确认：无误 → 开始自动打牌
        axios.post('/ai/mahjong/play/confirm-ok').then(r => {
            const d = r.data.data || {};
            if (d.ok === false) { quickSay(d.message || '确认失败', 'aluona_huaiyi.png'); return; }
            quickSay(d.message || '已开始', 'aluona_zhengchang.png');
            startMahjongPolling();
        }).catch(() => quickSay('确认失败', 'aluona_huaiyi.png'));
        return true;
    }
    const wrongMatch = t.match(/^(?:有误|不对|读错了|错了)\s*(.+)$/);
    if (wrongMatch) {
        // 开局读牌有误 → 入素材库/错题本，并以正确牌型开局
        const tiles = wrongMatch[1].trim();
        axios.post('/ai/mahjong/play/confirm-wrong', { tiles }).then(r => {
            const d = r.data.data || {};
            if (d.ok === false) { quickSay(d.message || '纠正失败', 'aluona_huaiyi.png'); return; }
            quickSay(d.message || '已纠正', 'aluona_zhengchang.png');
            startMahjongPolling();
        }).catch(() => quickSay('纠正失败', 'aluona_huaiyi.png'));
        return true;
    }
    if (/^(?:出牌|打出|弃牌)\s+(\S+)$/.test(t)) {
        // 用户手动打出某张后告知桌宠（免重新检测牌型）
        const tile = t.match(/^(?:出牌|打出|弃牌)\s+(\S+)$/)[1];
        axios.post('/ai/mahjong/play/discard-manual', { tile }).then(r => {
            const d = r.data.data || {};
            quickSay(d.message || '已同步', d.ok === false ? 'aluona_huaiyi.png' : 'aluona_zhengchang.png');
        }).catch(() => quickSay('同步失败', 'aluona_huaiyi.png'));
        return true;
    }
    if (/^摸牌\s+(\S+)$/.test(t)) {
        const tile = t.match(/^摸牌\s+(\S+)$/)[1];
        axios.post('/ai/mahjong/play/report-draw', { tile }).then(r => {
            const d = r.data.data || {};
            quickSay(d.message || '已记录', 'aluona_zhengchang.png');
        }).catch(() => quickSay('报牌失败', 'aluona_huaiyi.png'));
        return true;
    }
    if (/^误报\s+(\S+)$/.test(t)) {
        // 人工指出最近一次摸牌读取有误、实际牌=X → 存入 麻将错题截屏 供核对
        const tile = t.match(/^误报\s+(\S+)$/)[1];
        axios.post('/ai/mahjong/play/misreport', { tile }).then(r => {
            const d = r.data.data || {};
            quickSay(d.message || '已记录误报', d.ok === false ? 'aluona_huaiyi.png' : 'aluona_zhengchang.png');
        }).catch(() => quickSay('误报记录失败', 'aluona_huaiyi.png'));
        return true;
    }
    if (/^继续对局$/.test(t)) {
        // 局终判定有误（游戏仍在进行）→ 恢复，并把误判帧存入错题库校准
        axios.post('/ai/mahjong/play/continue-match').then(r => {
            const d = r.data.data || {};
            quickSay(d.message || '已继续对局', d.ok === false ? 'aluona_huaiyi.png' : 'aluona_zhengchang.png');
        }).catch(() => quickSay('继续对局失败', 'aluona_huaiyi.png'));
        return true;
    }
    if (/^下一局$/.test(t)) {
        // 局终/胡牌后确认继续（检测到新配牌自动恢复）
        axios.post('/ai/mahjong/play/next-round').then(r => {
            const d = r.data.data || {};
            quickSay(d.message || '已确认下一局', d.ok === false ? 'aluona_huaiyi.png' : 'aluona_zhengchang.png');
        }).catch(() => quickSay('请求失败', 'aluona_huaiyi.png'));
        return true;
    }
    if (/^先暂停$/.test(t)) {
        // 暂停麻将模式（数据保留）
        axios.post('/ai/mahjong/play/pause').then(r => {
            const d = r.data.data || {};
            stopMahjongPolling();
            quickSay(d.message || '已暂停', 'aluona_zhengchang.png');
        }).catch(() => quickSay('暂停失败', 'aluona_huaiyi.png'));
        return true;
    }
    // —— 合作模式：吃碰杠交用户决策（默认关）——
    if (/^(?:打开合作模式|开启合作模式|合作模式开|合作模式打开)$/.test(t)) {
        mahjongCoopOn = true;
        axios.post('/ai/mahjong/play/coop-toggle').then(r => {
            const d = r.data.data || {};
            quickSay(d.message || '合作模式已打开', 'aluona_zhengchang.png');
        }).catch(() => quickSay('切换失败', 'aluona_huaiyi.png'));
        return true;
    }
    if (/^(?:关闭合作模式|关合作模式|合作模式关|合作模式关闭)$/.test(t)) {
        mahjongCoopOn = false;
        axios.post('/ai/mahjong/play/coop-toggle').then(r => {
            const d = r.data.data || {};
            quickSay(d.message || '合作模式已关闭', 'aluona_zhengchang.png');
        }).catch(() => quickSay('切换失败', 'aluona_huaiyi.png'));
        return true;
    }
    if (mahjongCoopOn && /^(?:跳过|碰|杠|吃|碰了|杠了|吃了)\b/.test(t)) {
        // 合作指令（碰 X / 杠 X / 吃 ABC / 跳过）
        axios.post('/ai/mahjong/play/coop-action', { text: t }).then(r => {
            const d = r.data.data || {};
            quickSay(d.message || '已执行', d.ok === false ? 'aluona_huaiyi.png' : 'aluona_zhengchang.png');
        }).catch(() => quickSay('合作指令失败', 'aluona_huaiyi.png'));
        return true;
    }
    if (/^(?:碰回报|碰了回报)\s+(\S+)$/.test(t)) {
        axios.post('/ai/mahjong/play/pon-report', { tile: t.match(/^(?:碰回报|碰了回报)\s+(\S+)$/)[1] }).then(r => {
            const d = r.data.data || {};
            quickSay(d.message || '已记录碰', d.ok === false ? 'aluona_huaiyi.png' : 'aluona_zhengchang.png');
        }).catch(() => quickSay('碰回报失败', 'aluona_huaiyi.png'));
        return true;
    }
    if (/^(?:杠回报|杠了回报)\s+(\S+)$/.test(t)) {
        axios.post('/ai/mahjong/play/kan-report', { tile: t.match(/^(?:杠回报|杠了回报)\s+(\S+)$/)[1] }).then(r => {
            const d = r.data.data || {};
            quickSay(d.message || '已记录杠', d.ok === false ? 'aluona_huaiyi.png' : 'aluona_zhengchang.png');
        }).catch(() => quickSay('杠回报失败', 'aluona_huaiyi.png'));
        return true;
    }
    const chiM1 = t.match(/^吃\s+([^\s，,；;]+)\s+([^\s，,；;]+)\s+([^\s，,；;]+)$/);
    const chiM2 = t.match(/^([^\s，,；;]+)\s+([^\s，,；;]+)\s+吃\s+([^\s，,；;]+)$/);
    if (chiM1 || chiM2) {
        axios.post('/ai/mahjong/play/chi', { text: t }).then(r => {
            const d = r.data.data || {};
            quickSay(d.message || '已记录吃', 'aluona_zhengchang.png');
        }).catch(() => quickSay('吃回报失败', 'aluona_huaiyi.png'));
        return true;
    }

    // 陪玩点评（🎬）：进入/退出/换语境/手工点评一次
    const cm = t.match(/^(?:陪我玩|陪玩模式|陪我一起玩|专心看你玩)\s*(.*)$/);
    if (cm) { enterCommentary(cm[1] || ''); return true; }
    if (/^(?:别看了|陪玩结束|安静点|不用陪了|先别看了)$/.test(t)) { exitCommentary(); return true; }
    if (/^(?:点评一下|说说看|看看我在干嘛)$/.test(t)) { if (commentaryMode) commentaryTick(true); else quickSay('先说「陪我玩」我才能点评哦～', 'aluona_kunhuo.png'); return true; }
    const ctxMatch = t.match(/^(?:现在|我)?\s*(?:在|正在)?\s*(看B站|看b站|在看B站|打麻将|在打麻将|玩麻将|雀魂|玩蔚蓝档案|蔚蓝档案|抽卡|办公|写代码|看文档|随便看看|其它|其他)$/);
    if (ctxMatch) { if (commentaryMode) { setCommentaryContext(ctxMatch[1], true); } else { quickSay('我还没进入陪玩模式呢，先说「陪我玩」吧～', 'aluona_kunhuo.png'); } return true; }

    // —— 摸头有效区域（头部区域）调试框 ——
    if (/^(?:摸头区域|头部区域|摸头范围|头部区域调试)$/.test(t)) {
        toggleHeadZoneDebug();
        return true;
    }
    if (/^(?:摸头区域重置|头部区域重置)$/.test(t)) {
        resetHeadZone();
        return true;
    }

    // —— 眼部/眉眼表情试穿（自己新建的 .exp3 表情，live2d/expressions/ 下）——
    if (/^(?:收回表情|清除表情|表情复位)$/.test(t)) {
        if (useLive2D && typeof l2dBridge !== 'undefined' && l2dBridge.ready) {
            l2dBridge.setExpression('aluona_zhengchang.png');
            quickSay('表情已复位', 'aluona_zhengchang.png');
        }
        return true;
    }

    // 无歌名的播放指令 → 队列空则随机推荐歌单（需在 playMatch 之前，否则"播放音乐"会被当歌名拦截）
    if (/^(?:播放音乐|放音乐|来点音乐|放歌|听歌|播歌)$/.test(t)) {
        showMusicPanel();
        say('帮你随机推荐几首～', 'aluona_qidai.png');
        neteaseQueue.fillMore().then(() => {
            if (neteaseQueue.songs.length) { neteaseQueue.playIndex(0); }
            else { quickSay('推荐歌单没拉到，先手动点歌吧～（F12 控制台搜 [音乐] 能看到是哪一步空）', 'aluona_kunhuo.png'); }
        });
        return true;
    }

    // —— 播放收藏歌单（需在 ai_config 配置 netease_uid）——
    if (/^(?:播放收藏歌单|放收藏|听收藏|收藏歌单)$/.test(t)) {
        showMusicPanel();
        axios.get('/ai/music/favorite').then(r => {
            if (r.data.code !== 1) { quickSay(r.data.message || '获取收藏歌单失败', 'aluona_kunhuo.png'); return; }
            const songs = r.data.data || [];
            if (!songs.length) { quickSay('收藏歌单是空的哦～', 'aluona_kunhuo.png'); return; }
            window._songChoices = songs.slice(0, 8);
            songPage = 0;
            renderSongChoices();
            quickSay('从你的收藏里挑了一些，点一下就能听～', 'aluona_kaixin.png');
        }).catch(() => quickSay('获取收藏歌单失败', 'aluona_huaiyi.png'));
        return true;
    }

    // —— 相似歌曲推荐：检测"推荐…相近/相似/类似…歌"意图，提取歌名 → 搜索 → 相似歌 → 展示可选 ——
    if (/(?:推荐|来点|来几首|有没有|能否推荐).*(?:相近|相似|类似|差不多).*(?:歌|歌曲|音乐)/.test(t)) {
        let songName = null;
        const m1 = t.match(/《([^》]+)》/);
        const m2 = t.match(/那首\s*([^\s，。！？]{1,12})\s*我很喜欢/);
        const m3 = t.match(/([^\s，。！？]{1,12})\s*(?:我很喜欢|我喜欢|很好听|好听)/);
        if (m1) songName = m1[1];
        else if (m2) songName = m2[1];
        else if (m3) songName = m3[1];
        if (songName) {
            say('正在找「' + songName + '」风格相近的歌～', 'aluona_qidai.png');
            neteaseQueue.search(songName).then(songs => {
                if (!songs || !songs.length) { quickSay('没找到「' + songName + '」这首歌呢', 'aluona_kunhuo.png'); return; }
                return axios.get('/ai/music/similar', { params: { id: songs[0].id } }).then(r => {
                    const sims = r.data.data || [];
                    if (!sims.length) { quickSay('暂时没找到相似歌曲，换个说法试试？', 'aluona_kunhuo.png'); return; }
                    window._songChoices = sims.slice(0, 8);
                    songPage = 0;
                    renderSongChoices();
                    quickSay('这些和「' + songName + '」风格相近哦，点一下就能听～', 'aluona_kaixin.png');
                });
            }).catch(() => quickSay('搜索失败', 'aluona_huaiyi.png'));
            return true;
        }
    }

    // 播放指令 → 统一走网易云搜索
    const playMatch = t.match(/^(?:播放|放|来一首|我想听|听一首)\s*(.+)/);
    if (playMatch) {
        const kw = playMatch[1].replace(/[《》""'']/g, '').trim();
        if (!kw || /^(歌曲|音乐|一首歌|一首|歌|什么|啥)$/.test(kw)) return false;
        showMusicPanel();
        neteaseQueue.search(kw).then(songs => { if (songs.length) { neteaseQueue.add(songs[0], { user: true }); } else { quickSay('没有找到"' + kw + '"的歌曲', 'aluona_kunhuo.png'); } }).catch(() => { quickSay('搜索失败', 'aluona_huaiyi.png'); });
        return true;
    }
    if (/^(?:暂停|暂停音乐|停下|别放了|别播了)$/.test(t))   { musicPlayer.pause(); say('已暂停', 'aluona_zhengchang.png'); return true; }
    if (/^(?:继续|继续播放|接着放|继续播)$/.test(t))        { musicPlayer.resume(); say('继续播放~', 'aluona_kaixin.png'); return true; }
    if (/^(?:下一首|下一曲|切歌|换一首|切一首|跳过)$/.test(t)) {
        if (neteaseQueue.songs.length && neteaseQueue.idx >= 0) {
            neteaseQueue.next();
            const show = () => {
                const s = neteaseQueue.songs[neteaseQueue.idx];

        return true;
    }
    if (/^(?:上一首|上一曲|前一首)$/.test(t)) { musicPrev(); return true; }
    if (/^(?:随机播放|随机模式|随机)$/.test(t))     { musicPlayer.setMode('random'); say('已切换为随机播放', 'aluona_qidai.png'); return true; }
    if (/^(?:单曲循环|循环播放|循环|单曲)$/.test(t)) { musicPlayer.setMode('loop'); say('已切换为单曲循环', 'aluona_zhengjing.png'); return true; }
    if (/^(?:顺序播放|列表播放|顺序|列表)$/.test(t)) { musicPlayer.setMode('sequential'); say('已切换为顺序播放', 'aluona_zhengchang.png'); return true; }
    let vm = t.match(/^(?:音量|声音)\s*(\d+)\s*%?$/);
    if (vm) { const v = parseInt(vm[1]) / 100; musicPlayer.setVolume(v); say('音量已设为 ' + Math.round(v * 100) + '%', 'aluona_zhengchang.png'); return true; }
    if (/^(?:音量加大|声音大一点|大声点|大点声|响一点)$/.test(t))   { musicPlayer.setVolume(musicPlayer.volume + 0.1); say('音量 ' + Math.round(musicPlayer.volume * 100) + '%', 'aluona_zhengchang.png'); return true; }
    if (/^(?:音量减小|声音小一点|小声点|轻一点)$/.test(t))          { musicPlayer.setVolume(musicPlayer.volume - 0.1); say('音量 ' + Math.round(musicPlayer.volume * 100) + '%', 'aluona_zhengchang.png'); return true; }
    if (/^(?:静音|消音)$/.test(t))               { musicPlayer.setVolume(0); say('已静音', 'aluona_zhengchang.png'); return true; }
    if (/^(?:取消静音|解除静音|恢复声音)$/.test(t)) { musicPlayer.setVolume(0.5); say('已恢复音量', 'aluona_zhengchang.png'); return true; }
    if (/^(?:排队列表)$/.test(t)) { quickSay(showQueue(), 'aluona_zhengchang.png'); return true; }
    if (/^(?:下一个|next)$/.test(t)) {
        const n = popQueue();
        quickSay(n ? '轮到 ' + n + ' 了！' : '排队列表是空的哦～', n ? 'aluona_jidong.png' : 'aluona_kunhuo.png');
        return true;
    }

    // —— 直播模式开关 ——
    if (/^(?:开启直播|打开直播|开启直播模式|打开直播模式|直播模式开)$/.test(t)) {
        axios.get('/ai/config').then(r0 => {
            const cfg = r0.data.data;
            if (cfg) { cfg.live_mode = 1; axios.post('/ai/config', cfg).then(() => {
                isLiveMode = true;
                recordEvent('live', '老师开启了直播模式，你现在正在B站直播。');
                quickSay('直播模式已开启～弹幕互动准备好了！', 'aluona_jidong.png');
                axios.post('/talk', { user_text: '用户已开启直播模式，你现在在B站直播中，有粉丝发弹幕互动，请以VUP身份热情回应', user_operation: 'system', session_id: talkSessionId });
            });}
        });
        return true;
    }
    if (/^(?:关闭直播|关直播|关闭直播模式|关直播模式|直播模式关)$/.test(t)) {
        axios.get('/ai/config').then(r0 => {
            const cfg = r0.data.data;
            if (cfg) { cfg.live_mode = 0; axios.post('/ai/config', cfg).then(() => {
                isLiveMode = false;
                recordEvent('live', '老师关闭了直播模式，你现在不在直播了。');
                quickSay('直播模式已关闭～现在可以放松一下啦', 'aluona_zhengchang.png');
                axios.post('/talk', { user_text: '用户已关闭直播模式，你现在不在直播了，恢复日常闲聊模式', user_operation: 'system', session_id: talkSessionId });
            });}
        });
        return true;
    }
    // —— 闲置开关 ——
    if (/^(?:live2d|Live2D|L2D|模型模式)$/.test(t)) { useLive2D = true; l2dBridge.show(); quickSay('已切换为Live2D模式', 'aluona_jidong.png'); return true; }
    if (/^(?:图片模式|关闭live2d|关闭模型|png模式)$/.test(t)) { useLive2D = false; l2dBridge.hide(); quickSay('已切换为图片模式', 'aluona_zhengchang.png'); return true; }
    if (/^(?:选项文字化|文字模式)$/.test(t)) { choiceTextMode = true; quickSay('选项改为文字显示，不弹按钮', 'aluona_zhengjing.png'); return true; }
    if (/^(?:选项按钮化|按钮模式)$/.test(t)) { choiceTextMode = false; quickSay('恢复为选项按钮', 'aluona_zhengchang.png'); return true; }
    if (/^(?:开启闲置|打开闲置|闲置开)$/.test(t)) { idleEnabled = true; quickSay('闲置提醒已开启', 'aluona_zhengchang.png'); return true; }
    if (/^(?:关闭闲置|关闲置|闲置关)$/.test(t)) { idleEnabled = false; quickSay('闲置提醒已关闭', 'aluona_zhengchang.png'); return true; }
    // —— 语音开关 ——
    if (/^(?:开启语音|打开语音|语音开|开语音)$/.test(t)) {
        ttsEnabled = true; quickSay('语音播报已开启～', 'aluona_kaixin.png');
        axios.post('/talk', { user_text: '用户已开启你的语音功能，你现在可以说话了', user_operation: 'system', session_id: talkSessionId });
        return true;
    }
    if (/^(?:关闭语音|关语音|语音关|静音模式)$/.test(t)) {
        ttsEnabled = false; quickSay('语音播报已关闭，阿罗娜暂时安静啦', 'aluona_kangju.png');
        axios.post('/talk', { user_text: '用户暂时关闭了你的语音功能，你现在不能说话，请用文字继续交流', user_operation: 'system', session_id: talkSessionId });
        return true;
    }

    // —— 序号选歌 ——
    const numMatch = t.match(/^(?:选|选歌)?\s*(\d+)$/);
    if (numMatch && window._songChoices && window._songChoices.length) {
        const n = parseInt(numMatch[1]) - 1;
        if (n >= 0 && n < Math.min(window._songChoices.length, 8)) {
            const s = window._songChoices[n];
            showMusicPanel();
            neteaseQueue.add(s, { user: true });
            return true;
        }
        quickSay('序号超出范围，输入 1-' + Math.min(window._songChoices.length, 8), 'aluona_kunhuo.png');
        return true;
    }

    // —— 网易云点歌 ——
    const prefixes = ['网易云', '点歌', '点一首'];
    let wyKw = null;
    for (const p of prefixes) { if (t.startsWith(p)) { wyKw = t.substring(p.length).trim(); break; } }
    console.log('[WY] t=' + t + ' wyKw=' + wyKw);
    if (wyKw !== null && wyKw) {
        showMusicPanel();          // 「网易云+歌名」也算播放类指令 → 面板呼出/重新滑入
        say('正在搜索：' + wyKw + '...', 'aluona_qidai.png');
        neteaseQueue.search(wyKw).then(songs => {
            if (!songs.length) { quickSay('没有找到"' + wyKw + '"的歌曲', 'aluona_kunhuo.png'); return; }
            window._songChoices = songs;
            songPage = 0;
            renderSongChoices();
        }).catch(() => { quickSay('搜索失败', 'aluona_huaiyi.png'); });
        return true;
    }

    if (/^(?:收藏|喜欢这首歌|收藏这首歌)$/.test(t)) {
        if (neteaseQueue.idx < 0 || !neteaseQueue.songs[neteaseQueue.idx]) { quickSay('当前没有在播网易云歌曲哦', 'aluona_kunhuo.png'); return true; }
        const song = neteaseQueue.songs[neteaseQueue.idx];
        axios.get('/ai/netease/like?id=' + song.id).then(r => {
            if (r.data.code === 1) quickSay('已收藏：' + song.name + ' ❤️', 'aluona_xihuan.png');
            else quickSay('收藏失败：' + (r.data.message || '未知错误'), 'aluona_kunhuo.png');
        }).catch(() => quickSay('收藏失败', 'aluona_huaiyi.png'));
        return true;
    }

    if (/^(?:歌曲队列|查看队列|队列|播放队列)$/.test(t)) {
        const q = neteaseQueue.songs;
        const pending = q.filter((_, i) => i > neteaseQueue.idx);
        if (!pending.length && neteaseQueue.idx < 0) { quickSay('队列是空的哦，快点点歌吧～', 'aluona_kunhuo.png'); return true; }
        // ★ = 老师点的歌（优先播放）；无标记 = 阿罗娜自动推荐的队列
        const label = (s) => (s.source === 'user' ? '★' : '') + s.name + ' - ' + s.artist;
        const lines = [];
        for (let i = 0; i < pending.length; i += 2) {
            const a = (i + 1) + '. ' + label(pending[i]);
            const b = pending[i + 1] ? '    ' + (i + 2) + '. ' + label(pending[i + 1]) : '';
            lines.push(a + b);
        }
        const now = neteaseQueue.idx >= 0 ? q[neteaseQueue.idx] : null;
        const userCount = pending.filter(s => s.source === 'user').length;
        quickSay((now ? label(now) + '\n' : '') + '待播（' + pending.length + '首，★=老师点的 ' + userCount + ' 首）：\n' + lines.join('\n'), 'aluona_zhengchang.png');
        return true;
    }

    if (/^(?:记住|记住这个|记一下|记忆)$/.test(t)) {
        quickSay('好的，我记下来了～', 'aluona_zhengjing.png');
        lastAiTime = Date.now();
        axios.post('/talk', { user_text: '(用户让你记住最近的对话内容，请在心里默默记下)', user_operation: 'remember', session_id: talkSessionId });
        axios.post('/ai/consolidate', { character: null, session_id: talkSessionId }).then(r => {
            if (r.data.code === 1) quickSay('记忆已更新～', 'aluona_kaixin.png');
        }).catch(() => {});
        return true;
    }

    // —— 嘴型测试（临时） ——
    // —— 音效位置测试 ——
    const seMap = { '音符':'yinfu.webm','害羞':'haixiu.webm','惊讶':'jingya.webm','流汗':'liuhan.webm','生气':'shengqi.webm','说话':'shuohua.webm','问号':'wenhao.webm','无语':'wuyu.webm','无语2':'wuyu2.webm','喜欢':'xihuan.webm','疑问':'yiwen.webm' };
    if (seMap[t]) { playEffects(seMap[t], ''); return true; }

    // —— Live2D 动作测试 ——
    const actMap = { '蹦跳':'bounce','摇晃':'swing','转圈':'spin','转2圈':'spin2','转3圈':'spin3','歪头':'tilt','下沉':'drop','逃跑':'escape' };
    if (actMap[t]) { if (useLive2D) l2dBridge.playAction(actMap[t]); else quickSay('请先切到Live2D模式', 'aluona_kunhuo.png'); return true; }

    // —— 睡觉动作测试 ——
    if (t === '睡觉' || t === '睡会' || t === '睡一觉' || t === '睡觉觉') {
        if (useLive2D) { l2dBridge.playMotion('Sleep', 0); isSleeping = true; aiIdleInterval = 600; }
        quickSay('那我先睡一会儿～', 'aluona_kunhuo.png');
        return true;
    }

    // —— Live2D 表情测试 ——
    const expNames = ['哭哭','嘴变形','嘴变形2','圈圈','墨镜','抓抓','指纹锁','挤眼','星星眼','流口水','牛奶','猫猫','生气','眯眼','脸红','螺旋','阴脸',
                      '疑惑','俏皮眨眼','惊讶'];   // 后三个是自制表情（live2d/expressions/，只用实测有效的眼部参数）
    const expMatch = t.match(/^表情\s*(.+)$/);
    if (expMatch && expNames.includes(expMatch[1])) {
        if (useLive2D) { l2dBridge.testExpression(expMatch[1]); quickSay('已切换表情: ' + expMatch[1], 'aluona_zhengchang.png'); }
        else { quickSay('请先切到Live2D模式', 'aluona_kunhuo.png'); }
        return true;
    }

    // —— 眼神动作（自制「眼球动作」：转一圈 / 慌张乱瞟 / 思考上瞟 / 斜瞟 / 俏皮眨眼 / 疑惑） ——
    const eyeActNames = { '转一圈':'roll', '转圈':'roll', '慌张':'dart', '紧张':'dart', '思考':'think', '考虑':'think',
                          '斜瞟':'side', '心虚':'side', '瞟':'side', '俏皮眨眼':'wink', '眨眼':'wink', '疑惑':'confused', '困惑':'confused' };
    const eyeActLabel = { roll: '（眼珠转了一圈）', dart: '（眼神往下左右瞟，有点慌）', think: '（往上看，认真想了想）',
                          side: '（偷偷瞟了一眼）', wink: '（俏皮地眨了下眼）', confused: '（歪着头，满脸疑惑）' };
    function doEyeAct(name) {
        if (!useLive2D || typeof l2dBridge === 'undefined' || !l2dBridge.ready || !l2dBridge.playEyeAction) {
            quickSay('要先切到 Live2D 模型模式哦', 'aluona_kunhuo.png');
            return true;
        }
        if (!l2dBridge.playEyeAction(name)) { quickSay('这个眼神动作不可用', 'aluona_kunhuo.png'); return true; }
        quickSay(eyeActLabel[name] || '（换了换眼神）', 'aluona_zhengchang.png');
        return true;
    }
    // 明确写「眼珠/眼睛转一圈」才走眼神动作（「转圈」是整体旋转动作，不抢）
    if (/^(?:眼珠转一圈|眼睛转一圈|眼珠转个圈)$/.test(t)) return doEyeAct('roll');
    const eyeActMatch = t.match(/^(?:眼神|眼部动作|眼珠动作)\s*(\S+)$/);
    if (eyeActMatch) {
        const name = eyeActNames[eyeActMatch[1]];
        if (!name) { quickSay('可用眼神动作：转一圈 / 慌张 / 思考 / 斜瞟', 'aluona_kunhuo.png'); return true; }
        return doEyeAct(name);
    }
    // 眼球参数诊断：逐个扫可能管眼球的参数，屏上显示参数名，看哪个真的让眼球动
    if (/^(?:眼球诊断|眼部诊断|眼动诊断)$/.test(t)) {
        if (useLive2D && typeof l2dBridge !== 'undefined' && l2dBridge.ready && l2dBridge.eyeDiag) {
            l2dBridge.eyeDiag();
            quickSay('眼球诊断中：屏上会显示当前参数名，留意哪个参数真的让眼球动了（约 30 秒）', 'aluona_zhengjing.png');
        } else {
            quickSay('要先切到 Live2D 模型模式哦', 'aluona_kunhuo.png');
        }
        return true;
    }
    // 参数巡览：把表情类参数逐个拉满再松开，屏上显示「参数名 + 中文名」，写自制表情时对照用
    if (/^(?:参数巡览|参数巡游|参数一览)$/.test(t)) {
        if (useLive2D && typeof l2dBridge !== 'undefined' && l2dBridge.ready && l2dBridge.paramTour) {
            l2dBridge.paramTour();
            quickSay('参数巡览中：屏上依次显示「参数名 + 中文名」，看它把模型变成什么样（约 35 秒）', 'aluona_zhengjing.png');
        } else {
            quickSay('要先切到 Live2D 模型模式哦', 'aluona_kunhuo.png');
        }
        return true;
    }
    // 切换眼部驱动方式（ParamEyeBallX/Y ↔ Param58/59 鼠标追踪）
    const eyeDrvMatch = t.match(/^(?:眼球驱动|眼动驱动)\s*(ball|mouse|眼球|追踪)$/);
    if (eyeDrvMatch) {
        if (useLive2D && l2dBridge.ready && l2dBridge.setEyeDriver) {
            const mode = (eyeDrvMatch[1] === 'mouse' || eyeDrvMatch[1] === '追踪') ? 'mouse' : 'ball';
            l2dBridge.setEyeDriver(mode);
            quickSay('眼部驱动已切换为 ' + (mode === 'mouse' ? 'Param58/59（鼠标追踪，±30）' : 'ParamEyeBallX/Y（默认）'), 'aluona_zhengchang.png');
        }
        return true;
    }

    // —— Live2D 组合表情测试（如：组合 脸红 激动闭眼） ——
    const comboMatch = t.match(/^组合\s*(.+)$/);
    if (comboMatch) {
        const names = comboMatch[1].split(/[\s+＋]+/).filter(s => s.trim());
        if (useLive2D) {
            if (names.length >= 2) {
                l2dBridge.comboTest(names);
                quickSay('组合表情: ' + names.join(' + '), 'aluona_zhengchang.png');
            } else {
                quickSay('至少输入两个表情名，如：组合 脸红 激动闭眼', 'aluona_kunhuo.png');
            }
        } else { quickSay('请先切到Live2D模式', 'aluona_kunhuo.png'); }
        return true;
    }

    if (t === '张嘴') { if (useLive2D) l2dBridge.mouthTest('嘴变形2'); return true; }
    if (t === '闭嘴') { if (useLive2D) l2dBridge.mouthTest('嘴变形'); return true; }
    if (t === '参数') { if (useLive2D) { l2dBridge.listParams(); quickSay('参数已输出到Console', 'aluona_zhengjing.png'); } else { quickSay('请先切换到Live2D模式', 'aluona_kunhuo.png'); } return true; }
    // pivot测试: 中心点 0.5 0.5
    const pivMatch = t.match(/^中心点\s*([\d.]+)\s*([\d.]+)$/);
    if (pivMatch) { if (useLive2D) l2dBridge.setPivot(parseFloat(pivMatch[1]), parseFloat(pivMatch[2])); return true; }
    if (/^测(\d+)$/.test(t)) { if (useLive2D) { var v = parseInt(t.match(/^测(\d+)$/)[1]); l2dBridge.setParam('Param'+v, v>10 ? 30 : 1); quickSay('测Param'+v, 'aluona_zhengchang.png'); } return true; }
    if (t === '口大') { if (useLive2D) l2dBridge.setParam('Param10', 50); return true; }
    if (t === '口小') { if (useLive2D) l2dBridge.setParam('Param10', -50); return true; }

    if (/^(?:提醒|看弹幕|弹幕提醒)$/.test(t)) {
        const msgs = ['老师！快看弹幕！粉丝们在跟你说话呢～','诶诶——弹幕区有人叫你哦老师！','老师！弹幕！现在！立刻！马上看！','弹幕弹幕弹幕！老师你的粉丝在呼唤你～'];
        quickSay(msgs[Math.floor(Math.random()*msgs.length)], 'aluona_jidong.png');
        return true;
    }
    if (/^(?:曲库|有什么歌|看看曲库|歌曲列表|来点推荐|推荐几首|有哪些歌)$/.test(t)) {
        axios.get('/ai/music/recommend').then(r => {
            const songs = r.data.data || [];
            if (!songs.length) { quickSay('推荐加载失败，手动点歌吧～', 'aluona_kunhuo.png'); return; }
            window._songChoices = songs;
            songPage = 0;
            renderSongChoices();
        }).catch(() => { quickSay('加载失败', 'aluona_huaiyi.png'); });
        return true;
    }
    if (/^(?:当前播放|什么歌|什么音乐|正在播放|现在放的什么|这是.?什么歌)$/.test(t)) {
        if (neteaseQueue.idx >= 0 && neteaseQueue.songs[neteaseQueue.idx]) {
            const s = neteaseQueue.songs[neteaseQueue.idx];
            say('正在播放：' + s.name + ' - ' + s.artist + '（' + (musicPlayer.mode === 'loop' ? '单曲循环' : musicPlayer.mode === 'random' ? '随机播放' : '顺序播放') + '）', 'aluona_kaixin.png');
        } else { say('当前没有在播放音乐哦', 'aluona_kunhuo.png'); }
        return true;
    }
    if (/^(?:关掉|关闭音乐|停止播放|别放了|关音乐)$/.test(t)) {
        musicPlayer.pause(); if (musicPlayer.audio) { musicPlayer.audio.src = ''; }
        say('音乐已关闭', 'aluona_zhengchang.png'); return true;
    }
    return false;
}
function quickSay(msg, motion) {
    if (typewriterTimer) { clearTimeout(typewriterTimer); typewriterTimer = null; }
    const dt = document.getElementById('dialogText');
    if (dt) { dt.textContent = msg; }
    else { pendingQuickSay = { msg: msg, motion: motion }; return; }
    if (motion) { document.getElementById('petImg').src = 'aluona/' + motion; if (useLive2D) l2dBridge.setExpression(motion); }
}

// 输入模式
function enterInputMode() {
    if (document.getElementById('talkInput')) return;
    document.getElementById('choicesWrapper').style.display = 'none';
    const dialogText = document.getElementById('dialogText');
    if (!dialogText) return;
    const petImg = document.getElementById('petImg');
    savedDialogState = {
        text: dialogText.textContent,
        motion: petImg.src.replace(/.*\//, ''),
        reactiveMapSnap: Object.assign({}, reactiveMap),

function pcSpeakIntro(gameId, wordLen) {

// 开局：difficulty 0 随机 / 1 简单 / 2 中等 / 3 困难
function pcStart(difficulty) {

// 两段式说话：先念「猜是什么」（say），**等这句真的播完**、再留 PC_GAP_MS 过渡，才念「猜对/没猜对」（verdict）。
// ★ 两个坑（都踩过）：
//   ① 不能"按字数估算"这段时间 —— 估短了会在语音还没播完时就把 verdict 文本顶到对话框上，还会打断猜测语音；
//      所以改成轮询 ttsAudio 的真实播放状态（播过 && 现在停了 = 这句说完了）。
//   ② 老师可以在上一轮还没说完时就又提交一张画 → 用 token 作废旧的那一条链，避免迟到的庆祝语冒出来。
const PC_GAP_MS = 3000;                 // 猜测说完 → 3 秒过渡 → 猜对/没猜对
let pcChainToken = 0;

function pcWaitSpeechDone(text, cb) {
    const len = (text || '').length;
    // TTS 开着：等"语音开始播放"最多 15 秒（冷启动最长约 6 秒）；TTS 关/流失败：按阅读时间兜底
    const idleCap = ttsEnabled ? 15000 : Math.min(9000, 900 + len * 170);
    let started = false, waited = 0;
    const tick = () => {
        let playing = false;
        try { playing = !!(ttsAudio && !ttsAudio.paused && !ttsAudio.ended && ttsAudio.currentTime > 0); } catch (e) { playing = false; }
        if (playing) started = true;
        if (started && !playing) { cb(); return; }          // 开始播过、现在停了 → 说完了
        waited += 250;
        if (!started && waited >= idleCap) { cb(); return; } // 始终没等到语音 → 别死等
        if (waited > 25000) { cb(); return; }                // 硬上限
        setTimeout(tick, 250);
    };
    setTimeout(tick, 250);
}

// 你画我猜：按「模型规则库」的情境应用 Live2D 表情
// 后端每段话都会给 {situation, expression(部件JSON), action(动作), soundEffect, motion(png)}，
// Live2D 的表情由 expression 决定（和正常对话的句级 applySituation 同一套玩法），
// action/soundEffect 则随 playSpeech(text, motion, soundEffect, action) 一起交给 playEffects/playAction。
function pcApplyFx(fx) {
    if (!fx || !fx.expression) return;
    if (!useLive2D || typeof l2dBridge === 'undefined' || !l2dBridge.ready) return;
    let expr = {};
    try {
        expr = (typeof fx.expression === 'string') ? JSON.parse(fx.expression) : fx.expression;
    } catch (e) { return; }
    if (!expr || !Object.keys(expr).length) return;
    const apply = () => { try { l2dBridge.applySituation(expr, l2dPartsByRegion); } catch (e) {} };
    if (!l2dPartsByRegion) loadL2dParts().then(apply); else apply();
}
function pcSpeakChain(seg1, seg2, after) {
    const token = ++pcChainToken;
    let fired = false;
    let gapTimer = null;
    const fx = (s, dflt) => ({
        text: s && s.text ? s.text : '',
        motion: (s && s.motion) || dflt,
        sound: (s && s.sound) || null,
        effect: (s && s.action) || null,       // action → playSpeech 的 specialEffect（Live2D 里就是 playAction 的动作名）
        expression: (s && s.expression) || '',
        situation: (s && s.situation) || ''
    });
    const second = () => {
        if (fired || token !== pcChainToken) return;         // 已被新一轮取代 → 丢弃
        fired = true;
        const v = fx(seg2, 'aluona_zhengchang.png');
        const run = () => {
            if (token !== pcChainToken) return;
            let shown = false;
            const thenChoices = () => { if (shown || token !== pcChainToken) return; shown = true; if (after) after(); };
            if (v.text) {
                // 收尾那句也**说完**再弹「继续画 / 公布答案」「再来一局」按键
                playSpeech(v.text, v.motion, v.sound, v.effect, thenChoices);
                pcApplyFx(v);                       // 情境表情（模型规则库）
                pcWaitSpeechDone(v.text, thenChoices);
            } else {
                thenChoices();
            }
        };
        const wait = PC_GAP_MS - (gapTimer ? (Date.now() - gapTimer) : 0);   // 语音播完的那一刻起算过渡
        setTimeout(run, Math.max(0, wait));
    };
    const s1 = fx(seg1, 'aluona_zhengchang.png');
    if (s1.text) {
        playSpeech(s1.text, s1.motion, s1.sound, s1.effect, () => { gapTimer = Date.now(); second(); });  // 播完回调（有语音时最准）
        pcApplyFx(s1);                                                                                    // 情境表情（模型规则库）
        pcWaitSpeechDone(s1.text, () => { if (!gapTimer) gapTimer = Date.now(); second(); });             // 没语音/流失败时的兜底
    } else {
        gapTimer = Date.now();
        second();
    }
}
// 猜错后：是否继续 —— 按要求**不写进对话框文字**，改用对话选项按键
function pcAskContinue() {
    currentChoices = [
        { choiceText: '继续画（直接改了再点画好了）', choiceAction: 'pictionary_continue' },
        { choiceText: '公布答案', choiceAction: 'pictionary_giveup' }

    renderChoices();
}
// ★ 一局结束后**不再弹任何选项**（老师定的：结束不询问）。
//   要再来一局就在画板窗口点「下一局」（「画好了」左边，平常隐藏），
//   或者点画板任意位置弹出「还没有进行中的对局」选难度开新局。
// 画板窗口转发过来的事件（画板 → 主进程 → 这里）
function pcOnBoardEvent(p) {
    if (!p || !p.type) return;
    if (p.type === 'started') {          // 老师直接在画板里开的局（画板已经开着，开场白照旧单独取）
        pcGame = { active: true, gameId: p.gameId, wordLen: p.wordLen, difficulty: p.difficulty, round: 0 };
        pcEventStart(p.difficulty);      // 事件簿：记"玩起了你画我猜"（不含答案）
        pcSpeakIntro(p.gameId, p.wordLen);
        return;
    }
    if (p.type === 'closed') {
        if (!pcGame.active) return;
        recordEvent('game', '你和老师的「你画我猜」中途结束了（老师把画板关掉了，这一局没玩完）。');
        pcGame = { active: false, gameId: 0, wordLen: 0, difficulty: pcGame.difficulty, round: 0 };
        currentChoices = null; renderChoices();
        playSpeech('诶？画板被关掉了…那这一局就先不猜啦，想玩的时候再叫阿罗娜哦～', 'aluona_kunhuo.png');
        return;
    }
    if (p.type === 'failed') {           // 模型没看清：只说一句，不弹按键、不算轮次
        const f1 = { text: p.say || '唔…阿罗娜看不清楚，老师再画一次？', motion: p.sayMotion || 'aluona_kunhuo.png', sound: p.saySound, effect: p.sayAction, expression: p.sayExpression };
        playSpeech(f1.text, f1.motion, f1.sound, f1.effect);
        pcApplyFx(f1);
        return;
    }
    if (p.type === 'wrong') {
        pcGame.active = true;
        pcGame.round = p.round || pcGame.round;
        // 第一段：这一轮的猜测；过渡 3s 后第二段："猜错了"（含对画的小吐槽）
        // 情境/表情/动作/音效都来自后端：模型规则库（画猜猜测/画猜猜错）→ 情景规则库 → 场景表
        pcSpeakChain(
            { text: p.say || ('阿罗娜猜是「' + p.guess + '」…不对吗？'), motion: p.sayMotion, sound: p.saySound,
              action: p.sayAction, expression: p.sayExpression, situation: p.saySituation },
            { text: p.verdict || '唔…猜错了吗？那老师再改两笔吧。', motion: p.verdictMotion, sound: p.verdictSound,
              action: p.verdictAction, expression: p.verdictExpression, situation: p.verdictSituation },
            pcAskContinue);
        return;
    }
    if (p.type === 'win') {
        pcGame.active = false;
        currentChoices = null; renderChoices();     // 结束不弹选项：把对局中残留的「继续画/公布答案」收掉
        pcEventEnd(true, p.round || pcGame.round, p.difficulty != null ? p.difficulty : pcGame.difficulty);
        // 猜对也分两段：先"是X吧？"，过渡之后再"猜对啦！"（庆祝带表情+音效+动作）；结束不弹选项
        pcSpeakChain(
            { text: p.say || ('是「' + (p.guess || p.answer) + '」吧？'), motion: p.sayMotion, sound: p.saySound,
              action: p.sayAction, expression: p.sayExpression, situation: p.saySituation },
            { text: p.verdict || ('猜对啦！是「' + p.answer + '」对不对～'), motion: p.verdictMotion, sound: p.verdictSound,
              action: p.verdictAction, expression: p.verdictExpression, situation: p.verdictSituation },
            null);
        return;
    }
    if (p.type === 'giveup') {
        pcGame.active = false;
        currentChoices = null; renderChoices();     // 同上：结束就收起选项，不再询问
        pcEventEnd(false, p.round || pcGame.round, p.difficulty != null ? p.difficulty : pcGame.difficulty);
        const gv = { text: p.say || ('原来是「' + p.answer + '」呀！'), motion: p.sayMotion || 'aluona_kaixin.png',
                     sound: p.saySound, effect: p.sayAction, expression: p.sayExpression };
        playSpeech(gv.text, gv.motion, gv.sound, gv.effect);
        pcApplyFx(gv);
        return;
    }
}
// 你画我猜的选项按键（在 doChoice 里按 pictionary_ 前缀分派过来）
function pcHandleChoice(action) {
    if (action === 'pictionary_continue') {

// 本地指令：开局 / 指定难度 / 结束（返回 true 表示这条文本已被吃掉）
// ★ pcIsCommandText() 单独抽出来给输入框用：桌宠刚发过"等你回话"的应答态（reactiveMap['talk']）时，
//   这些词必须仍按指令走，否则会被当成对话内容发给 AI，游戏开不起来。
function pcIsCommandText(text) {
    return /^(?:你画我猜|画猜|画画猜|开始画猜|画我猜|我想画你猜|画猜简单|简单的画猜|画猜中等|中等的画猜|画猜困难|困难的画猜|结束画猜|不画了)$/.test(text || '');
}
function pcHandleCommand(text) {
    if (/^(?:你画我猜|画猜|画画猜|开始画猜|画我猜|我想画你猜)$/.test(text)) { pcStart(0); return true; }
    if (/^(?:画猜简单|简单的画猜)$/.test(text)) { pcStart(1); return true; }
    if (/^(?:画猜中等|中等的画猜)$/.test(text)) { pcStart(2); return true; }
    if (/^(?:画猜困难|困难的画猜)$/.test(text)) { pcStart(3); return true; }
    if (pcGame.active && /^(?:结束画猜|不画了|结束游戏|退出游戏|不玩了)$/.test(text)) {
        pcGame.active = false;
        pcRefreshBoard('giveup');   // 等同点「公布答案」：答案由游戏模块给，桌宠据此做反应
        return true;
    }
    return false;
}

            '4.当你已有较大把握、或已问满' + perRound + '个问题，必须停止提问、直接输出"我猜：物品名"。' +
            '5.猜错的物品不要再猜。6.回复必须极简短，一次只问一个问题，不要解释。' +
            '7.重要限制：答案一定是现实中或常识中的普通物品，绝对不要猜与你自身背景设定相关的专有名词（如基沃托斯、什亭之匣、夏莱、阿罗娜、光环等游戏世界观事物），也不要问"是不是你认识/你世界观里的东西"这类问题。现在请提问。';
    } else {
        // AI 出题，用户猜：AI 只回答 是/不是/不确定，不允许"不是但类似"
        const aiAnswerRule = '"是"=答案属于该类别；"不是"=答案不属于该类别；"不确定"=无法判断类别（答案与所问方向没有明确关系时用，且该问题作废、不计入次数）。绝对禁止使用"不是但类似"或"不确定不知道"之类的说法。';
        const itemDesc = diff === '困难'
            ? '比较具体的东西（如龙井茶、日记本这类具体品类）'
            : '比较宽泛的东西（如茶叶、书本这类大类）';
        const judgeDesc = diff === '困难' ? '（用户必须猜出具体名称才算对，猜大类不算）' : '';
        prompt = '【网络天才游戏】请你想一个' + itemDesc + '，心里记好但绝对不要说出来。回答词义（你回答时必须遵守）：' + aiAnswerRule +
            '规则：用户提问，你只用"是/不是/不确定"三选一简短回答，绝不使用其他词；用户猜答案时你判断对错' + judgeDesc + '。回复必须极简短。现在告诉用户你已想好，等他提问。';
    }
    sendGame(prompt, game.sessionId);
    lastAiTime = Date.now();
}

function sendGame(prompt, sessionId, callback, userText) {
    const dt = document.getElementById('dialogText');
    if (dt) dt.textContent = '...';
    clearCurrentActivity();
    // user_text 只存当前短内容，full_prompt 存完整上下文（含已问/已猜历史）给 AI 用
    axios.post('/talk', { user_text: (userText || prompt), full_prompt: prompt, user_operation: 'game', session_id: sessionId, game_model: gameModel }).then(r => {
        if (typewriterTimer) { clearTimeout(typewriterTimer); typewriterTimer = null; }
        if (r.data.code === 1) {
            showResult(r.data);
            const resp = r.data.message || '';
            if (game.active) recordAiTurn(resp);
            if (callback) callback(resp);
        }
    }).catch(() => { quickSay('游戏响应失败', 'aluona_kunhuo.png'); });
}

// 清理物品名：去掉标点、装饰符号、"是/吗"等包装词
function cleanItem(s) {
    return (s || '')
        .replace(/[～~\s：:？?！!。，,、（）()【】\[\]""''…·]/g, '')
        .replace(/^(我猜|猜是|可能是|是不是|是)/, '')
        .replace(/(吗|呢|呀|啊|嘛|吧|么|之类|这种|什么)$/, '')
        .trim();
}

// 清理"问题"文本用于去重：只去掉开头（动作）括号和结尾标点，保留"是/是不是/吗"等提问词，避免误删导致防重失效
function cleanQuestion(s) {
    return (s || '')
        .replace(/^[（(][^）)]*[）)]\s*/, '')
        .replace(/[～~？?！!。，,、；;…·]+$/, '')
        .trim();
}

// 记录 AI 本轮是提问还是猜答案（前端维护，防止重复）
function recordAiTurn(resp) {
    if (!resp) return;
    const clean = resp.trim();
    if (clean.indexOf('我猜') >= 0) {
        game.waitingJudge = true;
        const g = cleanItem(clean.substring(clean.indexOf('我猜') + 2));
        if (g && game.guessed.indexOf(g) < 0) game.guessed.push(g);
    } else {
        const q = cleanQuestion(clean);
        if (q && game.asked.indexOf(q) < 0) game.asked.push(q);
    }
    // AI 提问/猜答案后，弹出快捷选项
    if (game.mode === 'ai_guess' && gameQuickReply) showGameQuickReply();
}

// 弹出游戏快捷选项（AI 提问→是/可能是/可能不是/不是；猜答案→对/错）
function showGameQuickReply() {
    if (game.waitingContinue) {
        currentChoices = [
            { choiceText: '是（继续猜）', choiceAction: 'game_reply_继续' },
            { choiceText: '不是（公布答案）', choiceAction: 'game_reply_公布答案' }
        ];
    } else if (game.waitingJudge) {
        currentChoices = [
            { choiceText: '对', choiceAction: 'game_reply_对' },
            { choiceText: '错', choiceAction: 'game_reply_错' }
        ];
    } else {
        currentChoices = [
            { choiceText: '是', choiceAction: 'game_reply_是' },
            { choiceText: '不是', choiceAction: 'game_reply_不是' },
            { choiceText: '不是但类似', choiceAction: 'game_reply_不是但类似' },
            { choiceText: '不确定不知道', choiceAction: 'game_reply_不确定不知道' }
        ];
    }
    document.getElementById('dialogBox').classList.add('dialog-clickable');
    renderChoices();
}

// 拼接"已问/已猜/已提醒"上下文，附加到 prompt
function gameContextSuffix() {
    let s = '';
    if (game.mode === 'ai_guess' && game.questionsPerRound > 0) {
        s += '（本轮已问 ' + game.questionCount + '/' + game.questionsPerRound + ' 个问题；若已问满 ' + game.questionsPerRound + ' 个，必须停止提问、直接猜答案）';
    }
    if (game.asked && game.asked.length) {
        const askedArr = game.asked.slice(-15).map(function(q, i) { return (i + 1) + '.' + q; });
        s += '你之前问过（绝对禁止重复提问，逐个排除）：' + askedArr.join('；') + '。';
    }
    if (game.guessed && game.guessed.length) s += '你已经猜过（不要再猜）：' + game.guessed.slice(-15).join('、') + '。';
    if (game.hints && game.hints.length) {
        const hs = game.hints.map(function(h) { return (h.type === '是' ? '（是，答案具备）' : '（不是，答案不具备）') + h.content; }).join('；');
        s += '用户提醒（务必遵守）：' + hs + '。';
    }
    return s;
}

function handleGameInput(text) {
    if (!game.active) return false;
    if (/^(暂停游戏|结束游戏|退出游戏|不玩了)$/.test(text)) { endGame('pause'); return true; }

    // 提醒命令：如「提醒：是，xxx」或「提醒：不是，xxx」，结构化存入当前游戏提示
    if (/^提醒[:：]?/.test(text)) {
        const raw = text.replace(/^提醒[:：]?\s*/, '').trim();
        const m = raw.match(/^(是|不是)\s*[,，]?\s*(.*)$/);
        if (m && m[2]) {
            const type = m[1];
            const content = m[2].trim();
            game.hints.push({ type: type, content: content });
            sendGame('【网络天才游戏】用户提醒：' + (type === '是' ? '是（答案具备该属性）' : '不是（答案不具备该属性）') + '：' + content + '。' + gameContextSuffix(), game.sessionId, null, '提醒：' + type + '，' + content);
        } else if (raw) {
            // 兼容旧写法：无"是/不是"前缀，按肯定提示处理
            game.hints.push({ type: '是', content: raw });
            sendGame('【网络天才游戏】用户提示：' + raw + '。' + gameContextSuffix(), game.sessionId, null, '提示：' + raw);
        }
        return true;
    }

    if (game.mode === 'ai_guess') {
        // 猜错后：继续 / 公布答案
        if (game.waitingContinue) {
            if (/^(继续|是|对|要|嗯)/.test(text)) {
                game.waitingContinue = false;
                game.questionCount = 0;
                sendGame('【网络天才游戏】你刚才猜错了，用户选择继续。请继续用大方向二分法提问缩小范围。' + gameContextSuffix(), game.sessionId, null, '回答：继续');
            } else if (/^(公布|公布答案|不是|否|不)/.test(text)) {
                game.waitingContinue = false;
                quickSay('好吧～请告诉我答案吧！', 'aluona_kunhuo.png');
                endGame('user_reveal');
            } else {
                quickSay('请选择"是（继续猜）"或"不是（公布答案）"', 'aluona_kunhuo.png');
            }
            return true;
        }

        // AI 已猜，用户判断对/错
        if (game.waitingJudge) {
            if (/^(对|是|猜对|猜中了|正确|对啦)/.test(text)) {
                endGame('ai_win');
            } else if (/^(错|不是|猜错|不对|错了)/.test(text)) {
                game.waitingJudge = false;
                game.waitingContinue = true;
                if (gameQuickReply) showGameQuickReply();
                quickSay('猜错了～要继续猜吗？', 'aluona_kunhuo.png');
            } else {
                quickSay('请回答"对"或"错"', 'aluona_kunhuo.png');
            }
            return true;
        }

        // 正常：用户回答 AI 的问题
        if (text === '不确定不知道') {
            sendGame('【网络天才游戏】用户回答：不确定不知道（该问题作废、不计入次数，请换一个方向重新问）。' + gameContextSuffix(), game.sessionId, null, '回答：不确定不知道');
        } else {
            game.questionCount++;
            sendGame('【网络天才游戏】用户回答：' + text + '。' + gameContextSuffix() + '请继续用大方向二分法缩小范围；若已有把握或已问满' + game.questionsPerRound + '个问题，就"我猜：物品名"。', game.sessionId, null, '回答：' + text);
        }
        return true;
    } else {
        // AI 出题，用户猜（AI 只允许 是/不是/不确定，不允许"不是但类似"）
        if (text.indexOf('？') >= 0 || text.indexOf('?') >= 0) {
            sendGame('【网络天才游戏】用户问：' + text + '。请只用"是/不是/不确定"三选一简短回答，不要使用"不是但类似""不确定不知道"等其它说法。', game.sessionId, null, text);
        } else {
            sendGame('【网络天才游戏】用户猜：' + text + '。判断他是否猜对你心里想的物品，猜对说"猜对啦"，猜错说"猜错了"。', game.sessionId, function(resp) {
                if (resp.indexOf('猜对') >= 0 || resp.indexOf('猜中') >= 0) { endGame('user_win'); }
                else if (resp.indexOf('猜错') >= 0 || resp.indexOf('不对') >= 0 || resp.indexOf('错了') >= 0) {
                    quickSay('猜错了，再试试～', 'aluona_kunhuo.png');
                }
            });
        }
    }
    return true;
}

function endGame(reason) {
    const sid = game.sessionId;
    const mode = game.mode;
    game.active = false;
    if (reason === 'pause') recordEvent('game', '你和老师的"网络天才"猜物游戏暂停了。');
    else recordEvent('game', '你和老师的"网络天才"猜物游戏结束了（' + (reason === 'user_win' || reason === 'ai_lose' ? '老师获胜' : reason === 'ai_win' || reason === 'user_lose' ? '阿罗娜获胜' : '已结束') + '）。');
    // 游戏结束，AI 基于游戏内容总结一句录入记忆（异步后台）
    axios.post('/ai/game-summary', { character: null, session_id: sid }).catch(() => {});
    if (reason === 'ai_win') { quickSay('我猜对啦！游戏结束～', 'aluona_jidong.png'); }
    else if (reason === 'ai_lose') {
        axios.get('/ai/game-expression', { params: { scene: 'game_wrong' } }).then(r => {
            const m = (r.data.code === 1 && r.data.data) ? r.data.data : 'aluona_kunhuo.png';
            quickSay('猜不出来了，你赢了！快告诉我答案吧～', m);
        }).catch(() => quickSay('猜不出来了，你赢了！快告诉我答案吧～', 'aluona_kunhuo.png'));
    }
    else if (reason === 'user_win') { quickSay('恭喜猜对啦！', 'aluona_jidong.png'); }
    else if (reason === 'user_lose') {
        axios.post('/talk', { user_text: '【网络天才游戏】用户没猜对，请公布你心里想的物品答案。', user_operation: 'game', session_id: sid }).then(r => {
            if (r.data.code === 1) showResult(r.data);
        });
    }
    else if (reason === 'user_reveal') {
        // 用户选择公布答案，游戏结束（提示已由 handleGameInput 发出）
    }
    else if (reason === 'pause') {
        if (mode === 'user_guess') {
            axios.post('/talk', { user_text: '【网络天才游戏】用户暂停了，请公布你心里想的物品答案。', user_operation: 'game', session_id: sid }).then(r => {
                if (r.data.code === 1) showResult(r.data);
            });
        } else {
            quickSay('游戏已暂停～', 'aluona_zhengchang.png');
        }
    }
}
