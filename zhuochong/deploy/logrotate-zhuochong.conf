# ============================================================
# 日志轮转（P3）：后端日志 + NapCat 日志
#
# 安装：
#   sudo cp /root/arona/deploy/logrotate-zhuochong.conf /etc/logrotate.d/zhuochong
#   sudo logrotate -d /etc/logrotate.d/zhuochong   # 干跑验证
#
# 说明：
#   - 后端若走 systemd（deploy/zhuochong-qq.service）日志在 journald，
#     这条只管「手动 nohup / ZC_LOG 落盘」的情况；
#   - NapCat 在 Docker 里，用 docker logs 的 max-size 控制（见文末提示）。
# ============================================================
/root/arona/logs/*.log {
    daily
    rotate 14
    size 20M
    missingok
    notifempty
    compress
    delaycompress
    copytruncate
    dateext
    dateformat -%Y%m%d
}

# NapCat 容器日志不归 logrotate 管，起容器时加参数即可（重建容器时用）：
#   docker run ... --log-opt max-size=20m --log-opt max-file=5 mlikiowa/napcat-docker:latest
#
# journald 占用也可限制（可选）：
#   sudo sed -i 's/^#SystemMaxUse=.*/SystemMaxUse=500M/' /etc/systemd/journald.conf
#   sudo systemctl restart systemd-journald
