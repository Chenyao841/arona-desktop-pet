<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>等待桌宠后端</title>
<style>
  html, body {
    margin: 0; height: 100%; background: transparent; overflow: hidden;
    font: 14px/1.7 "Microsoft YaHei", "Segoe UI", sans-serif;
    color: #eef2f7; user-select: none;
  }
  #card {
    position: absolute; left: 0; right: 0; top: 0; bottom: 0; margin: 8px;
    border-radius: 16px; box-sizing: border-box; padding: 12px 16px 14px;
    background: rgba(24, 25, 33, .95);
    border: 1px solid rgba(255, 255, 255, .1);
    box-shadow: 0 10px 34px rgba(0, 0, 0, .45);
    display: flex; flex-direction: column;
  }
  #head { display: flex; align-items: center; gap: 8px; -webkit-app-region: drag; cursor: move; }
  #dot { width: 9px; height: 9px; border-radius: 50%; background: #ffb454; box-shadow: 0 0 8px #ffb454; flex: none; }
  #dot.ok { background: #4ade80; box-shadow: 0 0 8px #4ade80; }
  #dot.bad { background: #f87171; box-shadow: 0 0 8px #f87171; }
  #title { flex: 1; font-size: 15px; font-weight: 600; }
  #x, #min {
    -webkit-app-region: no-drag; flex: none; width: 24px; height: 24px; line-height: 22px;
    text-align: center; border-radius: 8px; cursor: pointer; color: #9aa4b2; font-size: 14px;
  }
  #x:hover, #min:hover { background: rgba(255, 255, 255, .12); color: #fff; }
  #body { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 5px; }
  #status { font-size: 13px; color: #9fd8ff; }
  #hint { font-size: 12px; color: #8b94a3; line-height: 1.6; }
  #btns { display: flex; gap: 8px; flex-wrap: wrap; }
  button {
    -webkit-app-region: no-drag; font: 13px "Microsoft YaHei", sans-serif;
    padding: 7px 13px; border-radius: 10px; cursor: pointer;
    border: 1px solid rgba(255, 255, 255, .14);
    background: rgba(255, 255, 255, .07); color: #eef2f7;
  }
  button:hover { background: rgba(255, 255, 255, .15); }
  button.primary { background: #3b82f6; border-color: #3b82f6; color: #fff; }
  button.primary:hover { background: #2f74e0; }
</style>
</head>
<body>
<div id="card">
  <div id="head">
    <span id="dot"></span>
    <span id="title">桌宠后端没有运行</span>
    <span id="min" title="收起卡片（后端好了会自动把桌宠叫出来）">—</span>
    <span id="x" title="关闭（不再自动等待，可用托盘菜单重新启动）">✕</span>
  </div>
  <div id="body">
    <div id="status">端口 8080 没有响应</div>
    <div id="hint">桌宠的画面、语音和 AI 都靠这个后端（Spring Boot）。</div>
  </div>
  <div id="btns"></div>
</div>
<script>
  var $ = function (id) { return document.getElementById(id); };
  var statusEl = $('status'), hintEl = $('hint'), btns = $('btns'),
      titleEl = $('title'), dotEl = $('dot');
  var api = window.electronAPI || {};
  var timer = null;

  function send(action) { if (api.backendAction) api.backendAction(action); }
  // —：只收起卡片，等待继续（后端好了自动弹桌宠）
  $('min').onclick = function () { send('minimize'); };
  // ✕：收起并且不再自动等待
  $('x').onclick = function () { send('close'); };

  function setButtons(list) {
    btns.innerHTML = '';
    list.forEach(function (b) {
      var el = document.createElement('button');
      el.textContent = b.label;
      if (b.primary) el.className = 'primary';
      el.onclick = function () { send(b.action); };
      btns.appendChild(el);
    });
  }

  function countUp(prefix) {
    var n = 0;
    clearInterval(timer);
    statusEl.textContent = prefix + ' 已等待 0 秒';
    timer = setInterval(function () {
      n++;
      statusEl.textContent = prefix + ' 已等待 ' + n + ' 秒';
    }, 1000);
  }

  // 初始状态：三选一（按钮在卡片里，不会被置顶窗口盖住，一定能点到）
  setButtons([
    { label: '一键启动后端', action: 'start', primary: true },
    { label: '我自己启动（IDEA）', action: 'self' },
    { label: '先关掉', action: 'close' }
  ]);

  if (api.onBackendStatus) {
    api.onBackendStatus(function (d) {
      if (!d || !d.state) return;
      if (d.state === 'starting') {
        dotEl.className = '';
        titleEl.textContent = '正在启动桌宠后端';
        hintEl.textContent = '命令行窗口里会打印编译/启动日志，首次大约 30 秒 ~ 2 分钟。';
        countUp('正在启动后端…');
        setButtons([{ label: '先关掉', action: 'close' }]);
      } else if (d.state === 'waiting') {
        dotEl.className = '';
        titleEl.textContent = '等待后端启动';
        hintEl.textContent = '在 IDEA 里启动后，桌宠会自动出现。';
        countUp('等待后端启动中…');
        setButtons([{ label: '先关掉', action: 'close' }]);
      } else if (d.state === 'timeout') {
        dotEl.className = 'bad';
        titleEl.textContent = '后端启动超时';
        clearInterval(timer);
        statusEl.textContent = '等了 3 分钟还没起来';
        hintEl.textContent = '看一眼日志 zhuochong-electron\\logs\\backend.log（常见是 8080 被占用或编译失败）。';
        setButtons([
          { label: '再试一次', action: 'start', primary: true },
          { label: '先关掉', action: 'close' }
        ]);
      } else if (d.state === 'ready') {
        dotEl.className = 'ok';
        titleEl.textContent = '后端已就绪';
        clearInterval(timer);
        statusEl.textContent = '正在打开桌宠…';
        hintEl.textContent = '';
      }
    });
  }
</script>
</body>
</html>
